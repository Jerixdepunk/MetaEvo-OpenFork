name: Build MetaEvo OpenFork from Parts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Rebuild and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP parts
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            MetaEvo_OpenFork_BuildSystem.zip.part-aa \
            MetaEvo_OpenFork_BuildSystem.zip.part-ab \
            MetaEvo_OpenFork_BuildSystem.zip.part-ac
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          ls -lh \
            MetaEvo_OpenFork_BuildSystem.zip.part-aa \
            MetaEvo_OpenFork_BuildSystem.zip.part-ab \
            MetaEvo_OpenFork_BuildSystem.zip.part-ac

      - name: Reassemble project ZIP
        shell: bash
        run: |
          set -euo pipefail

          cat \
            MetaEvo_OpenFork_BuildSystem.zip.part-aa \
            MetaEvo_OpenFork_BuildSystem.zip.part-ab \
            MetaEvo_OpenFork_BuildSystem.zip.part-ac \
            > MetaEvo_OpenFork_BuildSystem.zip

          echo "Reassembled ZIP:"
          ls -lh MetaEvo_OpenFork_BuildSystem.zip

      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="6f8325bfeb12db2a51f98ac6246ae5ff1acb2132042a52e06cb35f4bf50e2db9"
          ACTUAL="$(sha256sum MetaEvo_OpenFork_BuildSystem.zip | awk '{print $1}')"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The three ZIP parts do not reconstruct the expected archive."
            exit 1
          fi

          unzip -t MetaEvo_OpenFork_BuildSystem.zip

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q MetaEvo_OpenFork_BuildSystem.zip -d extracted

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not locate settings.gradle.kts in the extracted project."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0"

          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f app/AndroidManifest.xml
          test -f app/apktool.yml
          test -f tools/bootstrap-apktool.sh

          chmod +x gradlew tools/bootstrap-apktool.sh

          echo "Project files verified."
          echo "Smali class count:"
          find app -path '*/smali*' -type f -name '*.smali' | wc -l

      - name: Bootstrap Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APKTOOL_URL="https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
          APKTOOL_SHA256="dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"

          mkdir -p tools
          rm -f tools/apktool.jar

          echo "Downloading Apktool 3.0.3..."

          curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
            -o tools/apktool.jar \
            "$APKTOOL_URL"

          echo "Verifying Apktool SHA-256..."
          echo "$APKTOOL_SHA256  tools/apktool.jar" | sha256sum -c -

          test -s tools/apktool.jar

          echo "Testing Apktool:"
          java -jar tools/apktool.jar --version

      - name: Verify source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./tools/verify-source.sh

      - name: Show Gradle version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --version

      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf build/dist
          mkdir -p build/dist

          ./gradlew assembleOpenFork --no-daemon --stacktrace

          APK="$PROJECT_DIR/build/dist/MetaEvo-OpenFork-unsigned.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Gradle completed but the expected APK was not produced."
            echo "Build directory:"
            find "$PROJECT_DIR/build" -maxdepth 4 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Unsigned APK created:"
          ls -lh "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"
          SIGNED="$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk"
          KEYSTORE="$RUNNER_TEMP/metaevo-openfork.keystore"

          test -s "$UNSIGNED"
          test -x "$BUILD_TOOLS/apksigner"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias openfork \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MetaEvo OpenFork, OU=OpenFork, O=OpenFork, C=PH"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"

          echo "Signed APK:"
          ls -lh "$SIGNED"

          echo "APK SHA-256:"
          sha256sum "$SIGNED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-APK
          path: MetaEvo-OpenFork.apk
          if-no-files-found: error
          retention-days: 7
