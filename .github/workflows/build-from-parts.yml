name: Build MetaEvo OpenFork from Parts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Rebuild and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. CHECK ZIP PARTS
      # ============================================================
      - name: Check ZIP parts
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            MetaEvo_OpenFork_BuildSystem.zip.part-aa \
            MetaEvo_OpenFork_BuildSystem.zip.part-ab \
            MetaEvo_OpenFork_BuildSystem.zip.part-ac
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          echo "All ZIP parts found."

          ls -lh \
            MetaEvo_OpenFork_BuildSystem.zip.part-aa \
            MetaEvo_OpenFork_BuildSystem.zip.part-ab \
            MetaEvo_OpenFork_BuildSystem.zip.part-ac

      # ============================================================
      # 3. REASSEMBLE PROJECT ZIP
      # ============================================================
      - name: Reassemble project ZIP
        shell: bash
        run: |
          set -euo pipefail

          cat \
            MetaEvo_OpenFork_BuildSystem.zip.part-aa \
            MetaEvo_OpenFork_BuildSystem.zip.part-ab \
            MetaEvo_OpenFork_BuildSystem.zip.part-ac \
            > MetaEvo_OpenFork_BuildSystem.zip

          echo "Reassembled ZIP:"
          ls -lh MetaEvo_OpenFork_BuildSystem.zip

      # ============================================================
      # 4. VERIFY PROJECT ZIP
      # ============================================================
      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="6f8325bfeb12db2a51f98ac6246ae5ff1acb2132042a52e06cb35f4bf50e2db9"
          ACTUAL="$(sha256sum MetaEvo_OpenFork_BuildSystem.zip | awk '{print $1}')"

          echo "Expected SHA-256:"
          echo "$EXPECTED"

          echo "Actual SHA-256:"
          echo "$ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::ZIP checksum mismatch."
            exit 1
          fi

          echo "ZIP checksum verified."

          echo "Testing ZIP integrity..."

          unzip -t MetaEvo_OpenFork_BuildSystem.zip

          echo "ZIP integrity verified."

      # ============================================================
      # 5. EXTRACT PROJECT
      # ============================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q MetaEvo_OpenFork_BuildSystem.zip -d extracted

          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name settings.gradle.kts \
              -print -quit |
              xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 6. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 7. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 8. ANDROID BUILD TOOLS
      # ============================================================
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0"

          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "Android build tools verified."

      # ============================================================
      # 9. VERIFY PROJECT FILES
      # ============================================================
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f app/AndroidManifest.xml
          test -f app/apktool.yml
          test -f tools/bootstrap-apktool.sh
          test -f tools/verify-source.sh

          chmod +x gradlew
          chmod +x tools/bootstrap-apktool.sh
          chmod +x tools/verify-source.sh

          echo "Project files verified."

          echo "Smali class count:"
          find app \
            -path '*/smali*' \
            -type f \
            -name '*.smali' |
            wc -l

      # ============================================================
      # 10. NORMALIZE APKTOOL METADATA
      # ============================================================
      - name: Normalize Apktool metadata
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Apktool metadata before normalization:"
          grep -nE '^[[:space:]]*version(Code|Name):' \
            app/apktool.yml || true

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/apktool.yml")
          text = path.read_text(encoding="utf-8")

          original = text

          pattern = re.compile(
              r'^(\s*versionCode:\s*)(["\'])([0-9]+)\2(\s*)$',
              re.MULTILINE
          )

          text = pattern.sub(
              lambda m: f"{m.group(1)}{m.group(3)}{m.group(4)}",
              text
          )

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Quoted versionCode normalized.")
          else:
              print("No quoted versionCode required normalization.")

          match = re.search(
              r'^\s*versionCode:\s*([0-9]+)\s*$',
              text,
              re.MULTILINE
          )

          if not match:
              raise SystemExit(
                  "ERROR: versionCode is missing or is not numeric."
              )

          print("Validated versionCode:", match.group(1))
          PY

          echo "Apktool metadata after normalization:"
          grep -nE '^[[:space:]]*version(Code|Name):' \
            app/apktool.yml || true

      # ============================================================
      # 11. BOOTSTRAP APKTOOL 3.0.3
      # ============================================================
      - name: Bootstrap Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APKTOOL_URL="https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
          APKTOOL_SHA256="dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"

          mkdir -p tools
          rm -f tools/apktool.jar

          curl \
            -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -o tools/apktool.jar \
            "$APKTOOL_URL"

          test -s tools/apktool.jar

          echo "$APKTOOL_SHA256  tools/apktool.jar" |
            sha256sum -c -

          echo "Apktool SHA-256 verified."

          java -jar tools/apktool.jar --version

      # ============================================================
      # 12. PRUNE ORPHANED PUBLIC.XML RESOURCE DECLARATIONS
      #
      # public.xml can declare fixed IDs for resources that no longer
      # exist anywhere in the source tree (lost before packaging).
      # AAPT2 fails to link if a declared symbol has no definition.
      #
      # This build's own resource tree (every file under non-values
      # res/ directories, plus every named tag/item declared inside
      # any values/*.xml file) is used as the source of truth for
      # "does this resource actually exist?" -- covering ALL resource
      # types generically (drawable, mipmap, layout, interpolator,
      # anim, color, string, style, attr, id, etc.), not a fixed list.
      # Only <public> entries with no matching definition are removed.
      # ============================================================
      - name: Prune orphaned public.xml declarations
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          res = Path("app/res")
          public_xml_path = res / "values" / "public.xml"
          text = public_xml_path.read_text(encoding="utf-8")

          declared = set()

          name_tag_re = re.compile(r'<([\w.-]+)\b([^>]*)/?>')
          attr_pair_re = re.compile(r'([\w:.-]+)\s*=\s*"([^"]*)"')

          # 1. Every name= declared anywhere inside any values/*.xml file
          #    (colors, strings, styles, attrs, ids, styleables, etc.)
          for xml_file in res.rglob("*.xml"):
              if xml_file == public_xml_path:
                  continue
              try:
                  content = xml_file.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for m in name_tag_re.finditer(content):
                  tag = m.group(1)
                  attrs = dict(attr_pair_re.findall(m.group(2)))
                  name = attrs.get("name")
                  if not name:
                      continue
                  if tag == "item":
                      rtype = attrs.get("type")
                      if rtype:
                          declared.add((rtype, name))
                  else:
                      declared.add((tag, name))

          # 2. Every file inside a non-values resource directory
          #    (drawable*, mipmap*, layout*, interpolator*, anim*, ...)
          for entry in res.iterdir():
              if not entry.is_dir():
                  continue
              if entry.name == "values" or entry.name.startswith("values-"):
                  continue
              rtype = entry.name.split("-")[0]
              for f in entry.iterdir():
                  if f.is_file():
                      declared.add((rtype, f.stem))

          def resource_exists(rtype, name):
              return (rtype, name) in declared

          pattern = re.compile(r'<public\s+([^>]*?)/>', re.DOTALL)

          removed = []

          def repl(m):
              attrs = dict(attr_pair_re.findall(m.group(1)))
              rtype = attrs.get("type")
              name = attrs.get("name")
              if rtype and name and not resource_exists(rtype, name):
                  removed.append(f"{rtype}/{name}")
                  return ""
              return m.group(0)

          new_text = pattern.sub(repl, text)

          if removed:
              public_xml_path.write_text(new_text, encoding="utf-8")
              print(f"Removed {len(removed)} orphaned public.xml declarations:")
              for r in removed:
                  print(" -", r)
          else:
              print("No orphaned declarations found.")
          PY

      # ============================================================
      # 13. REPAIR RAW GRAVITY FLAG VALUES IN STYLES
      #
      # AAPT2 requires flags-typed attributes (like android:gravity)
      # to use symbolic flag names ("center", "bottom|center_horizontal")
      # rather than raw integers. Apktool sometimes decompiles these
      # back as bare hex/decimal values, which AAPT2 then rejects with
      # "expected flags but got (raw string) 0x..". This decodes any
      # such raw gravity values into their symbolic equivalent using
      # the same bitmasks Android's framework defines for gravity.
      # ============================================================
      - name: Repair raw gravity flag values in styles
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          res = Path("app/res")

          GRAVITY_VERTICAL = {
              0x70: "fill_vertical",
              0x50: "bottom",
              0x30: "top",
              0x10: "center_vertical",
          }
          GRAVITY_HORIZONTAL = {
              0x07: "fill_horizontal",
              0x05: "right",
              0x03: "left",
              0x01: "center_horizontal",
          }
          GRAVITY_EXACT = {
              0x11: "center",
              0x77: "fill",
          }

          def decode_gravity(value):
              if value in GRAVITY_EXACT:
                  return GRAVITY_EXACT[value]

              parts = []
              remaining = value

              vmask = value & 0x70
              if vmask in GRAVITY_VERTICAL:
                  parts.append(GRAVITY_VERTICAL[vmask])
                  remaining &= ~0x70

              hmask = value & 0x07
              if hmask in GRAVITY_HORIZONTAL:
                  parts.append(GRAVITY_HORIZONTAL[hmask])
                  remaining &= ~0x07

              if value & 0x80:
                  parts.append("clip_vertical")
                  remaining &= ~0x80

              if value & 0x08:
                  parts.append("clip_horizontal")
                  remaining &= ~0x08

              if remaining != 0 or not parts:
                  return None

              return "|".join(parts)

          item_pattern = re.compile(
              r'(<item\s+name="[^"]*[Gg]ravity"[^>]*>)\s*'
              r'(0[xX][0-9a-fA-F]+|-?[0-9]+)\s*(</item>)'
          )

          total_fixed = 0

          for xml_file in res.rglob("*.xml"):
              text = xml_file.read_text(encoding="utf-8")
              fixed = []

              def repl(m, fixed=fixed):
                  open_tag, raw_value, close_tag = m.group(1), m.group(2), m.group(3)
                  value = (
                      int(raw_value, 16)
                      if raw_value.lower().startswith("0x")
                      else int(raw_value)
                  )
                  symbolic = decode_gravity(value)
                  if symbolic is None:
                      return m.group(0)
                  fixed.append(f"{raw_value} -> {symbolic}")
                  return f"{open_tag}{symbolic}{close_tag}"

              new_text = item_pattern.sub(repl, text)

              if fixed:
                  xml_file.write_text(new_text, encoding="utf-8")
                  total_fixed += len(fixed)
                  print(f"{xml_file.relative_to(res)}:")
                  for f in fixed:
                      print("  -", f)

          print(f"Total gravity values converted: {total_fixed}")
          PY

      # ============================================================
      # 14. REPAIR MALFORMED 9-PATCH RESOURCES
      #
      # AAPT2 rejects malformed .9.png frame pixels.
      #
      # We validate the frame according to the AAPT2 rules:
      # - transparent neutral color OR opaque white neutral color
      # - opaque black marker
      # - opaque red marker
      #
      # ONLY malformed .9.png files are converted to ordinary .png.
      # Valid .9.png resources remain untouched.
      # ============================================================
      - name: Repair malformed 9-patch resources
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import struct
          import zlib
          import binascii

          root = Path("app/res")

          def read_png_rgba(path):
              data = path.read_bytes()

              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise ValueError("not a PNG")

              pos = 8
              width = height = None
              color_type = None
              bit_depth = None
              idat = bytearray()

              while pos < len(data):
                  length = struct.unpack(">I", data[pos:pos+4])[0]
                  ctype = data[pos+4:pos+8]
                  chunk = data[pos+8:pos+8+length]
                  pos += 12 + length

                  if ctype == b'IHDR':
                      width, height, bit_depth, color_type, _, _, _ = struct.unpack(
                          ">IIBBBBB", chunk
                      )

                  elif ctype == b'IDAT':
                      idat.extend(chunk)

                  elif ctype == b'IEND':
                      break

              if width is None:
                  raise ValueError("missing IHDR")

              if bit_depth != 8:
                  raise ValueError("unsupported bit depth")

              raw = zlib.decompress(bytes(idat))

              if color_type == 6:
                  channels = 4
              elif color_type == 2:
                  channels = 3
              else:
                  raise ValueError("unsupported PNG color type")

              stride = width * channels
              rows = []
              offset = 0
              previous = bytearray(stride)

              for _ in range(height):
                  filter_type = raw[offset]
                  offset += 1

                  current = bytearray(raw[offset:offset+stride])
                  offset += stride

                  for i in range(stride):
                      left = current[i-channels] if i >= channels else 0
                      up = previous[i]
                      up_left = previous[i-channels] if i >= channels else 0

                      if filter_type == 0:
                          value = current[i]

                      elif filter_type == 1:
                          value = (current[i] + left) & 255
                          current[i] = value

                      elif filter_type == 2:
                          value = (current[i] + up) & 255
                          current[i] = value

                      elif filter_type == 3:
                          value = (current[i] + ((left + up) // 2)) & 255
                          current[i] = value

                      elif filter_type == 4:
                          p = left + up - up_left
                          pa = abs(p-left)
                          pb = abs(p-up)
                          pc = abs(p-up_left)

                          if pa <= pb and pa <= pc:
                              predictor = left
                          elif pb <= pc:
                              predictor = up
                          else:
                              predictor = up_left

                          current[i] = (current[i] + predictor) & 255

                      else:
                          raise ValueError(
                              f"unsupported PNG filter {filter_type}"
                          )

                  previous = current
                  rows.append(current)

              pixels = []

              for row in rows:
                  row_pixels = []

                  for x in range(width):
                      base = x * channels

                      if channels == 4:
                          r, g, b, a = row[base:base+4]
                      else:
                          r, g, b = row[base:base+3]
                          a = 255

                      row_pixels.append((r, g, b, a))

                  pixels.append(row_pixels)

              return width, height, pixels

          def valid_color(color, neutral):
              if color == (0, 0, 0, 255):
                  return True

              if color == (255, 0, 0, 255):
                  return True

              if color == neutral:
                  return True

              return False

          invalid_files = []

          for path in sorted(root.rglob("*.9.png")):
              try:
                  width, height, pixels = read_png_rgba(path)

                  if width < 3 or height < 3:
                      invalid_files.append(
                          (path, "image smaller than 3x3")
                      )
                      continue

                  top_left = pixels[0][0]

                  if top_left[3] == 0:
                      neutral = (0, 0, 0, 0)
                  elif top_left == (255, 255, 255, 255):
                      neutral = (255, 255, 255, 255)
                  else:
                      invalid_files.append(
                          (path, "invalid top-left neutral color")
                      )
                      continue

                  valid = True

                  # Top and bottom borders.
                  for x in range(1, width - 1):
                      if not valid_color(pixels[0][x], neutral):
                          valid = False
                          break

                      if not valid_color(pixels[height - 1][x], neutral):
                          valid = False
                          break

                  # Left and right borders.
                  if valid:
                      for y in range(1, height - 1):
                          if not valid_color(pixels[y][0], neutral):
                              valid = False
                              break

                          if not valid_color(pixels[y][width - 1], neutral):
                              valid = False
                              break

                  if not valid:
                      invalid_files.append(
                          (path, "invalid 9-patch frame color")
                      )

              except Exception as exc:
                  invalid_files.append(
                      (path, f"could not validate: {exc}")
                  )

          print(f"Total .9.png files found: {len(list(root.rglob('*.9.png')))}")
          print(f"Malformed .9.png files found: {len(invalid_files)}")

          for path, reason in invalid_files:
              new_path = path.with_name(path.name[:-6] + ".png")

              if new_path.exists():
                  raise SystemExit(
                      f"Cannot repair {path}: destination already exists: {new_path}"
                  )

              path.rename(new_path)

              print(
                  "REPAIRED:",
                  path.relative_to(root),
                  "->",
                  new_path.relative_to(root),
                  "(" + reason + ")"
              )

          remaining = list(root.rglob("*.9.png"))

          print(
              "Remaining valid .9.png resources:",
              len(remaining)
          )

          print(
              "Malformed resources converted to ordinary PNG:",
              len(invalid_files)
          )
          PY

          echo ""
          echo "9-patch repair complete."

          echo "Remaining .9.png resources:"
          find app/res \
            -type f \
            -name '*.9.png' |
            wc -l

      # ============================================================
      # 15. VERIFY SOURCE STRUCTURE
      # ============================================================
      - name: Verify source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./tools/verify-source.sh

      # ============================================================
      # 16. SHOW GRADLE VERSION
      # ============================================================
      - name: Show Gradle version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 17. BUILD UNSIGNED APK
      # ============================================================
      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf build/dist
          mkdir -p build/dist

          echo "Starting APK rebuild..."

          ./gradlew \
            assembleOpenFork \
            --no-daemon \
            --stacktrace

          APK="$PROJECT_DIR/build/dist/MetaEvo-OpenFork-unsigned.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Expected unsigned APK was not produced."

            echo "Searching for APK files..."

            find "$PROJECT_DIR/build" \
              -type f \
              -name '*.apk' \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "Unsigned APK successfully created:"
          ls -lh "$APK"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"

      # ============================================================
      # 18. SIGN APK
      # ============================================================
      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"
          SIGNED="$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk"
          KEYSTORE="$RUNNER_TEMP/metaevo-openfork.keystore"

          test -s "$UNSIGNED"
          test -x "$BUILD_TOOLS/apksigner"

          echo "Generating temporary signing key..."

          keytool \
            -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias openfork \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MetaEvo OpenFork, OU=OpenFork, O=OpenFork, C=PH"

          echo "Signing APK..."

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" \
            "$UNSIGNED"

          test -s "$SIGNED"

          echo "Verifying APK signature..."

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$SIGNED"

          echo "APK signature verification passed."

          echo "Final APK:"
          ls -lh "$SIGNED"

          echo "Final APK SHA-256:"
          sha256sum "$SIGNED"

      # ============================================================
      # 19. UPLOAD FINAL APK
      # ============================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-APK
          path: MetaEvo-OpenFork.apk
          if-no-files-found: error
          retention-days: 7
