name: Build MetaEvo OpenFork from Parts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble project ZIP
        shell: bash
        run: |
          set -e

          cat MetaEvo_OpenFork_BuildSystem.zip.part-aa \
              MetaEvo_OpenFork_BuildSystem.zip.part-ab \
              MetaEvo_OpenFork_BuildSystem.zip.part-ac \
              > MetaEvo_OpenFork_BuildSystem.zip

      - name: Verify ZIP checksum
        shell: bash
        run: |
          set -e

          echo "6f8325bfeb12db2a51f98ac6246ae5ff1acb2132042a52e06cb35f4bf50e2db9  MetaEvo_OpenFork_BuildSystem.zip" | sha256sum -c -

      - name: Extract project
        shell: bash
        run: |
          set -e

          mkdir extracted
          unzip -q MetaEvo_OpenFork_BuildSystem.zip -d extracted

          PROJECT_DIR="$(find extracted -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleOpenFork --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No APK was produced."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"

      - name: Sign APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "Android build-tools not found."
            exit 1
          fi

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/openfork.keystore" \
            -storepass android \
            -keypass android \
            -alias openfork \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MetaEvo OpenFork, OU=OpenFork, O=OpenFork, C=PH"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/openfork.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk" \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk"

          sha256sum "$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-APK
          path: MetaEvo-OpenFork.apk
          if-no-files-found: error
