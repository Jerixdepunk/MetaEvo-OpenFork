name: Build MetaEvo OpenFork from Parts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-from-parts.yml"
      - "MetaEvo_OpenFork_BuildSystem.zip.part-aa"
      - "MetaEvo_OpenFork_BuildSystem.zip.part-ab"
      - "MetaEvo_OpenFork_BuildSystem.zip.part-ac"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify source parts exist
        run: |
          set -euo pipefail

          for f in \
            MetaEvo_OpenFork_BuildSystem.zip.part-aa \
            MetaEvo_OpenFork_BuildSystem.zip.part-ab \
            MetaEvo_OpenFork_BuildSystem.zip.part-ac
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing source part: $f"
              exit 1
            fi
          done

      - name: Verify source part hashes
        run: |
          set -euo pipefail

          echo "Checking part-aa..."
          echo "e6429a7abaddebcb08429a1fca30a348a526f54d0dad869eaf6e30bcbda2ba10  MetaEvo_OpenFork_BuildSystem.zip.part-aa" | sha256sum -c -

          echo "Checking part-ab..."
          echo "00f7ffdfae415401a3b6714b42309e5aa605c3d4ff7a1b806c938eb1647abe6  MetaEvo_OpenFork_BuildSystem.zip.part-ab" | sha256sum -c -

          echo "Checking part-ac..."
          echo "d4fc4c210adfed9b5c6870a309d98cce89ece417f8b699313d7a280cac269756  MetaEvo_OpenFork_BuildSystem.zip.part-ac" | sha256sum -c -

      - name: Reconstruct source archive
        run: |
          set -euo pipefail

          mkdir -p build/source
          cat \
            MetaEvo_OpenFork_BuildSystem.zip.part-aa \
            MetaEvo_OpenFork_BuildSystem.zip.part-ab \
            MetaEvo_OpenFork_BuildSystem.zip.part-ac \
            > build/source/MetaEvo_OpenFork_BuildSystem.zip

      - name: Verify reconstructed archive
        run: |
          set -euo pipefail

          EXPECTED="6f8325bfeb12db2a51f98ac6246ae5ff1acb2132042a52a52a52e06cb35f4bf50e2db9"

          ACTUAL="$(sha256sum build/source/MetaEvo_OpenFork_BuildSystem.zip | awk '{print $1}')"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Reconstructed source archive hash does not match."
            exit 1
          fi

          unzip -t build/source/MetaEvo_OpenFork_BuildSystem.zip

      - name: Extract source
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            build/source/MetaEvo_OpenFork_BuildSystem.zip \
            -d extracted

          PROJECT="$(find extracted -name settings.gradle.kts -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "::error::settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PROJECT")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_ROOT"

      - name: Validate original project
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f app/AndroidManifest.xml
          test -f app/apktool.yml
          test -f tools/verify-source.sh

          SMALI_COUNT="$(find app -type f -name '*.smali' | wc -l | tr -d ' ')"

          echo "Smali classes: $SMALI_COUNT"

          if [ "$SMALI_COUNT" -ne 16496 ]; then
            echo "::error::Unexpected smali class count: $SMALI_COUNT"
            exit 1
          fi

          if grep -R "CHECK_LICENSE" app 2>/dev/null; then
            echo "::error::CHECK_LICENSE reference detected."
            exit 1
          fi

          if grep -q "com.google.android.gms.permission.AD_ID" app/AndroidManifest.xml; then
            echo "::error::AD_ID permission detected."
            exit 1
          fi

      - name: Create working copy
        run: |
          set -euo pipefail

          rm -rf build/work
          mkdir -p build/work

          cp -a "$PROJECT_ROOT/." build/work/

          echo "WORK_ROOT=$GITHUB_WORKSPACE/build/work" >> "$GITHUB_ENV"

      - name: Normalize Apktool metadata
        run: |
          set -euo pipefail

          cd "$WORK_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/apktool.yml")
          text = p.read_text(encoding="utf-8")

          # Apktool expects versionCode as a numeric YAML value.
          text = re.sub(
              r"(?m)^(\s*versionCode:\s*)['\"]?100['\"]?\s*$",
              r"\g<1>100",
              text
          )

          if not re.search(r"(?m)^\s*versionCode:\s*\d+\s*$", text):
              text += "\nversionCode: 100\n"

          if not re.search(r"(?m)^\s*versionName:", text):
              text += "versionName: 1.0.0-openfork\n"

          p.write_text(text, encoding="utf-8")
          PY

          echo "Normalized apktool.yml:"
          grep -n "versionCode\|versionName" app/apktool.yml || true

      - name: Download Apktool 3.0.3
        run: |
          set -euo pipefail

          cd "$WORK_ROOT"

          mkdir -p tools

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o tools/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"

          EXPECTED="dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"

          echo "$EXPECTED  tools/apktool.jar" | sha256sum -c -

      - name: Repair malformed NinePatch resources
        run: |
          set -euo pipefail

          cd "$WORK_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import struct

          def png_size(path):
              try:
                  with path.open("rb") as f:
                      sig = f.read(8)
                      if sig != b"\x89PNG\r\n\x1a\n":
                          return None
                      length = struct.unpack(">I", f.read(4))[0]
                      chunk = f.read(4)
                      if chunk != b"IHDR":
                          return None
                      width, height = struct.unpack(">II", f.read(8))
                      return width, height
              except Exception:
                  return None

          root = Path("app/res")
          repaired = 0

          for p in root.rglob("*.9.png"):
              # Apktool/AAPT2 can reject malformed NinePatch border metadata.
              # Preserve the resource and pixel content, but make it an ordinary PNG.
              try:
                  data = p.read_bytes()
                  if len(data) < 8 or data[:8] != b"\x89PNG\r\n\x1a\n":
                      continue

                  # Inspect the PNG pixels only when Pillow is available.
                  malformed = False

                  try:
                      from PIL import Image

                      im = Image.open(p).convert("RGBA")
                      w, h = im.size

                      if w < 3 or h < 3:
                          malformed = True
                      else:
                          # NinePatch metadata lives on the 1-pixel border.
                          # Valid border pixels must be transparent or solid black.
                          border = []

                          for x in range(w):
                              border.append(im.getpixel((x, 0)))
                              border.append(im.getpixel((x, h - 1)))

                          for y in range(h):
                              border.append(im.getpixel((0, y)))
                              border.append(im.getpixel((w - 1, y)))

                          allowed = {(0, 0, 0, 0), (0, 0, 0, 255)}

                          if any(px not in allowed for px in border):
                              malformed = True

                  except Exception:
                      # If Pillow is unavailable or decoding fails, leave the file
                      # untouched rather than guessing.
                      continue

                  if malformed:
                      new = p.with_name(p.name[:-6] + ".png")
                      if new.exists():
                          new.unlink()
                      p.rename(new)
                      repaired += 1

              except Exception:
                  pass

          print(f"Repaired malformed NinePatch resources: {repaired}")
          PY

      - name: Add missing SDK drawable fallbacks
        run: |
          set -euo pipefail

          cd "$WORK_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import base64

          # 1x1 transparent PNG.
          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk"
              "+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )

          names = [
              "mbridge_reward_notice",
              "tt_dislike_icon",
              "tt_mute_btn_bg",
              "tt_new_pause_video",
              "tt_pangle_ad_close_drawable",
              "tt_seek_thumb_fullscreen",
              "tt_shadow_lefterback_titlebar",
              "tt_shadow_lefterback_titlebar_press",
              "tt_slide_up_1",
              "tt_slide_up_13",
              "tt_slide_up_14",
          ]

          created = 0

          for name in names:
              candidates = list(Path("app/res").glob(f"drawable*/{name}.png"))

              if candidates:
                  continue

              target_dir = Path("app/res/drawable")
              target_dir.mkdir(parents=True, exist_ok=True)

              target = target_dir / f"{name}.png"

              if not target.exists():
                  target.write_bytes(png)
                  created += 1

          print(f"Created drawable fallbacks: {created}")
          PY

      - name: Run source verification
        run: |
          set -euo pipefail

          cd "$WORK_ROOT"

          chmod +x tools/verify-source.sh

          ./tools/verify-source.sh

      - name: Build unsigned APK
        run: |
          set -euo pipefail

          cd "$WORK_ROOT"

          mkdir -p build/dist
          mkdir -p build/logs

          set +e

          java -Xmx4g \
            -jar tools/apktool.jar \
            b app \
            -f \
            -o build/dist/MetaEvo-OpenFork-unsigned.apk \
            2>&1 | tee build/logs/apktool-build.log

          STATUS="${PIPESTATUS[0]}"

          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Apktool build failed."
            exit "$STATUS"
          fi

          test -s build/dist/MetaEvo-OpenFork-unsigned.apk

          unzip -t build/dist/MetaEvo-OpenFork-unsigned.apk

      - name: Create temporary signing key
        run: |
          set -euo pipefail

          cd "$WORK_ROOT"

          keytool \
            -genkeypair \
            -v \
            -keystore build/openfork-ci.jks \
            -storepass changeit \
            -keypass changeit \
            -alias openfork \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MetaEvo OpenFork, OU=CI, O=OpenFork, L=Local, ST=Local, C=PH"

      - name: Sign APK
        run: |
          set -euo pipefail

          cd "$WORK_ROOT"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks build/openfork-ci.jks \
            --ks-key-alias openfork \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out build/dist/MetaEvo-OpenFork.apk \
            build/dist/MetaEvo-OpenFork-unsigned.apk

      - name: Verify signed APK
        run: |
          set -euo pipefail

          cd "$WORK_ROOT"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            build/dist/MetaEvo-OpenFork.apk

          unzip -t build/dist/MetaEvo-OpenFork.apk

          ls -lh build/dist/MetaEvo-OpenFork.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-build
          path: |
            ${{ env.WORK_ROOT }}/build/dist/MetaEvo-OpenFork.apk
            ${{ env.WORK_ROOT }}/build/dist/MetaEvo-OpenFork-unsigned.apk
            ${{ env.WORK_ROOT }}/build/logs/apktool-build.log
          if-no-files-found: error
          retention-days: 30
