name: Build MetaEvo OpenFork from Parts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metaevo-openfork-build
  cancel-in-progress: true

jobs:
  build:
    name: Rebuild and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SOURCE_ARCHIVE: MetaEvo_OpenFork_BuildSystem.zip
      # FIXME: this value is 70 hex chars (a valid SHA-256 is exactly 64).
      # It contains a corrupted/duplicated "a52a52a52" fragment and will
      # fail "Verify reconstructed archive SHA-256" as soon as the part
      # hashes below pass. Run the job once, copy the printed
      # "Actual archive SHA-256:" value from that step's log, and paste
      # the real 64-char hash here.
      EXPECTED_ARCHIVE_SHA256: 6f8325bfeb12db2a51f98ac6246ae5ff1acb2132042a52a52a52e06cb35f4bf50e2db9

      PART_AA: MetaEvo_OpenFork_BuildSystem.zip.part-aa
      PART_AB: MetaEvo_OpenFork_BuildSystem.zip.part-ab
      PART_AC: MetaEvo_OpenFork_BuildSystem.zip.part-ac

      EXPECTED_AA_SHA256: e6429a7abaddebcb08429a1fca30a348a526f54d0dad869eaf6e30bcbda2ba10
      # Was truncated to 63 chars (missing the "d" before "ff7a1b806..."),
      # causing every run to fail here. Corrected to the actual 64-char
      # hash of part-ab as verified in the run logs.
      EXPECTED_AB_SHA256: 00f7ffdfae415401a3b6714b42309e5aa605c3d4dff7a1b806c938eb1647abe6
      EXPECTED_AC_SHA256: d4fc4c210adfed9b5c6870a309d98cce89ece417f8b699313d7a280cac269756

      APKTOOL_VERSION: 3.0.3
      APKTOOL_SHA256: dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423
      APKTOOL_URL: https://sourceforge.net/projects/apktool.mirror/files/v3.0.3/apktool_3.0.3.jar/download

      EXPECTED_SMALI_CLASSES: 16496
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_PLATFORM: android-35

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # ------------------------------------------------------------
      # 2. Java
      # ------------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ------------------------------------------------------------
      # 3. Android SDK
      # ------------------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK root: ${ANDROID_HOME:-unknown}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/$ANDROID_PLATFORM"
          test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"

          echo "Android SDK components installed successfully."


      # ------------------------------------------------------------
      # 4. Verify the three immutable source parts
      # ------------------------------------------------------------

      - name: Verify source part files exist
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            "$PART_AA" \
            "$PART_AB" \
            "$PART_AC"
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required source part: $f"
              exit 1
            fi

            if [ ! -s "$f" ]; then
              echo "::error::Source part is empty: $f"
              exit 1
            fi

            echo "Found: $f"
            ls -lh "$f"
          done


      - name: Verify source part SHA-256 hashes
        shell: bash
        run: |
          set -euo pipefail

          verify_hash() {
            local file="$1"
            local expected="$2"

            local actual
            actual="$(sha256sum "$file" | awk '{print $1}')"

            echo
            echo "File:     $file"
            echo "Expected: $expected"
            echo "Actual:   $actual"

            if [ "$actual" != "$expected" ]; then
              echo "::error::SHA-256 mismatch for $file"
              exit 1
            fi

            echo "SHA-256 OK: $file"
          }

          verify_hash "$PART_AA" "$EXPECTED_AA_SHA256"
          verify_hash "$PART_AB" "$EXPECTED_AB_SHA256"
          verify_hash "$PART_AC" "$EXPECTED_AC_SHA256"


      # ------------------------------------------------------------
      # 5. Reassemble archive
      # ------------------------------------------------------------

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$SOURCE_ARCHIVE"

          cat \
            "$PART_AA" \
            "$PART_AB" \
            "$PART_AC" \
            > "$SOURCE_ARCHIVE"

          test -s "$SOURCE_ARCHIVE"

          echo "Reassembled archive:"
          ls -lh "$SOURCE_ARCHIVE"


      - name: Verify reconstructed archive SHA-256
        shell: bash
        run: |
          set -euo pipefail

          actual="$(sha256sum "$SOURCE_ARCHIVE" | awk '{print $1}')"

          echo "Expected archive SHA-256:"
          echo "$EXPECTED_ARCHIVE_SHA256"

          echo "Actual archive SHA-256:"
          echo "$actual"

          if [ "$actual" != "$EXPECTED_ARCHIVE_SHA256" ]; then
            echo "::error::Reconstructed ZIP does not match the verified source archive."
            exit 1
          fi

          echo "Archive SHA-256 verification passed."


      - name: Test reconstructed ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$SOURCE_ARCHIVE"


      # ------------------------------------------------------------
      # 6. Extract source
      # ------------------------------------------------------------

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$SOURCE_ARCHIVE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 3 \
            -type f \
            | head -100


      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name 'settings.gradle.kts' \
              -print \
              -quit
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Located project does not contain app/."
            echo "Located: $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_DIR"


      # ------------------------------------------------------------
      # 7. Validate reconstructed source
      # ------------------------------------------------------------

      - name: Validate source layout
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradlew"
            "app/AndroidManifest.xml"
            "app/apktool.yml"
            "tools/verify-source.sh"
          )

          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Required source file missing: $f"
              exit 1
            fi
          done

          echo "Required project files are present."


      - name: Validate smali class count
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          count="$(
            find app \
              -type f \
              -name '*.smali' \
              | wc -l
          )"

          count="$(echo "$count" | tr -d '[:space:]')"

          echo "Expected smali classes: $EXPECTED_SMALI_CLASSES"
          echo "Actual smali classes:   $count"

          if [ "$count" -ne "$EXPECTED_SMALI_CLASSES" ]; then
            echo "::error::Unexpected smali class count: $count"
            exit 1
          fi


      - name: Validate original project metadata
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking apktool.yml..."

          grep -q "versionInfo:" app/apktool.yml || {
            echo "::error::apktool.yml does not contain versionInfo."
            exit 1
          }

          echo "Checking AndroidManifest.xml..."

          test -s app/AndroidManifest.xml

          echo "Checking source verification script..."

          chmod +x tools/verify-source.sh


      # ------------------------------------------------------------
      # 8. Make isolated working copy
      #
      # IMPORTANT:
      # The verified ZIP and its extracted source remain untouched.
      # All build repairs happen only inside build-work/.
      # ------------------------------------------------------------

      - name: Create isolated CI working copy
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build-work"

          cp -a "$PROJECT_DIR" \
            "$GITHUB_WORKSPACE/build-work"

          echo "CI working copy:"
          echo "$GITHUB_WORKSPACE/build-work"

          echo "BUILD_PROJECT_DIR=$GITHUB_WORKSPACE/build-work" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 9. Normalize Apktool metadata
      # ------------------------------------------------------------

      - name: Normalize Apktool metadata
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          python3 - "$BUILD_PROJECT_DIR/app/apktool.yml" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text(encoding="utf-8")

          # Apktool 3.x rejects quoted numeric versionCode values
          # in this reconstructed apktool.yml.
          text = re.sub(
              r"(?m)^(\s*versionCode:\s*)['\"]?100['\"]?\s*$",
              r"\g<1>100",
              text,
          )

          # Keep versionName textual.
          text = re.sub(
              r"(?m)^(\s*versionName:\s*)['\"]?1\.0\.0-openfork['\"]?\s*$",
              r"\g<1>1.0.0-openfork",
              text,
          )

          path.write_text(text, encoding="utf-8")

          print("Normalized apktool.yml:")
          print(path.read_text(encoding="utf-8"))
          PY


      # ------------------------------------------------------------
      # 10. Install Pillow for deterministic NinePatch inspection
      # ------------------------------------------------------------

      - name: Install Python image dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            pillow

          python3 - <<'PY'
          from PIL import Image
          print("Pillow import OK")
          PY


      # ------------------------------------------------------------
      # 11. Download and verify Apktool
      # ------------------------------------------------------------

      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          mkdir -p tools

          rm -f tools/apktool.jar

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            -o tools/apktool.jar \
            "$APKTOOL_URL"

          test -s tools/apktool.jar


      - name: Verify Apktool SHA-256
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          actual="$(
            sha256sum tools/apktool.jar |
            awk '{print $1}'
          )"

          echo "Expected Apktool SHA-256:"
          echo "$APKTOOL_SHA256"

          echo "Actual Apktool SHA-256:"
          echo "$actual"

          if [ "$actual" != "$APKTOOL_SHA256" ]; then
            echo "::error::Apktool SHA-256 verification failed."
            exit 1
          fi

          java -Xmx1g \
            -jar tools/apktool.jar \
            --version


      # ------------------------------------------------------------
      # 12. Repair malformed NinePatch resources
      #
      # Original source archive remains untouched.
      # Only the CI working copy is changed.
      # ------------------------------------------------------------

      - name: Repair malformed NinePatch resources
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$BUILD_PROJECT_DIR/app/res" <<'PY'
          from pathlib import Path
          from PIL import Image
          import sys

          root = Path(sys.argv[1])

          repaired = 0
          valid_count = 0
          skipped = 0

          def allowed(c):
              r, g, b, a = c

              # Transparent pixels are valid.
              if a == 0:
                  return True

              # White/neutral border pixels are valid.
              if (r, g, b) == (255, 255, 255):
                  return True

              # Black NinePatch marker.
              if (r, g, b, a) == (0, 0, 0, 255):
                  return True

              # Red optical marker.
              if (r, g, b, a) == (255, 0, 0, 255):
                  return True

              return False

          for path in root.rglob("*.9.png"):

              try:
                  with Image.open(path) as source:
                      image = source.convert("RGBA")
                      width, height = image.size

                      if width < 3 or height < 3:
                          skipped += 1
                          continue

                      pixels = image.load()
                      valid = True

                      # Top and bottom border.
                      for x in range(width):
                          if not allowed(pixels[x, 0]):
                              valid = False
                              break

                          if not allowed(pixels[x, height - 1]):
                              valid = False
                              break

                      # Left and right border.
                      if valid:
                          for y in range(height):
                              if not allowed(pixels[0, y]):
                                  valid = False
                                  break

                              if not allowed(pixels[width - 1, y]):
                                  valid = False
                                  break

                      if valid:
                          valid_count += 1
                          continue

                      target = path.with_name(
                          path.name[:-6] + ".png"
                      )

                      # Preserve the actual pixels.
                      # Only remove the NinePatch filename interpretation.
                      if target.exists():
                          print(
                              f"WARNING: collision; cannot rename {path}"
                          )
                          skipped += 1
                          continue

                      path.rename(target)

                      print(
                          f"Converted malformed NinePatch: "
                          f"{path.name} -> {target.name}"
                      )

                      repaired += 1

              except Exception as exc:
                  print(
                      f"WARNING: could not inspect {path}: {exc}"
                  )
                  skipped += 1

          print()
          print(f"Valid NinePatch files:       {valid_count}")
          print(f"Converted malformed files:   {repaired}")
          print(f"Skipped/unreadable files:     {skipped}")
          PY


      # ------------------------------------------------------------
      # 13. Repair missing drawable declarations automatically
      #
      # Instead of relying only on the previously observed 11 names,
      # inspect public.xml and create only genuinely missing drawable
      # resources in the CI working copy.
      # ------------------------------------------------------------

      - name: Repair missing drawable declarations
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$BUILD_PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re
          import struct
          import zlib
          import sys

          project = Path(sys.argv[1])
          app = project / "app"
          res = app / "res"

          public_files = list(
              (res / "values").glob("public.xml")
          )

          if not public_files:
              print("No public.xml found; nothing to repair.")
              raise SystemExit(0)

          names = set()

          for public_xml in public_files:
              text = public_xml.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              for match in re.finditer(
                  r'<public\s+type="drawable"\s+name="([^"]+)"',
                  text
              ):
                  names.add(match.group(1))

          def png_1x1():
              raw = b"\x00\x00\x00\x00"

              def chunk(kind, data):
                  return (
                      struct.pack(">I", len(data))
                      + kind
                      + data
                      + struct.pack(
                          ">I",
                          zlib.crc32(kind + data) & 0xffffffff
                      )
                  )

              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(
                      b"IHDR",
                      struct.pack(
                          ">IIBBBBB",
                          1,
                          1,
                          8,
                          6,
                          0,
                          0,
                          0
                      )
                  )
                  + chunk(
                      b"IDAT",
                      zlib.compress(raw)
                  )
                  + chunk(b"IEND", b"")
              )

          placeholder = png_1x1()

          created = []
          existing = []

          # Check every resource directory, not just res/drawable.
          existing_names = set()

          for directory in res.glob("drawable*"):
              if not directory.is_dir():
                  continue

              for item in directory.iterdir():
                  if item.is_file():
                      filename = item.name

                      if filename.endswith(".9.png"):
                          filename = filename[:-6] + ".png"

                      if filename.endswith(".png"):
                          existing_names.add(
                              Path(filename).stem
                          )

          for name in sorted(names):

              if name in existing_names:
                  existing.append(name)
                  continue

              target_dir = res / "drawable"

              target_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              target = target_dir / f"{name}.png"

              if target.exists():
                  existing.append(name)
                  continue

              target.write_bytes(placeholder)

              created.append(name)

          print()
          print(
              f"Drawable declarations found: "
              f"{len(names)}"
          )

          print(
              f"Existing drawable resources: "
              f"{len(existing)}"
          )

          print(
              f"Placeholder drawables created: "
              f"{len(created)}"
          )

          for name in created:
              print(f"  CREATED: {name}")
          PY


      # ------------------------------------------------------------
      # 14. Run the project's own static verification
      # ------------------------------------------------------------

      - name: Run source verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          chmod +x tools/verify-source.sh

          ./tools/verify-source.sh


      # ------------------------------------------------------------
      # 15. Explicit pre-build sanity checks
      # ------------------------------------------------------------

      - name: Pre-build sanity checks
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          test -f app/AndroidManifest.xml
          test -f app/apktool.yml
          test -f tools/apktool.jar

          test -d app/smali

          smali_count="$(
            find app \
              -type f \
              -name '*.smali' |
            wc -l
          )"

          smali_count="$(echo "$smali_count" | tr -d '[:space:]')"

          echo "Working-copy smali count: $smali_count"

          if [ "$smali_count" -ne "$EXPECTED_SMALI_CLASSES" ]; then
            echo "::error::Working-copy smali count changed unexpectedly."
            exit 1
          fi

          echo "Pre-build sanity checks passed."


      # ------------------------------------------------------------
      # 16. Build with Apktool
      # ------------------------------------------------------------

      - name: Build unsigned APK with Apktool
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          rm -rf build/dist
          rm -rf build/logs

          mkdir -p \
            build/dist \
            build/logs

          LOG="build/logs/apktool-build.log"
          OUTPUT="build/dist/MetaEvo-OpenFork-unsigned.apk"

          echo "Starting Apktool build..."
          echo "Apktool version: $APKTOOL_VERSION"
          echo "Project: $BUILD_PROJECT_DIR"

          set +e

          java \
            -Xmx4g \
            -Dfile.encoding=UTF-8 \
            -jar tools/apktool.jar \
            b app \
            -f \
            -o "$OUTPUT" \
            2>&1 |
            tee "$LOG"

          status=${PIPESTATUS[0]}

          set -e

          if [ "$status" -ne 0 ]; then

            echo
            echo "=================================================="
            echo "AP KTOOL BUILD FAILED"
            echo "=================================================="

            echo
            echo "Relevant compiler/linker errors:"

            grep -nEi \
              'error:|exception:|fatal:|could not|cannot find|resource .* not found|failed' \
              "$LOG" |
              head -120 ||
              true

            echo
            echo "Last 150 log lines:"

            tail -150 "$LOG" || true

            exit "$status"
          fi

          if [ ! -s "$OUTPUT" ]; then
            echo "::error::Apktool reported success but no APK was produced."
            exit 1
          fi

          echo
          echo "Unsigned APK successfully produced:"
          ls -lh "$OUTPUT"

          cp \
            "$OUTPUT" \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"


      # ------------------------------------------------------------
      # 17. Verify unsigned APK
      # ------------------------------------------------------------

      - name: Verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK size:"
          stat -c '%s bytes' "$APK"

          echo
          echo "Testing APK ZIP structure..."

          unzip -t "$APK" >/dev/null

          echo
          echo "APK SHA-256:"

          sha256sum "$APK"


      - name: Inspect unsigned APK contents
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"

          echo "APK contents:"
          unzip -l "$APK" | head -100

          echo
          echo "DEX files:"

          unzip -l "$APK" |
            awk '$4 ~ /^classes[0-9]*\.dex$/ {print $4, $1}' |
            sort


      # ------------------------------------------------------------
      # 18. Generate temporary CI signing key
      # ------------------------------------------------------------

      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/metaevo-openfork.keystore"

          rm -f "$KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias openfork \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname \
              "CN=MetaEvo OpenFork, OU=OpenFork, O=OpenFork, C=PH"

          test -s "$KEYSTORE"


      # ------------------------------------------------------------
      # 19. Sign APK
      # ------------------------------------------------------------

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"

          UNSIGNED="$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"
          SIGNED="$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk"
          KEYSTORE="$RUNNER_TEMP/metaevo-openfork.keystore"

          test -x "$BUILD_TOOLS/apksigner"
          test -f "$UNSIGNED"
          test -f "$KEYSTORE"

          rm -f "$SIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$UNSIGNED"

          test -s "$SIGNED"

          echo "Signed APK:"
          ls -lh "$SIGNED"


      # ------------------------------------------------------------
      # 20. Verify signature
      # ------------------------------------------------------------

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          APK="$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo
          echo "Signed APK SHA-256:"

          sha256sum "$APK"


      # ------------------------------------------------------------
      # 21. Final APK integrity check
      # ------------------------------------------------------------

      - name: Final APK integrity check
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "Final APK is a valid ZIP archive."

          echo
          echo "Final APK size:"
          stat -c '%s bytes' "$APK"

          echo
          echo "Final APK SHA-256:"
          sha256sum "$APK"


      # ------------------------------------------------------------
      # 22. Save build diagnostics
      # ------------------------------------------------------------

      - name: Prepare build report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$GITHUB_WORKSPACE/BUILD-REPORT.txt"

          {
            echo "MetaEvo OpenFork CI Build Report"
            echo "================================"
            echo
            echo "GitHub run: $GITHUB_RUN_ID"
            echo "Commit:     $GITHUB_SHA"
            echo "Runner:     $RUNNER_OS"
            echo
            echo "Source archive SHA-256:"
            sha256sum "$SOURCE_ARCHIVE" 2>/dev/null || true
            echo
            echo "Apktool:"
            echo "$APKTOOL_VERSION"
            echo
            echo "Android build tools:"
            echo "$ANDROID_BUILD_TOOLS"
            echo
            echo "Android platform:"
            echo "$ANDROID_PLATFORM"
            echo
            echo "Expected smali classes:"
            echo "$EXPECTED_SMALI_CLASSES"
            echo
            echo "Generated artifacts:"
            ls -lh \
              "$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk" \
              "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk" \
              2>/dev/null || true
            echo
            echo "Final APK SHA-256:"
            sha256sum \
              "$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk" \
              2>/dev/null || true
          } > "$REPORT"

          cat "$REPORT"


      # ------------------------------------------------------------
      # 23. Upload final artifacts
      # ------------------------------------------------------------

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-Build-${{ github.run_number }}
          path: |
            MetaEvo-OpenFork.apk
            MetaEvo-OpenFork-unsigned.apk
            BUILD-REPORT.txt
            ${{ env.BUILD_PROJECT_DIR }}/build/logs/apktool-build.log
          if-no-files-found: warn
          retention-days: 14            fi

            if [ ! -s "$f" ]; then
              echo "::error::Source part is empty: $f"
              exit 1
            fi

            echo "Found: $f"
            ls -lh "$f"
          done


      - name: Verify source part SHA-256 hashes
        shell: bash
        run: |
          set -euo pipefail

          verify_hash() {
            local file="$1"
            local expected="$2"

            local actual
            actual="$(sha256sum "$file" | awk '{print $1}')"

            echo
            echo "File:     $file"
            echo "Expected: $expected"
            echo "Actual:   $actual"

            if [ "$actual" != "$expected" ]; then
              echo "::error::SHA-256 mismatch for $file"
              exit 1
            fi

            echo "SHA-256 OK: $file"
          }

          verify_hash "$PART_AA" "$EXPECTED_AA_SHA256"
          verify_hash "$PART_AB" "$EXPECTED_AB_SHA256"
          verify_hash "$PART_AC" "$EXPECTED_AC_SHA256"


      # ------------------------------------------------------------
      # 5. Reassemble archive
      # ------------------------------------------------------------

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$SOURCE_ARCHIVE"

          cat \
            "$PART_AA" \
            "$PART_AB" \
            "$PART_AC" \
            > "$SOURCE_ARCHIVE"

          test -s "$SOURCE_ARCHIVE"

          echo "Reassembled archive:"
          ls -lh "$SOURCE_ARCHIVE"


      - name: Verify reconstructed archive SHA-256
        shell: bash
        run: |
          set -euo pipefail

          actual="$(sha256sum "$SOURCE_ARCHIVE" | awk '{print $1}')"

          echo "Expected archive SHA-256:"
          echo "$EXPECTED_ARCHIVE_SHA256"

          echo "Actual archive SHA-256:"
          echo "$actual"

          if [ "$actual" != "$EXPECTED_ARCHIVE_SHA256" ]; then
            echo "::error::Reconstructed ZIP does not match the verified source archive."
            exit 1
          fi

          echo "Archive SHA-256 verification passed."


      - name: Test reconstructed ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$SOURCE_ARCHIVE"


      # ------------------------------------------------------------
      # 6. Extract source
      # ------------------------------------------------------------

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$SOURCE_ARCHIVE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 3 \
            -type f \
            | head -100


      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name 'settings.gradle.kts' \
              -print \
              -quit
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Located project does not contain app/."
            echo "Located: $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_DIR"


      # ------------------------------------------------------------
      # 7. Validate reconstructed source
      # ------------------------------------------------------------

      - name: Validate source layout
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradlew"
            "app/AndroidManifest.xml"
            "app/apktool.yml"
            "tools/verify-source.sh"
          )

          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Required source file missing: $f"
              exit 1
            fi
          done

          echo "Required project files are present."


      - name: Validate smali class count
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          count="$(
            find app \
              -type f \
              -name '*.smali' \
              | wc -l
          )"

          count="$(echo "$count" | tr -d '[:space:]')"

          echo "Expected smali classes: $EXPECTED_SMALI_CLASSES"
          echo "Actual smali classes:   $count"

          if [ "$count" -ne "$EXPECTED_SMALI_CLASSES" ]; then
            echo "::error::Unexpected smali class count: $count"
            exit 1
          fi


      - name: Validate original project metadata
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking apktool.yml..."

          grep -q "versionInfo:" app/apktool.yml || {
            echo "::error::apktool.yml does not contain versionInfo."
            exit 1
          }

          echo "Checking AndroidManifest.xml..."

          test -s app/AndroidManifest.xml

          echo "Checking source verification script..."

          chmod +x tools/verify-source.sh


      # ------------------------------------------------------------
      # 8. Make isolated working copy
      #
      # IMPORTANT:
      # The verified ZIP and its extracted source remain untouched.
      # All build repairs happen only inside build-work/.
      # ------------------------------------------------------------

      - name: Create isolated CI working copy
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build-work"

          cp -a "$PROJECT_DIR" \
            "$GITHUB_WORKSPACE/build-work"

          echo "CI working copy:"
          echo "$GITHUB_WORKSPACE/build-work"

          echo "BUILD_PROJECT_DIR=$GITHUB_WORKSPACE/build-work" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 9. Normalize Apktool metadata
      # ------------------------------------------------------------

      - name: Normalize Apktool metadata
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          python3 - "$BUILD_PROJECT_DIR/app/apktool.yml" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text(encoding="utf-8")

          # Apktool 3.x rejects quoted numeric versionCode values
          # in this reconstructed apktool.yml.
          text = re.sub(
              r"(?m)^(\s*versionCode:\s*)['\"]?100['\"]?\s*$",
              r"\g<1>100",
              text,
          )

          # Keep versionName textual.
          text = re.sub(
              r"(?m)^(\s*versionName:\s*)['\"]?1\.0\.0-openfork['\"]?\s*$",
              r"\g<1>1.0.0-openfork",
              text,
          )

          path.write_text(text, encoding="utf-8")

          print("Normalized apktool.yml:")
          print(path.read_text(encoding="utf-8"))
          PY


      # ------------------------------------------------------------
      # 10. Install Pillow for deterministic NinePatch inspection
      # ------------------------------------------------------------

      - name: Install Python image dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            pillow

          python3 - <<'PY'
          from PIL import Image
          print("Pillow import OK")
          PY


      # ------------------------------------------------------------
      # 11. Download and verify Apktool
      # ------------------------------------------------------------

      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          mkdir -p tools

          rm -f tools/apktool.jar

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            -o tools/apktool.jar \
            "$APKTOOL_URL"

          test -s tools/apktool.jar


      - name: Verify Apktool SHA-256
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          actual="$(
            sha256sum tools/apktool.jar |
            awk '{print $1}'
          )"

          echo "Expected Apktool SHA-256:"
          echo "$APKTOOL_SHA256"

          echo "Actual Apktool SHA-256:"
          echo "$actual"

          if [ "$actual" != "$APKTOOL_SHA256" ]; then
            echo "::error::Apktool SHA-256 verification failed."
            exit 1
          fi

          java -Xmx1g \
            -jar tools/apktool.jar \
            --version


      # ------------------------------------------------------------
      # 12. Repair malformed NinePatch resources
      #
      # Original source archive remains untouched.
      # Only the CI working copy is changed.
      # ------------------------------------------------------------

      - name: Repair malformed NinePatch resources
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$BUILD_PROJECT_DIR/app/res" <<'PY'
          from pathlib import Path
          from PIL import Image
          import sys

          root = Path(sys.argv[1])

          repaired = 0
          valid_count = 0
          skipped = 0

          def allowed(c):
              r, g, b, a = c

              # Transparent pixels are valid.
              if a == 0:
                  return True

              # White/neutral border pixels are valid.
              if (r, g, b) == (255, 255, 255):
                  return True

              # Black NinePatch marker.
              if (r, g, b, a) == (0, 0, 0, 255):
                  return True

              # Red optical marker.
              if (r, g, b, a) == (255, 0, 0, 255):
                  return True

              return False

          for path in root.rglob("*.9.png"):

              try:
                  with Image.open(path) as source:
                      image = source.convert("RGBA")
                      width, height = image.size

                      if width < 3 or height < 3:
                          skipped += 1
                          continue

                      pixels = image.load()
                      valid = True

                      # Top and bottom border.
                      for x in range(width):
                          if not allowed(pixels[x, 0]):
                              valid = False
                              break

                          if not allowed(pixels[x, height - 1]):
                              valid = False
                              break

                      # Left and right border.
                      if valid:
                          for y in range(height):
                              if not allowed(pixels[0, y]):
                                  valid = False
                                  break

                              if not allowed(pixels[width - 1, y]):
                                  valid = False
                                  break

                      if valid:
                          valid_count += 1
                          continue

                      target = path.with_name(
                          path.name[:-6] + ".png"
                      )

                      # Preserve the actual pixels.
                      # Only remove the NinePatch filename interpretation.
                      if target.exists():
                          print(
                              f"WARNING: collision; cannot rename {path}"
                          )
                          skipped += 1
                          continue

                      path.rename(target)

                      print(
                          f"Converted malformed NinePatch: "
                          f"{path.name} -> {target.name}"
                      )

                      repaired += 1

              except Exception as exc:
                  print(
                      f"WARNING: could not inspect {path}: {exc}"
                  )
                  skipped += 1

          print()
          print(f"Valid NinePatch files:       {valid_count}")
          print(f"Converted malformed files:   {repaired}")
          print(f"Skipped/unreadable files:     {skipped}")
          PY


      # ------------------------------------------------------------
      # 13. Repair missing drawable declarations automatically
      #
      # Instead of relying only on the previously observed 11 names,
      # inspect public.xml and create only genuinely missing drawable
      # resources in the CI working copy.
      # ------------------------------------------------------------

      - name: Repair missing drawable declarations
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$BUILD_PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re
          import struct
          import zlib
          import sys

          project = Path(sys.argv[1])
          app = project / "app"
          res = app / "res"

          public_files = list(
              (res / "values").glob("public.xml")
          )

          if not public_files:
              print("No public.xml found; nothing to repair.")
              raise SystemExit(0)

          names = set()

          for public_xml in public_files:
              text = public_xml.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              for match in re.finditer(
                  r'<public\s+type="drawable"\s+name="([^"]+)"',
                  text
              ):
                  names.add(match.group(1))

          def png_1x1():
              raw = b"\x00\x00\x00\x00"

              def chunk(kind, data):
                  return (
                      struct.pack(">I", len(data))
                      + kind
                      + data
                      + struct.pack(
                          ">I",
                          zlib.crc32(kind + data) & 0xffffffff
                      )
                  )

              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(
                      b"IHDR",
                      struct.pack(
                          ">IIBBBBB",
                          1,
                          1,
                          8,
                          6,
                          0,
                          0,
                          0
                      )
                  )
                  + chunk(
                      b"IDAT",
                      zlib.compress(raw)
                  )
                  + chunk(b"IEND", b"")
              )

          placeholder = png_1x1()

          created = []
          existing = []

          # Check every resource directory, not just res/drawable.
          existing_names = set()

          for directory in res.glob("drawable*"):
              if not directory.is_dir():
                  continue

              for item in directory.iterdir():
                  if item.is_file():
                      filename = item.name

                      if filename.endswith(".9.png"):
                          filename = filename[:-6] + ".png"

                      if filename.endswith(".png"):
                          existing_names.add(
                              Path(filename).stem
                          )

          for name in sorted(names):

              if name in existing_names:
                  existing.append(name)
                  continue

              target_dir = res / "drawable"

              target_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              target = target_dir / f"{name}.png"

              if target.exists():
                  existing.append(name)
                  continue

              target.write_bytes(placeholder)

              created.append(name)

          print()
          print(
              f"Drawable declarations found: "
              f"{len(names)}"
          )

          print(
              f"Existing drawable resources: "
              f"{len(existing)}"
          )

          print(
              f"Placeholder drawables created: "
              f"{len(created)}"
          )

          for name in created:
              print(f"  CREATED: {name}")
          PY


      # ------------------------------------------------------------
      # 14. Run the project's own static verification
      # ------------------------------------------------------------

      - name: Run source verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          chmod +x tools/verify-source.sh

          ./tools/verify-source.sh


      # ------------------------------------------------------------
      # 15. Explicit pre-build sanity checks
      # ------------------------------------------------------------

      - name: Pre-build sanity checks
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          test -f app/AndroidManifest.xml
          test -f app/apktool.yml
          test -f tools/apktool.jar

          test -d app/smali

          smali_count="$(
            find app \
              -type f \
              -name '*.smali' |
            wc -l
          )"

          smali_count="$(echo "$smali_count" | tr -d '[:space:]')"

          echo "Working-copy smali count: $smali_count"

          if [ "$smali_count" -ne "$EXPECTED_SMALI_CLASSES" ]; then
            echo "::error::Working-copy smali count changed unexpectedly."
            exit 1
          fi

          echo "Pre-build sanity checks passed."


      # ------------------------------------------------------------
      # 16. Build with Apktool
      # ------------------------------------------------------------

      - name: Build unsigned APK with Apktool
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_PROJECT_DIR"

          rm -rf build/dist
          rm -rf build/logs

          mkdir -p \
            build/dist \
            build/logs

          LOG="build/logs/apktool-build.log"
          OUTPUT="build/dist/MetaEvo-OpenFork-unsigned.apk"

          echo "Starting Apktool build..."
          echo "Apktool version: $APKTOOL_VERSION"
          echo "Project: $BUILD_PROJECT_DIR"

          set +e

          java \
            -Xmx4g \
            -Dfile.encoding=UTF-8 \
            -jar tools/apktool.jar \
            b app \
            -f \
            -o "$OUTPUT" \
            2>&1 |
            tee "$LOG"

          status=${PIPESTATUS[0]}

          set -e

          if [ "$status" -ne 0 ]; then

            echo
            echo "=================================================="
            echo "AP KTOOL BUILD FAILED"
            echo "=================================================="

            echo
            echo "Relevant compiler/linker errors:"

            grep -nEi \
              'error:|exception:|fatal:|could not|cannot find|resource .* not found|failed' \
              "$LOG" |
              head -120 ||
              true

            echo
            echo "Last 150 log lines:"

            tail -150 "$LOG" || true

            exit "$status"
          fi

          if [ ! -s "$OUTPUT" ]; then
            echo "::error::Apktool reported success but no APK was produced."
            exit 1
          fi

          echo
          echo "Unsigned APK successfully produced:"
          ls -lh "$OUTPUT"

          cp \
            "$OUTPUT" \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"


      # ------------------------------------------------------------
      # 17. Verify unsigned APK
      # ------------------------------------------------------------

      - name: Verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK size:"
          stat -c '%s bytes' "$APK"

          echo
          echo "Testing APK ZIP structure..."

          unzip -t "$APK" >/dev/null

          echo
          echo "APK SHA-256:"

          sha256sum "$APK"


      - name: Inspect unsigned APK contents
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"

          echo "APK contents:"
          unzip -l "$APK" | head -100

          echo
          echo "DEX files:"

          unzip -l "$APK" |
            awk '$4 ~ /^classes[0-9]*\.dex$/ {print $4, $1}' |
            sort


      # ------------------------------------------------------------
      # 18. Generate temporary CI signing key
      # ------------------------------------------------------------

      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/metaevo-openfork.keystore"

          rm -f "$KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias openfork \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname \
              "CN=MetaEvo OpenFork, OU=OpenFork, O=OpenFork, C=PH"

          test -s "$KEYSTORE"


      # ------------------------------------------------------------
      # 19. Sign APK
      # ------------------------------------------------------------

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"

          UNSIGNED="$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"
          SIGNED="$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk"
          KEYSTORE="$RUNNER_TEMP/metaevo-openfork.keystore"

          test -x "$BUILD_TOOLS/apksigner"
          test -f "$UNSIGNED"
          test -f "$KEYSTORE"

          rm -f "$SIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$UNSIGNED"

          test -s "$SIGNED"

          echo "Signed APK:"
          ls -lh "$SIGNED"


      # ------------------------------------------------------------
      # 20. Verify signature
      # ------------------------------------------------------------

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          APK="$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo
          echo "Signed APK SHA-256:"

          sha256sum "$APK"


      # ------------------------------------------------------------
      # 21. Final APK integrity check
      # ------------------------------------------------------------

      - name: Final APK integrity check
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "Final APK is a valid ZIP archive."

          echo
          echo "Final APK size:"
          stat -c '%s bytes' "$APK"

          echo
          echo "Final APK SHA-256:"
          sha256sum "$APK"


      # ------------------------------------------------------------
      # 22. Save build diagnostics
      # ------------------------------------------------------------

      - name: Prepare build report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$GITHUB_WORKSPACE/BUILD-REPORT.txt"

          {
            echo "MetaEvo OpenFork CI Build Report"
            echo "================================"
            echo
            echo "GitHub run: $GITHUB_RUN_ID"
            echo "Commit:     $GITHUB_SHA"
            echo "Runner:     $RUNNER_OS"
            echo
            echo "Source archive SHA-256:"
            sha256sum "$SOURCE_ARCHIVE" 2>/dev/null || true
            echo
            echo "Apktool:"
            echo "$APKTOOL_VERSION"
            echo
            echo "Android build tools:"
            echo "$ANDROID_BUILD_TOOLS"
            echo
            echo "Android platform:"
            echo "$ANDROID_PLATFORM"
            echo
            echo "Expected smali classes:"
            echo "$EXPECTED_SMALI_CLASSES"
            echo
            echo "Generated artifacts:"
            ls -lh \
              "$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk" \
              "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk" \
              2>/dev/null || true
            echo
            echo "Final APK SHA-256:"
            sha256sum \
              "$GITHUB_WORKSPACE/MetaEvo-OpenFork.apk" \
              2>/dev/null || true
          } > "$REPORT"

          cat "$REPORT"


      # ------------------------------------------------------------
      # 23. Upload final artifacts
      # ------------------------------------------------------------

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-Build-${{ github.run_number }}
          path: |
            MetaEvo-OpenFork.apk
            MetaEvo-OpenFork-unsigned.apk
            BUILD-REPORT.txt
            ${{ env.BUILD_PROJECT_DIR }}/build/logs/apktool-build.log
          if-no-files-found: warn
          retention-days: 14
