name: Build MetaEvo OpenFork

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Rebuild and package APK
    runs-on: ubuntu-24.04

    env:
      APKTOOL_VERSION: "3.0.3"
      APKTOOL_SHA256: "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"
      PROJECT_ZIP_SHA256: "6f8325bfeb12db2a51f98ac6246ae5ff1acb2132042a52a52e06cb35f4bf50e2db9"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v5

      # ============================================================
      # 2. JAVA
      #
      # IMPORTANT:
      # Do NOT use "cache: gradle".
      # This project invokes Apktool directly and does not require
      # Gradle dependency caching.
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Verify Android tools
        shell: bash
        run: |
          set -euo pipefail

          echo "ADB:"
          adb version

          echo
          echo "AAPT2:"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" version

          echo
          echo "APKSIGNER:"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version

      # ============================================================
      # 4. LOCATE ZIP PARTS
      # ============================================================
      - name: Locate OpenFork project parts
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          find . -maxdepth 5 -type f -print | sort | head -500

          echo
          echo "Searching for project ZIP parts..."

          PART_AA="$(
            find . -type f \
              -name 'MetaEvo_OpenFork_BuildSystem.zip.part-aa' \
              -print -quit
          )"

          PART_AB="$(
            find . -type f \
              -name 'MetaEvo_OpenFork_BuildSystem.zip.part-ab' \
              -print -quit
          )"

          PART_AC="$(
            find . -type f \
              -name 'MetaEvo_OpenFork_BuildSystem.zip.part-ac' \
              -print -quit
          )"

          if [ -z "$PART_AA" ]; then
            echo "ERROR: Missing part-aa"
            exit 1
          fi

          if [ -z "$PART_AB" ]; then
            echo "ERROR: Missing part-ab"
            exit 1
          fi

          if [ -z "$PART_AC" ]; then
            echo "ERROR: Missing part-ac"
            exit 1
          fi

          echo "PART_AA=$PART_AA" >> "$GITHUB_ENV"
          echo "PART_AB=$PART_AB" >> "$GITHUB_ENV"
          echo "PART_AC=$PART_AC" >> "$GITHUB_ENV"

          echo
          echo "Found:"
          echo "  $PART_AA"
          echo "  $PART_AB"
          echo "  $PART_AC"

      # ============================================================
      # 5. VERIFY ZIP PARTS
      # ============================================================
      - name: Verify ZIP parts
        shell: bash
        run: |
          set -euo pipefail

          test -s "$PART_AA"
          test -s "$PART_AB"
          test -s "$PART_AC"

          echo "Individual SHA-256 values:"
          sha256sum "$PART_AA"
          sha256sum "$PART_AB"
          sha256sum "$PART_AC"

          echo
          echo "ZIP part sizes:"
          ls -lh "$PART_AA" "$PART_AB" "$PART_AC"

      # ============================================================
      # 6. RECONSTRUCT ZIP
      # ============================================================
      - name: Reconstruct project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf reconstructed extracted
          mkdir -p reconstructed extracted

          cat \
            "$PART_AA" \
            "$PART_AB" \
            "$PART_AC" \
            > reconstructed/MetaEvo_OpenFork_BuildSystem.zip

          echo "Reconstructed ZIP:"
          ls -lh reconstructed/MetaEvo_OpenFork_BuildSystem.zip

          echo
          echo "Calculated SHA-256:"

          ACTUAL="$(
            sha256sum reconstructed/MetaEvo_OpenFork_BuildSystem.zip \
            | awk '{print $1}'
          )"

          echo "$ACTUAL"

          echo
          echo "Expected SHA-256:"
          echo "$PROJECT_ZIP_SHA256"

          if [ "$ACTUAL" != "$PROJECT_ZIP_SHA256" ]; then
            echo
            echo "ERROR: SHA-256 mismatch."
            exit 1
          fi

          echo
          echo "ZIP SHA-256 verified successfully."

      # ============================================================
      # 7. TEST ZIP
      # ============================================================
      - name: Test reconstructed ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t \
            reconstructed/MetaEvo_OpenFork_BuildSystem.zip

      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          unzip -q \
            reconstructed/MetaEvo_OpenFork_BuildSystem.zip \
            -d extracted

          echo "Top-level extracted structure:"
          find extracted -maxdepth 3 -type f -print | sort | head -500

      # ============================================================
      # 9. RESOLVE PROJECT DIRECTORY
      # ============================================================
      - name: Resolve project directory
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          while IFS= read -r APKTOOL_FILE; do
            CANDIDATE="$(dirname "$(dirname "$APKTOOL_FILE")")"

            if [ -f "$CANDIDATE/app/apktool.yml" ]; then
              PROJECT="$CANDIDATE"
              break
            fi
          done < <(
            find extracted \
              -type f \
              -path '*/app/apktool.yml' \
              -print
          )

          if [ -z "$PROJECT" ]; then
            PROJECT="extracted/MetaEvo_OpenFork_BuildSystem"
          fi

          PROJECT="$(cd "$PROJECT" && pwd)"

          if [ ! -f "$PROJECT/app/apktool.yml" ]; then
            echo "ERROR: app/apktool.yml not found."
            echo
            echo "Available apktool.yml files:"
            find extracted -name apktool.yml -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "PROJECT_DIR:"
          echo "$PROJECT"

      # ============================================================
      # 10. VALIDATE PROJECT
      # ============================================================
      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          required=(
            "app/AndroidManifest.xml"
            "app/apktool.yml"
            "app/res"
            "app/smali"
          )

          for item in "${required[@]}"; do
            if [ ! -e "$item" ]; then
              echo "ERROR: Missing $item"
              exit 1
            fi
          done

          echo "Project structure OK."

          echo
          echo "Smali directories:"
          find app -maxdepth 1 -type d -name 'smali*' -print | sort

          echo
          echo "Smali class count:"
          find app \
            -path '*/smali*' \
            -type f \
            -name '*.smali' \
            | wc -l

      # ============================================================
      # 11. NORMALIZE APKTOOL METADATA
      # ============================================================
      - name: Normalize Apktool metadata
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/apktool.yml")
          text = path.read_text(encoding="utf-8")

          # Apktool 3.x expects versionCode as a numeric YAML value.
          text = re.sub(
              r'^(\s*versionCode:\s*)["\']?([0-9]+)["\']?\s*$',
              r'\g<1>\g<2>',
              text,
              flags=re.MULTILINE,
          )

          # Keep versionName as a YAML string.
          def normalize_version_name(match):
              prefix = match.group(1)
              value = match.group(2)
              return f'{prefix}"{value}"'

          text = re.sub(
              r'^(\s*versionName:\s*)["\']([^"\']*)["\']\s*$',
              normalize_version_name,
              text,
              flags=re.MULTILINE,
          )

          path.write_text(text, encoding="utf-8")

          print("Normalized app/apktool.yml:")
          print(path.read_text(encoding="utf-8"))
          PY

      # ============================================================
      # 12. BOOTSTRAP APKTOOL
      # ============================================================
      - name: Bootstrap Apktool
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/tools"

          URL="https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          OUT="$PROJECT_DIR/tools/apktool.jar"

          echo "Downloading Apktool ${APKTOOL_VERSION}..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --output "$OUT" \
            "$URL"

          echo
          echo "Downloaded Apktool SHA-256:"
          sha256sum "$OUT"

          echo
          echo "Verifying Apktool SHA-256..."

          printf '%s  %s\n' \
            "$APKTOOL_SHA256" \
            "$OUT" \
            | sha256sum -c -

          chmod 644 "$OUT"

          echo
          echo "Apktool version:"
          java -jar "$OUT" --version

      # ============================================================
      # 13. REPAIR MALFORMED NINEPATCH FILES
      # ============================================================
      - name: Repair malformed NinePatch resources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: python
        run: |
          import os
          import struct
          import zlib

          RES = "app/res"

          def decode_png_rgba(path):
              with open(path, "rb") as f:
                  data = f.read()

              if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  return None

              pos = 8
              idat = b""
              width = height = None
              depth = color_type = None

              while pos + 8 <= len(data):
                  length = struct.unpack(
                      ">I",
                      data[pos:pos + 4]
                  )[0]

                  kind = data[pos + 4:pos + 8]
                  payload_start = pos + 8
                  payload_end = payload_start + length

                  if payload_end > len(data):
                      return None

                  payload = data[payload_start:payload_end]

                  if kind == b"IHDR":
                      if len(payload) != 13:
                          return None

                      (
                          width,
                          height,
                          depth,
                          color_type,
                          compression,
                          filtering,
                          interlace,
                      ) = struct.unpack(">IIBBBBB", payload)

                      if compression != 0 or filtering != 0:
                          return None

                  elif kind == b"IDAT":
                      idat += payload

                  pos = payload_end + 4

                  if kind == b"IEND":
                      break

              if width is None or height is None:
                  return None

              if depth != 8:
                  return None

              if color_type not in (6, 4):
                  return None

              try:
                  raw = zlib.decompress(idat)
              except Exception:
                  return None

              bpp = 4 if color_type == 6 else 2
              stride = width * bpp

              rows = []
              previous = bytearray(stride)
              offset = 0

              def paeth(a, b, c):
                  p = a + b - c
                  pa = abs(p - a)
                  pb = abs(p - b)
                  pc = abs(p - c)

                  if pa <= pb and pa <= pc:
                      return a
                  if pb <= pc:
                      return b
                  return c

              for _ in range(height):
                  if offset >= len(raw):
                      return None

                  filter_type = raw[offset]
                  offset += 1

                  if offset + stride > len(raw):
                      return None

                  current = bytearray(
                      raw[offset:offset + stride]
                  )
                  offset += stride

                  for i in range(stride):
                      left = current[i - bpp] if i >= bpp else 0
                      up = previous[i]
                      upper_left = (
                          previous[i - bpp]
                          if i >= bpp
                          else 0
                      )

                      original = current[i]

                      if filter_type == 0:
                          value = original

                      elif filter_type == 1:
                          value = (
                              original + left
                          ) & 255

                      elif filter_type == 2:
                          value = (
                              original + up
                          ) & 255

                      elif filter_type == 3:
                          value = (
                              original
                              + ((left + up) // 2)
                          ) & 255

                      elif filter_type == 4:
                          value = (
                              original
                              + paeth(
                                  left,
                                  up,
                                  upper_left,
                              )
                          ) & 255

                      else:
                          return None

                      current[i] = value

                  rows.append(current)
                  previous = current

              pixels = []

              for row in rows:
                  row_pixels = []

                  for x in range(width):
                      if color_type == 6:
                          i = x * 4
                          row_pixels.append(
                              tuple(row[i:i + 4])
                          )
                      else:
                          i = x * 2
                          gray = row[i]
                          alpha = row[i + 1]
                          row_pixels.append(
                              (
                                  gray,
                                  gray,
                                  gray,
                                  alpha,
                              )
                          )

                  pixels.append(row_pixels)

              return width, height, pixels

          def valid_border_pixel(px, neutral):
              r, g, b, a = px

              # Transparent neutral pixel.
              if a == 0:
                  return True

              # Opaque white neutral pixel.
              if (
                  neutral == "white"
                  and (r, g, b, a)
                  == (255, 255, 255, 255)
              ):
                  return True

              # Primary black marker.
              if (r, g, b, a) == (0, 0, 0, 255):
                  return True

              # Secondary red marker.
              if (r, g, b, a) == (255, 0, 0, 255):
                  return True

              return False

          valid_count = 0
          repaired_count = 0
          skipped_count = 0

          for root, _, files in os.walk(RES):
              for filename in files:

                  if not filename.endswith(".9.png"):
                      continue

                  path = os.path.join(root, filename)

                  try:
                      decoded = decode_png_rgba(path)

                      if decoded is None:
                          raise ValueError(
                              "PNG could not be decoded"
                          )

                      width, height, pixels = decoded

                      if width < 3 or height < 3:
                          raise ValueError(
                              "NinePatch image smaller than 3x3"
                          )

                      top_left = pixels[0][0]

                      if top_left[3] == 0:
                          neutral = "transparent"
                      else:
                          neutral = "white"

                      for x in range(width):
                          if not valid_border_pixel(
                              pixels[0][x],
                              neutral,
                          ):
                              raise ValueError(
                                  "invalid top border"
                              )

                          if not valid_border_pixel(
                              pixels[height - 1][x],
                              neutral,
                          ):
                              raise ValueError(
                                  "invalid bottom border"
                              )

                      for y in range(height):
                          if not valid_border_pixel(
                              pixels[y][0],
                              neutral,
                          ):
                              raise ValueError(
                                  "invalid left border"
                              )

                          if not valid_border_pixel(
                              pixels[y][width - 1],
                              neutral,
                          ):
                              raise ValueError(
                                  "invalid right border"
                              )

                      valid_count += 1

                  except Exception as exc:

                      new_path = path[:-6] + ".png"

                      if os.path.exists(new_path):
                          raise RuntimeError(
                              "Cannot repair because target exists: "
                              f"{new_path}"
                          )

                      os.rename(path, new_path)

                      repaired_count += 1

                      print(
                          "Converted malformed NinePatch:"
                      )
                      print(f"  {path}")
                      print(f"  -> {new_path}")
                      print(f"  Reason: {exc}")

          print()
          print("NinePatch repair complete.")
          print(f"Valid NinePatch files: {valid_count}")
          print(
              "Converted malformed NinePatch files: "
              f"{repaired_count}"
          )
          print(f"Skipped: {skipped_count}")

      # ============================================================
      # 14. REPAIR MISSING DRAWABLES DECLARED BY PUBLIC.XML
      #
      # This preserves resource declarations that AAPT2 otherwise
      # rejects because the reconstructed resource tree lacks the
      # corresponding drawable file.
      # ============================================================
      - name: Repair missing drawable definitions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: python
        run: |
          import os
          import struct
          import zlib
          import xml.etree.ElementTree as ET

          RES = "app/res"
          PUBLIC = os.path.join(
              RES,
              "values",
              "public.xml",
          )

          if not os.path.isfile(PUBLIC):
              raise SystemExit(
                  "ERROR: app/res/values/public.xml not found"
              )

          def make_transparent_png(path):
              width = 1
              height = 1

              # One transparent RGBA pixel.
              raw = b"\x00\x00\x00\x00"

              def chunk(kind, data):
                  crc = zlib.crc32(
                      kind + data
                  ) & 0xffffffff

                  return (
                      struct.pack(">I", len(data))
                      + kind
                      + data
                      + struct.pack(">I", crc)
                  )

              png = (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(
                      b"IHDR",
                      struct.pack(
                          ">IIBBBBB",
                          width,
                          height,
                          8,
                          6,
                          0,
                          0,
                          0,
                      ),
                  )
                  + chunk(
                      b"IDAT",
                      zlib.compress(raw),
                  )
                  + chunk(
                      b"IEND",
                      b"",
                  )
              )

              with open(path, "wb") as f:
                  f.write(png)

          def resource_exists(
              resource_type,
              resource_name,
          ):
              for root, _, files in os.walk(RES):

                  rel = os.path.relpath(
                      root,
                      RES,
                  )

                  if not (
                      rel == resource_type
                      or rel.startswith(
                          resource_type + "-"
                      )
                  ):
                      continue

                  for filename in files:

                      if filename.endswith(".9.png"):
                          base = filename[:-6]

                      elif filename.endswith(".png"):
                          base = filename[:-4]

                      elif filename.endswith(".xml"):
                          base = filename[:-4]

                      else:
                          continue

                      if base == resource_name:
                          return True

              return False

          tree = ET.parse(PUBLIC)
          root = tree.getroot()

          missing = []

          for item in root.findall("public"):

              resource_type = item.get("type")
              resource_name = item.get("name")

              if (
                  resource_type != "drawable"
                  or not resource_name
              ):
                  continue

              if not resource_exists(
                  "drawable",
                  resource_name,
              ):
                  missing.append(resource_name)

          missing = sorted(set(missing))

          print(
              "Missing drawable definitions:",
              len(missing),
          )

          drawable_dir = os.path.join(
              RES,
              "drawable",
          )

          os.makedirs(
              drawable_dir,
              exist_ok=True,
          )

          created = 0

          for name in missing:

              target = os.path.join(
                  drawable_dir,
                  name + ".png",
              )

              if os.path.exists(target):
                  continue

              make_transparent_png(target)
              created += 1

              print(
                  "Created placeholder drawable:",
                  target,
              )

          print()
          print(
              "Placeholder drawables created:",
              created,
          )

      # ============================================================
      # 15. VERIFY THE KNOWN AAPT2 RESOURCE FAILURES
      # ============================================================
      - name: Verify known missing drawable resources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_DRAWABLES=(
            "mbridge_reward_notice"
            "tt_dislike_icon"
            "tt_mute_btn_bg"
            "tt_new_pause_video"
            "tt_pangle_ad_close_drawable"
            "tt_seek_thumb_fullscreen"
            "tt_shadow_lefterback_titlebar"
            "tt_shadow_lefterback_titlebar_press"
            "tt_slide_up_1"
            "tt_slide_up_13"
            "tt_slide_up_14"
          )

          FAILED=0

          for name in "${REQUIRED_DRAWABLES[@]}"; do

            if find app/res \
              -type f \
              \( \
                -name "${name}.png" \
                -o -name "${name}.9.png" \
                -o -name "${name}.xml" \
              \) \
              -print -quit \
              | grep -q .; then

              echo "OK: drawable/$name"

            else

              echo "MISSING: drawable/$name"
              FAILED=1

            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: One or more required drawables remain missing."
            exit 1
          fi

          echo
          echo "Known missing drawable verification passed."

      # ============================================================
      # 16. STATIC SOURCE VERIFICATION
      # ============================================================
      - name: Verify reconstructed source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f app/AndroidManifest.xml
          test -f app/apktool.yml

          COUNT="$(
            find app \
              -path '*/smali*' \
              -type f \
              -name '*.smali' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Smali class count: $COUNT"

          if [ "$COUNT" -ne 16496 ]; then
            echo
            echo "WARNING: Expected 16496 smali files."
            echo "Actual: $COUNT"
          fi

          if grep -q 'CHECK_LICENSE' \
            app/AndroidManifest.xml; then

            echo "ERROR: CHECK_LICENSE still present."
            exit 1
          fi

          if grep -q \
            'com.google.android.gms.permission.AD_ID' \
            app/AndroidManifest.xml; then

            echo "ERROR: AD_ID permission still present."
            exit 1
          fi

          echo
          echo "Static source verification passed."

      # ============================================================
      # 17. PREPARE BUILD LOG DIRECTORY
      # ============================================================
      - name: Prepare build directories
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/logs
          mkdir -p build/dist

          rm -f \
            build/dist/*.apk \
            build/logs/*.log

      # ============================================================
      # 18. BUILD WITH APKTOOL
      # ============================================================
      - name: Build unsigned APK with Apktool
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          echo "Starting Apktool build..."

          java \
            -Xmx4g \
            -jar tools/apktool.jar \
            b \
            app \
            -f \
            -o build/dist/MetaEvo-OpenFork-unsigned.apk \
            2>&1 | tee build/logs/apktool-build.log

      # ============================================================
      # 19. VERIFY UNSIGNED APK
      # ============================================================
      - name: Verify unsigned APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/dist/MetaEvo-OpenFork-unsigned.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Apktool did not produce an APK."
            exit 1
          fi

          echo "Unsigned APK:"
          ls -lh "$APK"

          echo
          echo "SHA-256:"
          sha256sum "$APK"

          echo
          echo "APK file:"
          file "$APK"

          echo
          echo "ZIP test:"
          unzip -t "$APK" >/dev/null

          echo "Unsigned APK is a valid ZIP/APK container."

      # ============================================================
      # 20. CREATE TEMPORARY BUILD SIGNING KEY
      #
      # This key is generated only for this GitHub Actions run.
      # It is NOT a production/release signing identity.
      # ============================================================
      - name: Generate temporary signing key
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/keys

          keytool \
            -genkeypair \
            -v \
            -keystore build/keys/openfork-debug.jks \
            -storetype JKS \
            -storepass openfork \
            -keypass openfork \
            -alias openfork \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MetaEvo OpenFork, OU=OpenFork, O=OpenFork, L=Local, ST=Local, C=US"

          chmod 600 build/keys/openfork-debug.jks

          echo "Temporary signing key generated."

      # ============================================================
      # 21. SIGN APK
      # ============================================================
      - name: Sign APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED="build/dist/MetaEvo-OpenFork-unsigned.apk"
          SIGNED="build/dist/MetaEvo-OpenFork.apk"
          KEYSTORE="build/keys/openfork-debug.jks"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:openfork \
            --key-pass pass:openfork \
            --ks-key-alias openfork \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED" \
            "$UNSIGNED"

          test -s "$SIGNED"

          echo "Signed APK created:"
          ls -lh "$SIGNED"

      # ============================================================
      # 22. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/dist/MetaEvo-OpenFork.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$APK"

          echo
          echo "APK signature verification passed."

          echo
          echo "Final SHA-256:"
          sha256sum "$APK"

          echo
          echo "Final APK size:"
          ls -lh "$APK"

      # ============================================================
      # 23. APK CONTENT DIAGNOSTICS
      # ============================================================
      - name: Generate APK diagnostics
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/dist/MetaEvo-OpenFork.apk"

          {
            echo "============================================================"
            echo "MetaEvo OpenFork Build Diagnostics"
            echo "============================================================"
            echo

            echo "Date:"
            date -u

            echo
            echo "Java:"
            java -version 2>&1

            echo
            echo "Apktool:"
            java -jar tools/apktool.jar --version

            echo
            echo "AAPT2:"
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" version

            echo
            echo "ApkSigner:"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" version

            echo
            echo "APK:"
            ls -lh "$APK"

            echo
            echo "SHA-256:"
            sha256sum "$APK"

            echo
            echo "Signature:"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
              --verbose \
              "$APK"

          } > build/logs/build-diagnostics.txt 2>&1

          cat build/logs/build-diagnostics.txt

      # ============================================================
      # 24. COLLECT IMPORTANT FILES
      # ============================================================
      - name: Collect build artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/artifacts

          cp \
            build/dist/MetaEvo-OpenFork.apk \
            build/artifacts/

          cp \
            build/dist/MetaEvo-OpenFork-unsigned.apk \
            build/artifacts/

          cp \
            build/logs/apktool-build.log \
            build/artifacts/

          cp \
            build/logs/build-diagnostics.txt \
            build/artifacts/

          echo "Artifacts:"
          find build/artifacts \
            -maxdepth 1 \
            -type f \
            -exec ls -lh {} \;

      # ============================================================
      # 25. UPLOAD FINAL APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-APK
          path: |
            ${{ env.PROJECT_DIR }}/build/artifacts/MetaEvo-OpenFork.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 26. UPLOAD UNSIGNED APK
      # ============================================================
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-Unsigned
          path: |
            ${{ env.PROJECT_DIR }}/build/artifacts/MetaEvo-OpenFork-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 27. UPLOAD BUILD DIAGNOSTICS
      # ============================================================
      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-Build-Diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/build/artifacts/apktool-build.log
            ${{ env.PROJECT_DIR }}/build/artifacts/build-diagnostics.txt
          if-no-files-found: error
          retention-days: 14
