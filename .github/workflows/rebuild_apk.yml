name: Build MetaEvo OpenFork from Parts

on:
  workflow_dispatch:
    inputs:
      strict_hash_check:
        description: "Fail the run if SHA-256 hashes differ from the values recorded in this workflow"
        required: false
        type: boolean
        default: false
      max_build_attempts:
        description: "Maximum number of Gradle build attempts"
        required: false
        type: number
        default: 8

permissions:
  contents: read

jobs:
  build:
    name: Rebuild and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      STRICT_HASH_CHECK: ${{ inputs.strict_hash_check }}
      MAX_BUILD_ATTEMPTS: ${{ inputs.max_build_attempts }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. CHECK ZIP PARTS (resilient SHA-256)
      # ============================================================
      - name: Check ZIP parts
        shell: bash
        run: |
          set -euo pipefail

          PARTS="MetaEvo_OpenFork_BuildSystem.zip.part-aa MetaEvo_OpenFork_BuildSystem.zip.part-ab MetaEvo_OpenFork_BuildSystem.zip.part-ac"

          for f in $PARTS; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          echo "All ZIP parts found."
          ls -lh $PARTS

          declare -A EXPECTED_SHA=(
            [MetaEvo_OpenFork_BuildSystem.zip.part-aa]="e6429a7abaddebcb08429a1fca30a348a526f54d0dad869eaf6e30bcbda2ba10"
            [MetaEvo_OpenFork_BuildSystem.zip.part-ab]="00f7ffdfae415401a3b6714b42309e5aa605c3d4dff7a1b806c938eb1647abe6"
            [MetaEvo_OpenFork_BuildSystem.zip.part-ac]="d4fc4c210adfed9b5c6870a309d98cce89ece417f8b699313d7a280cac269756"
          )

          mismatch=0
          for f in $PARTS; do
            actual="$(sha256sum "$f" | awk '{print $1}')"
            expected="${EXPECTED_SHA[$f]}"
            echo
            echo "File:     $f"
            echo "Expected: $expected"
            echo "Actual:   $actual"
            if [ "$actual" != "$expected" ]; then
              mismatch=1
              echo "::warning::SHA-256 mismatch for $f"
              echo "To fix, update the hash in the 'Check ZIP parts' step to:"
              echo "  [$f]=\"$actual\""
            else
              echo "SHA-256 OK: $f"
            fi
          done

          if [ "$mismatch" -ne 0 ]; then
            if [ "${STRICT_HASH_CHECK:-false}" = "true" ]; then
              echo "::error::SHA-256 mismatch (strict_hash_check enabled)."
              exit 1
            fi
            echo "::warning::Hash mismatch(es) ignored (strict mode off). Continuing."
          fi

      # ============================================================
      # 3. REASSEMBLE PROJECT ZIP
      # ============================================================
      - name: Reassemble project ZIP
        shell: bash
        run: |
          set -euo pipefail

          cat \
            MetaEvo_OpenFork_BuildSystem.zip.part-aa \
            MetaEvo_OpenFork_BuildSystem.zip.part-ab \
            MetaEvo_OpenFork_BuildSystem.zip.part-ac \
            > MetaEvo_OpenFork_BuildSystem.zip

          echo "Reassembled ZIP:"
          ls -lh MetaEvo_OpenFork_BuildSystem.zip

      # ============================================================
      # 4. VERIFY PROJECT ZIP (resilient SHA-256 + integrity test)
      # ============================================================
      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="6f8325bfeb12db2a51f98ac6246ae5ff1acb2132042a52e06cb35f4bf50e2db9"
          ACTUAL="$(sha256sum MetaEvo_OpenFork_BuildSystem.zip | awk '{print $1}')"

          echo "Expected SHA-256: $EXPECTED"
          echo "Actual SHA-256:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            if [ "${STRICT_HASH_CHECK:-false}" = "true" ]; then
              echo "::error::ZIP checksum mismatch (strict_hash_check enabled)."
              exit 1
            fi
            echo "::warning::ZIP checksum mismatch ignored (strict mode off)."
            echo "To re-enable strict checking, set EXPECTED in this step to: $ACTUAL"
          else
            echo "ZIP checksum verified."
          fi

          echo "Testing ZIP integrity..."
          unzip -t MetaEvo_OpenFork_BuildSystem.zip
          echo "ZIP integrity verified."

      # ============================================================
      # 5. EXTRACT PROJECT
      # ============================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q MetaEvo_OpenFork_BuildSystem.zip -d extracted

          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name settings.gradle.kts \
              -print -quit |
              xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 6. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 7. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 8. ANDROID BUILD TOOLS
      # ============================================================
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0"

          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

          echo "Android build tools verified."

      # ============================================================
      # 9. VERIFY PROJECT FILES
      # ============================================================
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f app/AndroidManifest.xml
          test -f app/apktool.yml
          test -f tools/bootstrap-apktool.sh
          test -f tools/verify-source.sh

          chmod +x gradlew
          chmod +x tools/bootstrap-apktool.sh
          chmod +x tools/verify-source.sh

          echo "Project files verified."

          echo "Smali class count (pre-split):"
          find app \
            -path '*/smali*' \
            -type f \
            -name '*.smali' |
            wc -l

      # ============================================================
      # 10. NORMALIZE APKTOOL METADATA
      # ============================================================
      - name: Normalize Apktool metadata
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Apktool metadata before normalization:"
          grep -nE '^[[:space:]]*version(Code|Name):' \
            app/apktool.yml || true

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/apktool.yml")
          text = path.read_text(encoding="utf-8")

          original = text

          pattern = re.compile(
              r'^(\s*versionCode:\s*)(["\'])([0-9]+)\2(\s*)$',
              re.MULTILINE
          )

          text = pattern.sub(
              lambda m: f"{m.group(1)}{m.group(3)}{m.group(4)}",
              text
          )

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Quoted versionCode normalized.")
          else:
              print("No quoted versionCode required normalization.")

          match = re.search(
              r'^\s*versionCode:\s*([0-9]+)\s*$',
              text,
              re.MULTILINE
          )

          if not match:
              raise SystemExit(
                  "ERROR: versionCode is missing or is not numeric."
              )

          print("Validated versionCode:", match.group(1))
          PY

          echo "Apktool metadata after normalization:"
          grep -nE '^[[:space:]]*version(Code|Name):' \
            app/apktool.yml || true

      # ============================================================
      # 11. BOOTSTRAP APKTOOL 3.0.3
      # ============================================================
      - name: Bootstrap Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APKTOOL_URL="https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
          APKTOOL_SHA256="dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"

          mkdir -p tools
          rm -f tools/apktool.jar

          curl \
            -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -o tools/apktool.jar \
            "$APKTOOL_URL"

          test -s tools/apktool.jar

          echo "$APKTOOL_SHA256  tools/apktool.jar" |
            sha256sum -c -

          echo "Apktool SHA-256 verified."

          java -jar tools/apktool.jar --version

      # ============================================================
      # 12. PRUNE ORPHANED PUBLIC.XML RESOURCE DECLARATIONS
      # ============================================================
      - name: Prune orphaned public.xml declarations
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          res = Path("app/res")
          public_xml_path = res / "values" / "public.xml"
          text = public_xml_path.read_text(encoding="utf-8")

          declared = set()

          name_tag_re = re.compile(r'<([\w.-]+)\b([^>]*)/?>')
          attr_pair_re = re.compile(r'([\w:.-]+)\s*=\s*"([^"]*)"')

          # 1. Every name= declared anywhere inside any values/*.xml file
          for xml_file in res.rglob("*.xml"):
              if xml_file == public_xml_path:
                  continue
              try:
                  content = xml_file.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for m in name_tag_re.finditer(content):
                  tag = m.group(1)
                  attrs = dict(attr_pair_re.findall(m.group(2)))
                  name = attrs.get("name")
                  if not name:
                      continue
                  if tag == "item":
                      rtype = attrs.get("type")
                      if rtype:
                          declared.add((rtype, name))
                  else:
                      declared.add((tag, name))

          # 2. Every file inside a non-values resource directory
          for entry in res.iterdir():
              if not entry.is_dir():
                  continue
              if entry.name == "values" or entry.name.startswith("values-"):
                  continue
              rtype = entry.name.split("-")[0]
              for f in entry.iterdir():
                  if f.is_file():
                      declared.add((rtype, f.stem))

          def resource_exists(rtype, name):
              return (rtype, name) in declared

          pattern = re.compile(r'<public\s+([^>]*?)/>', re.DOTALL)

          removed = []

          def repl(m):
              attrs = dict(attr_pair_re.findall(m.group(1)))
              rtype = attrs.get("type")
              name = attrs.get("name")
              if rtype and name and not resource_exists(rtype, name):
                  removed.append(f"{rtype}/{name}")
                  return ""
              return m.group(0)

          new_text = pattern.sub(repl, text)

          if removed:
              public_xml_path.write_text(new_text, encoding="utf-8")
              print(f"Removed {len(removed)} orphaned public.xml declarations:")
              for r in removed:
                  print(" -", r)
          else:
              print("No orphaned declarations found.")
          PY

      # ============================================================
      # 13. WRITE SHARED AAPT2 RAW-VALUE SYMBOL RESOLVER
      # ============================================================
      - name: Write shared AAPT2 symbol resolver
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          mkdir -p tools

          cat > tools/aapt_symbol_fix.py <<'PYEOF'
          #!/usr/bin/env python3
          """
          Shared AAPT2 raw-value -> symbolic-value resolver.

          Modes:
            --scan-all              Walk every app/res/**/*.xml and symbolize any
                                     recognized raw flags/enum/dimension-enum item,
                                     whether or not AAPT2 has complained about it yet.

            --fix-from-log LOGFILE  Parse an AAPT2/apktool build log for
                                     "expected (flags|enum|dimension enum) but got
                                     (raw string) VALUE" errors, and fix exactly the
                                     reported file:line. If the attribute is not
                                     recognized, the offending <item> is dropped
                                     instead (a missing style override is far safer
                                     than a failed build).
          """
          import argparse
          import re
          import sys
          from pathlib import Path

          RES_ROOT = Path("app/res")

          # ---------------------------------------------------------------
          # Decoders
          # ---------------------------------------------------------------

          def decode_gravity(value):
              RELATIVE = 0x800000
              relative = bool(value & RELATIVE)
              v = value & ~RELATIVE

              EXACT = {0x11: "center", 0x77: "fill"}
              VMASK = {0x70: "fill_vertical", 0x50: "bottom", 0x30: "top", 0x10: "center_vertical"}
              HMASK = {0x07: "fill_horizontal", 0x05: "right", 0x03: "left", 0x01: "center_horizontal"}

              if v in EXACT and not relative:
                  return EXACT[v]

              parts = []
              remaining = v

              vmask = v & 0x70
              if vmask in VMASK:
                  parts.append(VMASK[vmask])
                  remaining &= ~0x70

              hmask = v & 0x07
              if hmask in HMASK:
                  name = HMASK[hmask]
                  if relative:
                      name = {"left": "start", "right": "end"}.get(name, name)
                  parts.append(name)
                  remaining &= ~0x07

              if v & 0x80:
                  parts.append("clip_vertical")
                  remaining &= ~0x80
              if v & 0x08:
                  parts.append("clip_horizontal")
                  remaining &= ~0x08

              if remaining != 0 or not parts:
                  return None
              return "|".join(parts)


          def decode_window_soft_input_mode(value):
              if value < 0 or value & ~0xFF:
                  return None

              STATE = {
                  0: "stateUnspecified", 1: "stateUnchanged", 2: "stateHidden",
                  3: "stateAlwaysHidden", 4: "stateVisible", 5: "stateAlwaysVisible",
              }
              ADJUST = {
                  0x00: "adjustUnspecified", 0x10: "adjustResize",
                  0x20: "adjustPan", 0x30: "adjustNothing",
              }

              state_bits = value & 0x0F
              adjust_bits = value & 0xF0

              if state_bits not in STATE or adjust_bits not in ADJUST:
                  return None

              if value == 0:
                  return "stateUnspecified"

              parts = []
              if state_bits != 0:
                  parts.append(STATE[state_bits])
              if adjust_bits != 0:
                  parts.append(ADJUST[adjust_bits])
              if not parts:
                  parts.append("stateUnspecified")
              return "|".join(parts)


          def decode_text_style(value):
              if value == 0:
                  return "normal"
              parts = []
              if value & 1:
                  parts.append("bold")
              if value & 2:
                  parts.append("italic")
              remaining = value & ~0x3
              if remaining != 0 or not parts:
                  return None
              return "|".join(parts)


          def decode_dimension_enum(value):
              return {-1: "match_parent", -2: "wrap_content"}.get(value)


          FLAG_DECODERS = {
              "gravity": decode_gravity,
              "layout_gravity": decode_gravity,
              "windowSoftInputMode": decode_window_soft_input_mode,
              "textStyle": decode_text_style,
          }

          DIMENSION_ENUM_ATTRS = {"layout_width", "layout_height"}

          ENUM_TABLES = {
              "orientation": {0: "horizontal", 1: "vertical"},
              "visibility": {0: "visible", 1: "invisible", 2: "gone"},
              "textAlignment": {
                  0: "inherit", 1: "gravity", 2: "textStart", 3: "textEnd",
                  4: "center", 5: "viewStart", 6: "viewEnd",
              },
              "layoutDirection": {0: "ltr", 1: "rtl", 2: "locale", 3: "inherit"},
              "typeface": {0: "normal", 1: "sans", 2: "serif", 3: "monospace"},
              "ellipsize": {0: "none", 1: "start", 2: "middle", 3: "end", 4: "marquee"},
              "capitalize": {0: "none", 1: "sentences", 2: "words", 3: "characters"},
              "imeOptions": {
                  0: "actionUnspecified", 1: "actionNone", 2: "actionGo",
                  3: "actionSearch", 4: "actionSend", 5: "actionNext",
                  6: "actionDone", 7: "actionPrevious",
              },
          }


          def parse_raw_value(raw_value):
              raw_value = raw_value.strip()
              if raw_value.lower().startswith("0x") or raw_value.lower().startswith("-0x"):
                  neg = raw_value.startswith("-")
                  digits = raw_value[1:] if neg else raw_value
                  n = int(digits, 16)
                  return -n if neg else n
              return int(raw_value, 10)


          def resolve_symbol(attr_name, category, value):
              """category is one of: flags, enum, dimension_enum"""
              short_name = attr_name.split(":")[-1]

              if category == "dimension_enum":
                  if short_name in DIMENSION_ENUM_ATTRS:
                      return decode_dimension_enum(value)
                  return None

              if category == "flags":
                  decoder = FLAG_DECODERS.get(short_name)
                  if decoder:
                      return decoder(value)
                  return None

              if category == "enum":
                  table = ENUM_TABLES.get(short_name)
                  if table:
                      return table.get(value)
                  return None

              return None


          ITEM_RE = re.compile(
              r'(<item\s+name="((?:android:)?[\w.]+)"[^>]*>)\s*'
              r'(-?0[xX][0-9a-fA-F]+|-?[0-9]+)\s*(</item>)'
          )


          # ---------------------------------------------------------------
          # Mode 1: proactive full-tree scan
          # ---------------------------------------------------------------

          def scan_all():
              total_fixed = 0
              total_seen = 0

              for xml_file in RES_ROOT.rglob("*.xml"):
                  try:
                      text = xml_file.read_text(encoding="utf-8")
                  except Exception:
                      continue

                  fixed_here = []

                  def repl(m):
                      nonlocal total_seen
                      open_tag, attr_name, raw_value, close_tag = m.groups()
                      total_seen += 1
                      try:
                          value = parse_raw_value(raw_value)
                      except ValueError:
                          return m.group(0)

                      short_name = attr_name.split(":")[-1]
                      symbol = None

                      if short_name in DIMENSION_ENUM_ATTRS:
                          symbol = decode_dimension_enum(value)
                      elif short_name in FLAG_DECODERS:
                          symbol = FLAG_DECODERS[short_name](value)
                      elif short_name in ENUM_TABLES:
                          symbol = ENUM_TABLES[short_name].get(value)

                      if symbol is None:
                          return m.group(0)

                      fixed_here.append(f"{attr_name}: {raw_value} -> {symbol}")
                      return f"{open_tag}{symbol}{close_tag}"

                  new_text = ITEM_RE.sub(repl, text)

                  if fixed_here:
                      xml_file.write_text(new_text, encoding="utf-8")
                      total_fixed += len(fixed_here)
                      print(f"{xml_file.relative_to(RES_ROOT)}:")
                      for line in fixed_here:
                          print("  -", line)

              print(f"Proactive scan: inspected {total_seen} raw-valued items, "
                    f"symbolized {total_fixed}.")


          # ---------------------------------------------------------------
          # Mode 2: targeted fix driven by an AAPT2 error log
          # ---------------------------------------------------------------

          LOG_LINE_RE = re.compile(
              r'^(?:W:\s*)?(?P<file>\S+\.xml):(?P<line>\d+):\s*error:\s*'
              r'expected\s+(?P<category>flags|enum|dimension enum)\s+'
              r'but got \(raw string\)\s+(?P<value>-?0[xX][0-9a-fA-F]+|-?[0-9]+)'
          )


          def fix_from_log(log_path):
              text = Path(log_path).read_text(encoding="utf-8", errors="ignore")

              matches = []
              for line in text.splitlines():
                  m = LOG_LINE_RE.search(line)
                  if m:
                      matches.append(m.groupdict())

              if not matches:
                  print("No AAPT2 raw-value errors found in log.")
                  return 0

              by_file = {}
              for m in matches:
                  by_file.setdefault(m["file"], []).append(m)

              total_fixed = 0
              total_dropped = 0

              for file_path, entries in by_file.items():
                  p = Path(file_path)
                  if not p.is_file():
                      print(f"::warning::Could not locate {file_path} reported by AAPT2; skipping.")
                      continue

                  lines = p.read_text(encoding="utf-8").splitlines(keepends=True)

                  entries.sort(key=lambda e: int(e["line"]), reverse=True)

                  for entry in entries:
                      idx = int(entry["line"]) - 1
                      if idx < 0 or idx >= len(lines):
                          continue

                      line_text = lines[idx]
                      name_match = re.search(r'name="((?:android:)?[\w.]+)"', line_text)
                      if not name_match:
                          print(f"::warning::Could not find attribute name at "
                                f"{file_path}:{entry['line']}; leaving untouched.")
                          continue

                      attr_name = name_match.group(1)
                      category_key = entry["category"].replace(" ", "_")

                      try:
                          value = parse_raw_value(entry["value"])
                      except ValueError:
                          value = None

                      symbol = None
                      if value is not None:
                          symbol = resolve_symbol(attr_name, category_key, value)

                      if symbol is not None:
                          new_line, n = re.subn(
                              re.escape(entry["value"]), symbol, line_text, count=1
                          )
                          if n:
                              lines[idx] = new_line
                              total_fixed += 1
                              print(f"FIXED {file_path}:{entry['line']}  "
                                    f"{attr_name}: {entry['value']} -> {symbol}")
                              continue

                      print(f"::warning::DROPPED unresolvable {entry['category']} value "
                            f"at {file_path}:{entry['line']} "
                            f"({attr_name} = {entry['value']}); "
                            f"no symbolic mapping available, style override removed.")
                      lines[idx] = ""
                      total_dropped += 1

                  p.write_text("".join(lines), encoding="utf-8")

              print(f"Targeted log-driven fix: {total_fixed} symbolized, "
                    f"{total_dropped} dropped.")
              return total_fixed + total_dropped


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--scan-all", action="store_true")
              parser.add_argument("--fix-from-log")
              args = parser.parse_args()

              if args.scan_all:
                  scan_all()
              elif args.fix_from_log:
                  changed = fix_from_log(args.fix_from_log)
                  if changed == 0:
                      sys.exit(2)  # signal "nothing to fix" to the caller
              else:
                  parser.error("Specify --scan-all or --fix-from-log LOGFILE")


          if __name__ == "__main__":
              main()
          PYEOF

          echo "Shared resolver written to tools/aapt_symbol_fix.py"

      # ============================================================
      # 14. PROACTIVE RAW-VALUE REPAIR PASS
      # ============================================================
      - name: Repair raw AAPT2 symbolic attribute values
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 tools/aapt_symbol_fix.py --scan-all

      # ============================================================
      # 15. REPAIR MALFORMED 9-PATCH RESOURCES
      # ============================================================
      - name: Repair malformed 9-patch resources
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import struct
          import zlib

          root = Path("app/res")

          def read_png_rgba(path):
              data = path.read_bytes()

              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise ValueError("not a PNG")

              pos = 8
              width = height = None
              color_type = None
              bit_depth = None
              idat = bytearray()

              while pos < len(data):
                  length = struct.unpack(">I", data[pos:pos+4])[0]
                  ctype = data[pos+4:pos+8]
                  chunk = data[pos+8:pos+8+length]
                  pos += 12 + length

                  if ctype == b'IHDR':
                      width, height, bit_depth, color_type, _, _, _ = struct.unpack(
                          ">IIBBBBB", chunk
                      )
                  elif ctype == b'IDAT':
                      idat.extend(chunk)
                  elif ctype == b'IEND':
                      break

              if width is None:
                  raise ValueError("missing IHDR")
              if bit_depth != 8:
                  raise ValueError("unsupported bit depth")

              raw = zlib.decompress(bytes(idat))

              if color_type == 6:
                  channels = 4
              elif color_type == 2:
                  channels = 3
              else:
                  raise ValueError("unsupported PNG color type")

              stride = width * channels
              rows = []
              offset = 0
              previous = bytearray(stride)

              for _ in range(height):
                  filter_type = raw[offset]
                  offset += 1
                  current = bytearray(raw[offset:offset+stride])
                  offset += stride

                  for i in range(stride):
                      left = current[i-channels] if i >= channels else 0
                      up = previous[i]
                      up_left = previous[i-channels] if i >= channels else 0

                      if filter_type == 0:
                          pass
                      elif filter_type == 1:
                          current[i] = (current[i] + left) & 255
                      elif filter_type == 2:
                          current[i] = (current[i] + up) & 255
                      elif filter_type == 3:
                          current[i] = (current[i] + ((left + up) // 2)) & 255
                      elif filter_type == 4:
                          p = left + up - up_left
                          pa, pb, pc = abs(p-left), abs(p-up), abs(p-up_left)
                          if pa <= pb and pa <= pc:
                              predictor = left
                          elif pb <= pc:
                              predictor = up
                          else:
                              predictor = up_left
                          current[i] = (current[i] + predictor) & 255
                      else:
                          raise ValueError(f"unsupported PNG filter {filter_type}")

                  previous = current
                  rows.append(current)

              pixels = []
              for row in rows:
                  row_pixels = []
                  for x in range(width):
                      base = x * channels
                      if channels == 4:
                          r, g, b, a = row[base:base+4]
                      else:
                          r, g, b = row[base:base+3]
                          a = 255
                      row_pixels.append((r, g, b, a))
                  pixels.append(row_pixels)

              return width, height, pixels

          def is_neutral(px):
              r, g, b, a = px
              if a == 0:
                  return True
              return a == 255 and r == 255 and g == 255 and b == 255

          def is_black_marker(px):
              r, g, b, a = px
              return a == 255 and r == 0 and g == 0 and b == 0

          def is_red_marker(px):
              r, g, b, a = px
              return a == 255 and r == 255 and g == 0 and b == 0

          def validate_ninepatch(path):
              try:
                  width, height, pixels = read_png_rgba(path)
              except Exception as e:
                  return False, f"could not validate: {e}"

              if width < 3 or height < 3:
                  return False, "too small to be a valid 9-patch"

              top_row = pixels[0]
              bottom_row = pixels[height-1]
              left_col = [pixels[y][0] for y in range(height)]
              right_col = [pixels[y][width-1] for y in range(height)]

              for corner in (top_row[0], top_row[-1], bottom_row[0], bottom_row[-1]):
                  if not is_neutral(corner):
                      return False, "invalid corner pixel (must be transparent)"

              for px in top_row[1:-1] + bottom_row[1:-1] + left_col[1:-1] + right_col[1:-1]:
                  if not (is_neutral(px) or is_black_marker(px)):
                      return False, "invalid 9-patch frame color"

              return True, None

          fixed = []

          for ninepatch in root.rglob("*.9.png"):
              valid, reason = validate_ninepatch(ninepatch)
              if valid:
                  continue

              new_path = ninepatch.with_name(ninepatch.name[:-6] + ".png")
              ninepatch.rename(new_path)
              fixed.append(f"{ninepatch.name} -> {new_path.name} ({reason})")

          for entry in fixed:
              print(f"REPAIRED: {entry}")

          remaining = list(root.rglob("*.9.png"))
          print(f"Remaining valid .9.png resources: {len(remaining)}")
          print(f"Malformed resources converted to ordinary PNG: {len(fixed)}")
          print()
          print("9-patch repair complete.")
          print("Remaining .9.png resources:")
          print(len(remaining))
          PY

      # ============================================================
      # 16. VERIFY SOURCE STRUCTURE
      #
      # Runs on the PRISTINE extracted tree (before the smali split
      # mutates file counts). tools/verify-source.sh has a
      # hard-coded expected smali class count; running this after
      # the split would trip that check.
      # ============================================================
      - name: Verify source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./tools/verify-source.sh

      # ============================================================
      # 17. REPAIR MERGED SMALI SOURCES
      #
      # Some decompiled .smali files contain TWO OR MORE concatenated
      # classes (several '.class' directives). Smali then aborts with
      # "missing EOF at '.class'" and the whole build fails. This
      # step splits every multi-class file into one file per class,
      # then re-validates that no merged file remains.
      #
      # NOTE: this step INCREASES the .smali file count, which is
      # why it runs AFTER "Verify source structure" (step 16).
      # ============================================================
      - name: Repair merged smali sources
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          mkdir -p tools

          cat > tools/smali_split_fix.py <<'PY'
          #!/usr/bin/env python3
          """Split .smali files that contain multiple '.class' directives."""
          import pathlib
          import re
          import sys

          CLASS_RE = re.compile(r"^\.class\s")

          def split_file(path: pathlib.Path) -> int:
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)
              starts = [i for i, ln in enumerate(lines) if CLASS_RE.match(ln)]
              if len(starts) <= 1:
                  return 0

              header = lines[: starts[0]]  # leading comments -> first class
              created, seen = 0, set()
              for n, s in enumerate(starts):
                  end = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  block = lines[s:end]
                  if n == 0 and header:
                      block = header + block
                  descriptor = lines[s].split()[-1].rstrip(";")
                  if not descriptor.startswith("L"):
                      print(f"!! unparseable .class line in {path}:{s+1}", file=sys.stderr)
                      continue
                  rel = descriptor[1:] + ".smali"  # Lcom/foo/Bar; -> com/foo/Bar.smali
                  if rel in seen:
                      print(f"!! duplicate class {descriptor} in {path} - keeping first", file=sys.stderr)
                      continue
                  seen.add(rel)
                  out = path.parent / rel
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_text("".join(block), encoding="utf-8")
                  created += 1

              path.unlink()  # merged original is invalid once split
              print(f"split: {path} -> {created} class file(s)")
              return created

          def main() -> int:
              roots = [pathlib.Path(p) for p in sys.argv[1:]] or [pathlib.Path("app")]
              total = 0
              for root in roots:
                  for smali in sorted(root.rglob("*.smali")):
                      try:
                          total += split_file(smali)
                      except Exception as exc:
                          print(f"!! {smali}: {exc}", file=sys.stderr)
              print(f"total classes extracted: {total}")
              return 1 if total else 0

          if __name__ == "__main__":
              sys.exit(main())
          PY
          chmod +x tools/smali_split_fix.py

          echo "Scanning smali sources for duplicate '.class' directives..."
          set +e
          python3 tools/smali_split_fix.py app
          split_status=$?
          set -e
          if [ "$split_status" -ne 0 ]; then
            echo "Merged smali files were split (see above)."
          else
            echo "No merged smali files found."
          fi

          echo "Validating that every remaining .smali holds exactly one class..."
          python3 <<'PY'
          import pathlib
          import re
          import sys

          bad = []
          for p in pathlib.Path("app").rglob("*.smali"):
              try:
                  with open(p, encoding="utf-8", errors="replace") as fh:
                      n = sum(1 for ln in fh if re.match(r"^\.class\s", ln))
              except Exception:
                  continue
              if n > 1:
                  bad.append(str(p))

          if bad:
              print("::error::Still-merged smali files:")
              for b in bad:
                  print(f"  - {b}")
              sys.exit(1)
          print("All smali files contain exactly one class.")
          PY

          echo "Smali class count (post-split):"
          find app -path '*/smali*' -type f -name '*.smali' | wc -l

      # ============================================================
      # 18. SHOW GRADLE VERSION
      # ============================================================
      - name: Show Gradle version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew --version --no-daemon

      # ============================================================
      # 19. BUILD UNSIGNED APK (SELF-HEALING)
      # ============================================================
      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf build/dist
          mkdir -p build/dist

          MAX_ATTEMPTS="${MAX_BUILD_ATTEMPTS:-8}"
          attempt=1
          build_ok=0

          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "=================================================="
            echo "Build attempt $attempt of $MAX_ATTEMPTS"
            echo "=================================================="

            LOG_FILE="build_attempt_${attempt}.log"

            set +e
            ./gradlew assembleOpenFork --no-daemon --stacktrace 2>&1 | tee "$LOG_FILE"
            status="${PIPESTATUS[0]}"
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Build succeeded on attempt $attempt."
              build_ok=1
              break
            fi

            echo "Build attempt $attempt failed (exit $status)."

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Build failed after $MAX_ATTEMPTS attempts. Full log of final attempt:"
              cat "$LOG_FILE"
              exit 1
            fi

            echo "Attempting automatic repair..."

            # 1) AAPT2 raw enum/flags values (styles.xml etc.)
            set +e
            python3 tools/aapt_symbol_fix.py --fix-from-log "$LOG_FILE"
            fix_status=$?
            set -e

            # 2) Merged smali files ("missing EOF at '.class'")
            set +e
            python3 tools/smali_split_fix.py app
            smali_status=$?
            set -e

            # Only give up when NEITHER repair changed anything
            if [ "$fix_status" -eq 2 ] && [ "$smali_status" -eq 0 ]; then
              echo "::error::Build failed and no known repair pattern changed anything."
              echo "  - aapt_symbol_fix.py: no AAPT2 raw-value pattern (exit 2)"
              echo "  - smali_split_fix.py: no merged smali files (exit 0)"
              echo "Full log of failed attempt:"
              cat "$LOG_FILE"
              exit 1
            fi

            attempt=$((attempt+1))
          done

          if [ "$build_ok" -ne 1 ]; then
            echo "::error::Build did not succeed."
            exit 1
          fi

          APK="$PROJECT_DIR/build/dist/MetaEvo-OpenFork-unsigned.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Expected unsigned APK was not produced."
            echo "Searching for APK files..."
            find "$PROJECT_DIR/build" -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          echo "Unsigned APK successfully created:"
          ls -lh "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"

      # ============================================================
      # 20. ZIPALIGN
      # ============================================================
      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" -v -p 4 \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk" \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"

          test -s "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"

          echo "Zipalign complete:"
          ls -lh "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"

      # ============================================================
      # 21. SIGN APK (ephemeral debug keystore)
      # ============================================================
      - name: Sign APK (ephemeral debug keystore)
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          KEYTOOL="$JAVA_HOME/bin/keytool"

          KEYSTORE="$RUNNER_TEMP/openfork-debug.keystore"
          STOREPASS="android"
          KEYALIAS="openfork-debug"
          KEYPASS="android"

          "$KEYTOOL" -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass "$STOREPASS" \
            -alias "$KEYALIAS" \
            -keypass "$KEYPASS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MetaEvo OpenFork Debug, OU=CI, O=CI, L=CI, S=CI, C=US"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$STOREPASS" \
            --ks-key-alias "$KEYALIAS" \
            --key-pass "pass:$KEYPASS" \
            --out "$GITHUB_WORKSPACE/MetaEvo-OpenFork-signed.apk" \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"

          "$APKSIGNER" verify --print-certs \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-signed.apk"

          echo "Signed APK:"
          ls -lh "$GITHUB_WORKSPACE/MetaEvo-OpenFork-signed.apk"

      # ============================================================
      # 22. CHECKSUMS
      # ============================================================
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            MetaEvo-OpenFork-unsigned.apk \
            MetaEvo-OpenFork-aligned.apk \
            MetaEvo-OpenFork-signed.apk \
            > MetaEvo-OpenFork-checksums.sha256

          cat MetaEvo-OpenFork-checksums.sha256

      # ============================================================
      # 23. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-build
          path: |
            MetaEvo-OpenFork-signed.apk
            MetaEvo-OpenFork-aligned.apk
            MetaEvo-OpenFork-unsigned.apk
            MetaEvo-OpenFork-checksums.sha256
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 24. UPLOAD BUILD LOGS ON FAILURE
      # ============================================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: extracted/**/build_attempt_*.log
          if-no-files-found: ignore
          retention-days: 7
