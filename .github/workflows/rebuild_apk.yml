      # ============================================================
      # WRITE MISSING RESOURCE FIX SCRIPT (NEW)
      #
      # Creates placeholder .xml files (or values/ entries) for any
      # resource referenced from XML but missing from the source tree.
      # Example: anim/r.xml references @interpolator/b -> create
      # app/res/interpolator/b.xml with a valid <linearInterpolator/>.
      # ============================================================
      - name: Write missing resource fix script
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"; mkdir -p tools
          cat > tools/missing_resources_fix.py <<'PYEOF'
          #!/usr/bin/env python3
          """Create placeholder resources for references reported as missing by AAPT2."""
          import re, sys
          from pathlib import Path

          LOG_RE = re.compile(r'error:\s+resource\s+(?P<rtype>[\w.-]+)/(?P<rname>[\w.-]+)\s+not found')
          RES_ROOT = Path("app/res")

          FILE_PLACEHOLDERS = {
              "interpolator": '<?xml version="1.0" encoding="utf-8"?>\n<linearInterpolator/>\n',
              "anim":         '<?xml version="1.0" encoding="utf-8"?>\n<set/>\n',
              "animator":     '<?xml version="1.0" encoding="utf-8"?>\n<set/>\n',
              "drawable":     ('<?xml version="1.0" encoding="utf-8"?>\n'
                               '<shape xmlns:android="http://schemas.android.com/apk/res/android">'
                               '<solid android:color="#00000000"/></shape>\n'),
              "mipmap":       ('<?xml version="1.0" encoding="utf-8"?>\n'
                               '<shape xmlns:android="http://schemas.android.com/apk/res/android">'
                               '<solid android:color="#00000000"/></shape>\n'),
              "color":        '<?xml version="1.0" encoding="utf-8"?>\n<selector xmlns:android="http://schemas.android.com/apk/res/android"/>\n',
              "layout":       '<?xml version="1.0" encoding="utf-8"?>\n<View xmlns:android="http://schemas.android.com/apk/res/android"/>\n',
              "xml":          '<?xml version="1.0" encoding="utf-8"?>\n<PreferenceScreen xmlns:android="http://schemas.android.com/apk/res/android"/>\n',
              "menu":         '<?xml version="1.0" encoding="utf-8"?>\n<menu xmlns:android="http://schemas.android.com/apk/res/android"/>\n',
              "font":         None,  # font resources need a real TTF/OTF, skip
              "raw":          None,  # raw resources are files, skip
          }

          VALUES_TYPES = {"string","color","dimen","array","integer","bool","style","plurals","fraction","id"}

          def _entry_xml(rtype, rname):
              if rtype == "attr":
                  return f'    <attr name="{rname}" format="string"/>\n'
              if rtype == "id":
                  return f'    <item type="id" name="{rname}"/>\n'
              if rtype == "string":
                  return f'    <string name="{rname}">placeholder</string>\n'
              if rtype == "color":
                  return f'    <color name="{rname}">#00000000</color>\n'
              if rtype == "dimen":
                  return f'    <dimen name="{rname}">0dp</dimen>\n'
              if rtype == "bool":
                  return f'    <bool name="{rname}">false</bool>\n'
              if rtype == "integer":
                  return f'    <integer name="{rname}">0</integer>\n'
              return f'    <item type="{rtype}" name="{rname}"/>\n'

          def create_placeholder(rtype, rname):
              if rtype in VALUES_TYPES or rtype == "attr":
                  overrides = RES_ROOT / "values" / "zz_placeholders.xml"
                  overrides.parent.mkdir(parents=True, exist_ok=True)
                  if not overrides.exists():
                      overrides.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n', encoding='utf-8')
                  text = overrides.read_text(encoding='utf-8')
                  marker = f'name="{rname}"'
                  if marker in text:
                      return False
                  text = text.replace("</resources>", _entry_xml(rtype, rname) + "</resources>")
                  overrides.write_text(text, encoding='utf-8')
                  return True
              if rtype not in FILE_PLACEHOLDERS or FILE_PLACEHOLDERS[rtype] is None:
                  return False
              target_dir = RES_ROOT / rtype
              target_dir.mkdir(parents=True, exist_ok=True)
              target = target_dir / f"{rname}.xml"
              if target.exists():
                  return False
              target.write_text(FILE_PLACEHOLDERS[rtype], encoding='utf-8')
              return True

          def fix_from_log(log_path):
              text = Path(log_path).read_text(encoding='utf-8', errors='ignore')
              matches = []
              for line in text.splitlines():
                  m = LOG_RE.search(line)
                  if m: matches.append(m.groupdict())
              if not matches:
                  print("No missing-resource errors found in log.")
                  return 0
              created = 0; seen = set()
              for m in matches:
                  key = (m["rtype"], m["rname"])
                  if key in seen: continue
                  seen.add(key)
                  if create_placeholder(m["rtype"], m["rname"]):
                      print(f"CREATED placeholder: {m['rtype']}/{m['rname']}")
                      created += 1
                  else:
                      print(f"::warning::Could not create placeholder for {m['rtype']}/{m['rname']}")
              return created

          def main():
              if len(sys.argv) < 2:
                  print("Usage: missing_resources_fix.py <log>"); sys.exit(2)
              if fix_from_log(sys.argv[1]) == 0: sys.exit(2)
              return 0

          if __name__ == "__main__": sys.exit(main())
          PYEOF
          echo "missing_resources_fix.py written."

      # ============================================================
      # WRITE SMALI SYNTAX FIX SCRIPT (NEW)
      #
      # Repairs smali parser errors of the form:
      #   file.smali[L,C] required (...)+ loop did not match anything at input '...'
      # For a .field declaration with a malformed/empty value, replaces the
      # value with 0x0. Otherwise comments the offending line out.
      # ============================================================
      - name: Write smali syntax fix script
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"; mkdir -p tools
          cat > tools/smali_syntax_fix.py <<'PYEOF'
          #!/usr/bin/env python3
          import re, sys
          from pathlib import Path

          SYNTAX_RE = re.compile(
              r'(?P<file>\S+\.smali)\[(?P<line>\d+),(?P<col>\d+)\]\s+'
              r'required \(\.\.\.\)\+ loop did not match anything at input'
          )

          FIELD_RE = re.compile(r'^(\s*\.field\s+[^\n=]+?=\s*)(.*?)(\s*(?:#.*)?)$')

          def repair_line(line):
              stripped = line.rstrip("\n")
              m = FIELD_RE.match(stripped)
              if m:
                  prefix, value, suffix = m.groups()
                  value_clean = value.strip()
                  if not value_clean or re.fullmatch(r'-?0[xX]?', value_clean):
                      return prefix + "0x0" + suffix + "\n", True
                  tokens = value_clean.split()
                  if len(tokens) > 1:
                      return prefix + tokens[0] + suffix + "\n", True
                  return line, False
              return "# [smali_syntax_fix removed malformed line]\n", True

          def fix_from_log(log_path):
              text = Path(log_path).read_text(encoding="utf-8", errors="ignore")
              matches = []
              for line in text.splitlines():
                  m = SYNTAX_RE.search(line)
                  if m: matches.append(m.groupdict())
              if not matches:
                  print("No smali syntax errors found in log.")
                  return 0
              by_file = {}
              for m in matches: by_file.setdefault(m["file"], []).append(m)
              total_fixed = 0
              for fp, entries in by_file.items():
                  p = Path(fp)
                  if not p.is_file():
                      print(f"::warning::Not found {fp}"); continue
                  lines = p.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)
                  entries.sort(key=lambda e: int(e["line"]), reverse=True)
                  for e in entries:
                      idx = int(e["line"]) - 1
                      if idx < 0 or idx >= len(lines): continue
                      nl, fixed = repair_line(lines[idx])
                      if fixed:
                          lines[idx] = nl; total_fixed += 1
                          print(f"FIXED {fp}:{e['line']}")
                      else:
                          print(f"::warning::Could not auto-repair {fp}:{e['line']}")
                  p.write_text("".join(lines), encoding="utf-8")
              return total_fixed

          def main():
              if len(sys.argv) < 2:
                  print("Usage: smali_syntax_fix.py <log>"); sys.exit(2)
              if fix_from_log(sys.argv[1]) == 0: sys.exit(2)
              return 0

          if __name__ == "__main__": sys.exit(main())
          PYEOF
          echo "smali_syntax_fix.py written."

      - name: Repair raw AAPT2 symbolic attribute values
