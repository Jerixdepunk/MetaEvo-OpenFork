      - name: Repair malformed 9-patch resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 <<'PY'
          from pathlib import Path
          import struct, zlib
          root = Path("app/res")
          def read_png_rgba(path):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n': raise ValueError("not a PNG")
              pos = 8; width = height = None; color_type = None; bit_depth = None; idat = bytearray()
              while pos < len(data):
                  length = struct.unpack(">I", data[pos:pos+4])[0]
                  ctype = data[pos+4:pos+8]; chunk = data[pos+8:pos+8+length]; pos += 12 + length
                  if ctype == b'IHDR':
                      width, height, bit_depth, color_type, _, _, _ = struct.unpack(">IIBBBBB", chunk)
                  elif ctype == b'IDAT': idat.extend(chunk)
                  elif ctype == b'IEND': break
              if width is None or bit_depth != 8: raise ValueError("bad IHDR")
              raw = zlib.decompress(bytes(idat))
              channels = 4 if color_type == 6 else (3 if color_type == 2 else 0)
              if channels == 0: raise ValueError("bad color type")
              stride = width * channels; rows = []; offset = 0; previous = bytearray(stride)
              for _ in range(height):
                  ft = raw[offset]; offset += 1
                  current = bytearray(raw[offset:offset+stride]); offset += stride
                  for i in range(stride):
                      left = current[i-channels] if i >= channels else 0
                      up = previous[i]; ul = previous[i-channels] if i >= channels else 0
                      if ft == 0: pass
                      elif ft == 1: current[i] = (current[i] + left) & 255
                      elif ft == 2: current[i] = (current[i] + up) & 255
                      elif ft == 3: current[i] = (current[i] + ((left + up) // 2)) & 255
                      elif ft == 4:
                          p = left + up - ul; pa, pb, pc = abs(p-left), abs(p-up), abs(p-ul)
                          pr = left if pa <= pb and pa <= pc else (up if pb <= pc else ul)
                          current[i] = (current[i] + pr) & 255
                      else: raise ValueError(f"bad filter {ft}")
                  previous = current; rows.append(current)
              pixels = []
              for row in rows:
                  rp = []
                  for x in range(width):
                      b = x * channels
                      if channels == 4: r, g, bl, a = row[b:b+4]
                      else: r, g, bl = row[b:b+3]; a = 255
                      rp.append((r, g, bl, a))
                  pixels.append(rp)
              return width, height, pixels
          def is_neutral(px):
              r, g, b, a = px
              return a == 0 or (a == 255 and r == 255 and g == 255 and b == 255)
          def is_black_marker(px):
              r, g, b, a = px
              return a == 255 and r == 0 and g == 0 and b == 0
          def validate_ninepatch(path):
              try: width, height, pixels = read_png_rgba(path)
              except Exception as e: return False, str(e)
              if width < 3 or height < 3: return False, "too small"
              top = pixels[0]; bot = pixels[height-1]
              lc = [pixels[y][0] for y in range(height)]; rc = [pixels[y][width-1] for y in range(height)]
              for c in (top[0], top[-1], bot[0], bot[-1]):
                  if not is_neutral(c): return False, "bad corner"
              for px in top[1:-1] + bot[1:-1] + lc[1:-1] + rc[1:-1]:
                  if not (is_neutral(px) or is_black_marker(px)): return False, "bad frame"
              return True, None
          fixed = []
          for n in root.rglob("*.9.png"):
              ok, reason = validate_ninepatch(n)
              if ok: continue
              n.rename(n.with_name(n.name[:-6] + ".png"))
              fixed.append(f"{n.name} ({reason})")
          for e in fixed: print(f"REPAIRED: {e}")
          print(f"Remaining .9.png: {len(list(root.rglob('*.9.png')))}")
          PY

