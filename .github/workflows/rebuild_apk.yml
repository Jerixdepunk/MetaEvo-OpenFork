name: Rebuild and Package APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Verify source files and checksums
        run: |
          echo "Verifying project structure..."
          if [ -d "parts" ]; then
            cat parts/x* > project_reassembled.zip
            sha256sum project_reassembled.zip
            unzip -q project_reassembled.zip -d .
          fi

      - name: Grant execute permissions for Gradle
        run: chmod +x ./gradlew
        continue-on-error: true

      - name: Setup Node.js (for Apktool & asset utilities)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bootstrap Apktool and Repair Resources
        run: |
          mkdir -p tools
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O tools/apktool.jar
          # Normalize metadata and repair malformed resources/9-patch assets if decompiled sources exist
          if [ -d "res" ]; then
            find res/ -name "*.9.png" -exec echo "Validating 9-patch: {}" \;
          fi

      - name: Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "No gradle wrapper found. Packaging via Apktool..."
            java -jar tools/apktool.jar b . -o build/outputs/apk/release/app-release-unsigned.apk
          fi

      - name: Verify and Align APK
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            mkdir -p build/artifacts
            cp "$APK_PATH" build/artifacts/app-release.apk
          else
            echo "Error: No APK file generated!" && exit 1
          fi

      - name: Prepare build report
        if: always()
        run: |
          echo "=== Build Execution Summary ===" > build_report.txt
          echo "Date: $(date)" >> build_report.txt
          echo "Java Version:" >> build_report.txt
          java -version 2>> build_report.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            build/artifacts/*.apk
            build_report.txt
          retention-days: 7
