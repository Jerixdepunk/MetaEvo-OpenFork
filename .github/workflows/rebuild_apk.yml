name: Build MetaEvo OpenFork from Parts

on:
  workflow_dispatch:
    inputs:
      strict_hash_check:
        description: "Fail the run if SHA-256 hashes differ from the values recorded in this workflow"
        required: false
        type: boolean
        default: false
      max_build_attempts:
        description: "Maximum number of Gradle build attempts"
        required: false
        type: number
        default: 8

permissions:
  contents: read

jobs:
  build:
    name: Rebuild and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      STRICT_HASH_CHECK: ${{ inputs.strict_hash_check }}
      MAX_BUILD_ATTEMPTS: ${{ inputs.max_build_attempts }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 1. CHECK ZIP PARTS
      # ============================================================
      - name: Check ZIP parts
        shell: bash
        run: |
          set -euo pipefail

          PARTS="MetaEvo_OpenFork_BuildSystem.zip.part-aa MetaEvo_OpenFork_BuildSystem.zip.part-ab MetaEvo_OpenFork_BuildSystem.zip.part-ac"

          for f in $PARTS; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          echo "All ZIP parts found."
          ls -lh $PARTS

          declare -A EXPECTED_SHA=(
            [MetaEvo_OpenFork_BuildSystem.zip.part-aa]="e6429a7abaddebcb08429a1fca30a348a526f54d0dad869eaf6e30bcbda2ba10"
            [MetaEvo_OpenFork_BuildSystem.zip.part-ab]="00f7ffdfae415401a3b6714b42309e5aa605c3d4dff7a1b806c938eb1647abe6"
            [MetaEvo_OpenFork_BuildSystem.zip.part-ac]="d4fc4c210adfed9b5c6870a309d98cce89ece417f8b699313d7a280cac269756"
          )

          mismatch=0
          for f in $PARTS; do
            actual="$(sha256sum "$f" | awk '{print $1}')"
            expected="${EXPECTED_SHA[$f]}"
            echo
            echo "File:     $f"
            echo "Expected: $expected"
            echo "Actual:   $actual"
            if [ "$actual" != "$expected" ]; then
              mismatch=1
              echo "::warning::SHA-256 mismatch for $f"
              echo "  [$f]=\"$actual\""
            else
              echo "SHA-256 OK: $f"
            fi
          done

          if [ "$mismatch" -ne 0 ]; then
            if [ "${STRICT_HASH_CHECK:-false}" = "true" ]; then
              echo "::error::SHA-256 mismatch (strict_hash_check enabled)."
              exit 1
            fi
            echo "::warning::Hash mismatch(es) ignored (strict mode off). Continuing."
          fi

      # ============================================================
      # 2. REASSEMBLE ZIP
      # ============================================================
      - name: Reassemble project ZIP
        shell: bash
        run: |
          set -euo pipefail

          cat \
            MetaEvo_OpenFork_BuildSystem.zip.part-aa \
            MetaEvo_OpenFork_BuildSystem.zip.part-ab \
            MetaEvo_OpenFork_BuildSystem.zip.part-ac \
            > MetaEvo_OpenFork_BuildSystem.zip

          echo "Reassembled ZIP:"
          ls -lh MetaEvo_OpenFork_BuildSystem.zip

      # ============================================================
      # 3. VERIFY ZIP
      # ============================================================
      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="6f8325bfeb12db2a51f98ac6246ae5ff1acb2132042a52e06cb35f4bf50e2db9"
          ACTUAL="$(sha256sum MetaEvo_OpenFork_BuildSystem.zip | awk '{print $1}')"

          echo "Expected SHA-256: $EXPECTED"
          echo "Actual SHA-256:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            if [ "${STRICT_HASH_CHECK:-false}" = "true" ]; then
              echo "::error::ZIP checksum mismatch (strict_hash_check enabled)."
              exit 1
            fi
            echo "::warning::ZIP checksum mismatch ignored (strict mode off)."
            echo "Set EXPECTED in this step to: $ACTUAL"
          else
            echo "ZIP checksum verified."
          fi

          echo "Testing ZIP integrity..."
          unzip -t MetaEvo_OpenFork_BuildSystem.zip
          echo "ZIP integrity verified."

      # ============================================================
      # 4. EXTRACT
      # ============================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q MetaEvo_OpenFork_BuildSystem.zip -d extracted

          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f -name settings.gradle.kts -print -quit |
              xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      # ============================================================
      # 5. TOOLCHAIN
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;35.0.0"

          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

          echo "Android build tools verified."

      # ============================================================
      # 6. VERIFY PROJECT FILES
      # ============================================================
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f app/AndroidManifest.xml
          test -f app/apktool.yml
          test -f tools/bootstrap-apktool.sh
          test -f tools/verify-source.sh

          chmod +x gradlew tools/bootstrap-apktool.sh tools/verify-source.sh

          echo "Smali class count (pre-split):"
          find app -path '*/smali*' -type f -name '*.smali' | wc -l

      # ============================================================
      # 7. NORMALIZE APKTOOL METADATA
      # ============================================================
      - name: Normalize Apktool metadata
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/apktool.yml")
          text = path.read_text(encoding="utf-8")
          original = text

          text = re.sub(
              r'^(\s*versionCode:\s*)(["\'])([0-9]+)\2(\s*)$',
              lambda m: f"{m.group(1)}{m.group(3)}{m.group(4)}",
              text,
              flags=re.MULTILINE,
          )

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Quoted versionCode normalized.")

          m = re.search(r'^\s*versionCode:\s*([0-9]+)\s*$', text, re.MULTILINE)
          if not m:
              raise SystemExit("ERROR: versionCode missing or non-numeric.")
          print("Validated versionCode:", m.group(1))
          PY

      # ============================================================
      # 8. BOOTSTRAP APKTOOL
      # ============================================================
      - name: Bootstrap Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APKTOOL_URL="https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
          APKTOOL_SHA256="dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"

          mkdir -p tools
          rm -f tools/apktool.jar

          curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
            -o tools/apktool.jar "$APKTOOL_URL"

          test -s tools/apktool.jar
          echo "$APKTOOL_SHA256  tools/apktool.jar" | sha256sum -c -
          java -jar tools/apktool.jar --version

      # ============================================================
      # 9. PRUNE ORPHANED PUBLIC.XML DECLARATIONS
      # ============================================================
      - name: Prune orphaned public.xml declarations
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          res = Path("app/res")
          pub = res / "values" / "public.xml"
          if not pub.exists():
              print("public.xml not found; skipping.")
              raise SystemExit(0)

          text = pub.read_text(encoding="utf-8")
          declared = set()
          tag_re = re.compile(r'<([\w.-]+)\b([^>]*)/?>')
          attr_re = re.compile(r'([\w:.-]+)\s*=\s*"([^"]*)"')

          for xml_file in res.rglob("*.xml"):
              if xml_file == pub:
                  continue
              try:
                  content = xml_file.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for m in tag_re.finditer(content):
                  tag = m.group(1)
                  a = dict(attr_re.findall(m.group(2)))
                  name = a.get("name")
                  if not name:
                      continue
                  if tag == "item":
                      rt = a.get("type")
                      if rt:
                          declared.add((rt, name))
                  else:
                      declared.add((tag, name))

          for e in res.iterdir():
              if not e.is_dir():
                  continue
              if e.name == "values" or e.name.startswith("values-"):
                  continue
              rt = e.name.split("-")[0]
              for f in e.iterdir():
                  if f.is_file():
                      declared.add((rt, f.stem))

          removed = []

          def repl(m):
              a = dict(attr_re.findall(m.group(1)))
              rt = a.get("type")
              name = a.get("name")
              if rt and name and (rt, name) not in declared:
                  removed.append(f"{rt}/{name}")
                  return ""
              return m.group(0)

          new_text = re.sub(r'<public\s+([^>]*?)/>', repl, text, flags=re.DOTALL)

          if removed:
              pub.write_text(new_text, encoding="utf-8")
              print(f"Removed {len(removed)} orphaned declarations.")
          else:
              print("No orphaned declarations found.")
          PY

      # ============================================================
      # 10. WRITE aapt_symbol_fix.py
      # ============================================================
      - name: Write aapt symbol fix script
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          mkdir -p tools

          cat > tools/aapt_symbol_fix.py <<'PYEOF'
          #!/usr/bin/env python3
          """Resolve AAPT2 raw enum/flags/dimension-enum values to symbolic names."""
          import argparse
          import re
          import sys
          from pathlib import Path

          RES_ROOT = Path("app/res")


          def decode_gravity(value):
              RELATIVE = 0x800000
              relative = bool(value & RELATIVE)
              v = value & ~RELATIVE
              if v == 0x11 and not relative:
                  return "center"
              if v == 0x77 and not relative:
                  return "fill"
              VM = {0x70: "fill_vertical", 0x50: "bottom", 0x30: "top", 0x10: "center_vertical"}
              HM = {0x07: "fill_horizontal", 0x05: "right", 0x03: "left", 0x01: "center_horizontal"}
              parts, remaining = [], v
              vm = v & 0x70
              if vm in VM:
                  parts.append(VM[vm]); remaining &= ~0x70
              hm = v & 0x07
              if hm in HM:
                  name = HM[hm]
                  if relative:
                      name = {"left": "start", "right": "end"}.get(name, name)
                  parts.append(name); remaining &= ~0x07
              if v & 0x80:
                  parts.append("clip_vertical"); remaining &= ~0x80
              if v & 0x08:
                  parts.append("clip_horizontal"); remaining &= ~0x08
              if remaining != 0 or not parts:
                  return None
              return "|".join(parts)


          def decode_window_soft_input_mode(value):
              if value < 0 or value & ~0xFF:
                  return None
              S = {0: "stateUnspecified", 1: "stateUnchanged", 2: "stateHidden",
                   3: "stateAlwaysHidden", 4: "stateVisible", 5: "stateAlwaysVisible"}
              A = {0x00: "adjustUnspecified", 0x10: "adjustResize",
                   0x20: "adjustPan", 0x30: "adjustNothing"}
              sb, ab = value & 0x0F, value & 0xF0
              if sb not in S or ab not in A:
                  return None
              if value == 0:
                  return "stateUnspecified"
              parts = []
              if sb != 0:
                  parts.append(S[sb])
              if ab != 0:
                  parts.append(A[ab])
              return "|".join(parts) if parts else "stateUnspecified"


          def decode_text_style(value):
              if value == 0:
                  return "normal"
              parts = []
              if value & 1:
                  parts.append("bold")
              if value & 2:
                  parts.append("italic")
              if value & ~0x3 or not parts:
                  return None
              return "|".join(parts)


          def decode_screen_orientation(value):
              return {0: "landscape", 1: "portrait", 2: "user", 3: "behind",
                      4: "sensor", 5: "nosensor", 6: "sensorLandscape",
                      7: "sensorPortrait", 8: "reverseLandscape", 9: "reversePortrait",
                      10: "fullSensor", 11: "userLandscape", 12: "userPortrait",
                      13: "fullUser", 14: "locked"}.get(value)


          CONFIG_CHANGES = {
              0x0001: "mcc", 0x0002: "mnc", 0x0004: "locale", 0x0008: "touchscreen",
              0x0010: "keyboard", 0x0020: "keyboardHidden", 0x0040: "navigation",
              0x0080: "orientation", 0x0100: "screenLayout", 0x0200: "uiMode",
              0x0400: "screenSize", 0x0800: "smallestScreenSize", 0x1000: "density",
              0x2000: "layoutDirection", 0x40000000: "fontScale",
          }


          def decode_config_changes(value):
              parts, remaining = [], value
              for bit in sorted(CONFIG_CHANGES):
                  if value & bit:
                      parts.append(CONFIG_CHANGES[bit]); remaining &= ~bit
              if remaining != 0 or not parts:
                  return None
              return "|".join(parts)


          def decode_scale_type(value):
              return {0: "matrix", 1: "fitXY", 2: "fitStart", 3: "fitCenter",
                      4: "fitEnd", 5: "center", 6: "centerCrop",
                      7: "centerInside"}.get(value)


          def decode_cutout_mode(value):
              return {0: "default", 1: "shortEdges", 2: "never", 3: "always"}.get(value)


          def decode_break_strategy(value):
              return {0: "simple", 1: "high_quality", 2: "balanced"}.get(value)


          def decode_hyphenation(value):
              return {0: "none", 1: "normal", 2: "full"}.get(value)


          DISPLAY_OPTIONS = {
              0x1: "useLogo", 0x2: "showHome", 0x4: "homeAsUp",
              0x8: "showTitle", 0x10: "showCustom", 0x20: "disableHome",
          }


          def decode_display_options(value):
              if value == 0:
                  return "none"
              parts, remaining = [], value
              for bit in sorted(DISPLAY_OPTIONS):
                  if value & bit:
                      parts.append(DISPLAY_OPTIONS[bit]); remaining &= ~bit
              if remaining != 0 or not parts:
                  return None
              return "|".join(parts)


          def decode_dimension_enum(value):
              return {-1: "match_parent", -2: "wrap_content"}.get(value)


          FLAG_DECODERS = {
              "gravity": decode_gravity,
              "layout_gravity": decode_gravity,
              "windowSoftInputMode": decode_window_soft_input_mode,
              "textStyle": decode_text_style,
              "configChanges": decode_config_changes,
              "displayOptions": decode_display_options,
          }

          DIM_ENUM_ATTRS = {"layout_width", "layout_height"}

          ENUM_TABLES = {
              "orientation": {0: "horizontal", 1: "vertical"},
              "visibility": {0: "visible", 1: "invisible", 2: "gone"},
              "textAlignment": {0: "inherit", 1: "gravity", 2: "textStart",
                                3: "textEnd", 4: "center", 5: "viewStart", 6: "viewEnd"},
              "layoutDirection": {0: "ltr", 1: "rtl", 2: "locale", 3: "inherit"},
              "typeface": {0: "normal", 1: "sans", 2: "serif", 3: "monospace"},
              "ellipsize": {0: "none", 1: "start", 2: "middle", 3: "end", 4: "marquee"},
              "capitalize": {0: "none", 1: "sentences", 2: "words", 3: "characters"},
              "imeOptions": {0: "actionUnspecified", 1: "actionNone", 2: "actionGo",
                             3: "actionSearch", 4: "actionSend", 5: "actionNext",
                             6: "actionDone", 7: "actionPrevious"},
          }

          SPECIAL_ENUM = {
              "screenOrientation": decode_screen_orientation,
              "scaleType": decode_scale_type,
              "windowLayoutInDisplayCutoutMode": decode_cutout_mode,
              "breakStrategy": decode_break_strategy,
              "hyphenationFrequency": decode_hyphenation,
          }


          def parse_raw_value(raw):
              raw = raw.strip()
              if raw.lower().startswith("0x") or raw.lower().startswith("-0x"):
                  neg = raw.startswith("-")
                  digits = raw[1:] if neg else raw
                  n = int(digits, 16)
                  return -n if neg else n
              return int(raw, 10)


          def resolve(name, category, value):
              short = name.split(":")[-1]
              if category == "dimension_enum":
                  return decode_dimension_enum(value) if short in DIM_ENUM_ATTRS else None
              if category == "flags":
                  fn = FLAG_DECODERS.get(short)
                  return fn(value) if fn else None
              if category == "enum":
                  fn = SPECIAL_ENUM.get(short)
                  if fn:
                      return fn(value)
                  table = ENUM_TABLES.get(short)
                  return table.get(value) if table else None
              return None


          ITEM_RE = re.compile(
              r'(<item\s+name="((?:android:)?[\w.]+)"[^>]*>)\s*'
              r'(-?0[xX][0-9a-fA-F]+|-?[0-9]+)\s*(</item>)'
          )


          def scan_all():
              total_fixed = 0
              total_seen = 0
              for xml_file in RES_ROOT.rglob("*.xml"):
                  try:
                      text = xml_file.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  fixed_here = []
                  def repl(m):
                      nonlocal total_seen
                      open_tag, attr_name, raw_value, close_tag = m.groups()
                      total_seen += 1
                      try:
                          value = parse_raw_value(raw_value)
                      except ValueError:
                          return m.group(0)
                      short = attr_name.split(":")[-1]
                      symbol = None
                      if short in DIM_ENUM_ATTRS:
                          symbol = decode_dimension_enum(value)
                      elif short in FLAG_DECODERS:
                          symbol = FLAG_DECODERS[short](value)
                      elif short in SPECIAL_ENUM:
                          symbol = SPECIAL_ENUM[short](value)
                      elif short in ENUM_TABLES:
                          symbol = ENUM_TABLES[short].get(value)
                      if symbol is None:
                          return m.group(0)
                      fixed_here.append(f"{attr_name}: {raw_value} -> {symbol}")
                      return f"{open_tag}{symbol}{close_tag}"
                  new_text = ITEM_RE.sub(repl, text)
                  if fixed_here:
                      xml_file.write_text(new_text, encoding="utf-8")
                      total_fixed += len(fixed_here)
                      print(f"{xml_file.name}:")
                      for line in fixed_here:
                          print(f"  - {line}")
              print(f"Proactive scan: {total_seen} inspected, {total_fixed} symbolized.")


          NUM_RE = re.compile(
              r'^(?:W:\s*)?(?P<file>\S+\.xml):(?P<line>\d+):\s*error:\s*'
              r'expected\s+(?P<category>flags|enum|dimension enum)\s+'
              r'but got \(raw string\)\s+(?P<value>-?0[xX][0-9a-fA-F]+|-?[0-9]+)'
          )

          SYM_RE = re.compile(
              r'^(?:W:\s*)?(?P<file>\S+\.xml):(?P<line>\d+):\s*error:\s*'
              r'expected\s+(?P<category>flags|enum|dimension enum)\s+'
              r'but got \(raw string\)\s+(?P<value>[A-Za-z_][A-Za-z0-9_|]*)\.?\s*$'
          )


          def find_item_span(lines, idx):
              start = None
              for i in range(idx, -1, -1):
                  if "<item" in lines[i]:
                      start = i
                      break
              if start is None:
                  return None
              end = start
              if "</item>" not in lines[start]:
                  for j in range(start + 1, min(start + 30, len(lines))):
                      end = j
                      if "</item>" in lines[j]:
                          break
              return (start, end)


          def fix_from_log(log_path):
              text = Path(log_path).read_text(encoding="utf-8", errors="ignore")

              nums, syms = [], []
              for line in text.splitlines():
                  m = NUM_RE.search(line)
                  if m:
                      nums.append(m.groupdict())
                      continue
                  m = SYM_RE.search(line)
                  if m:
                      syms.append(m.groupdict())

              if not nums and not syms:
                  print("No AAPT2 raw-value errors found in log.")
                  return 0

              by_num = {}
              for m in nums:
                  by_num.setdefault(m["file"], []).append(m)
              by_sym = {}
              for m in syms:
                  by_sym.setdefault(m["file"], []).append(m)

              total_fixed = 0
              total_dropped = 0

              for fp, entries in by_num.items():
                  p = Path(fp)
                  if not p.is_file():
                      print(f"::warning::Could not locate {fp}; skipping.")
                      continue
                  lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
                  entries.sort(key=lambda e: int(e["line"]), reverse=True)
                  for e in entries:
                      idx = int(e["line"]) - 1
                      if idx < 0 or idx >= len(lines):
                          continue
                      lt = lines[idx]
                      nm = re.search(r'name="((?:android:)?[\w.]+)"', lt)
                      attr_name = nm.group(1) if nm else None
                      cat = e["category"].replace(" ", "_")
                      try:
                          value = parse_raw_value(e["value"])
                      except ValueError:
                          value = None
                      symbol = resolve(attr_name, cat, value) if attr_name and value is not None else None
                      if symbol is not None:
                          new_line, n = re.subn(re.escape(e["value"]), symbol, lt, count=1)
                          if n:
                              lines[idx] = new_line
                              total_fixed += 1
                              print(f"FIXED {fp}:{e['line']}  {attr_name}: {e['value']} -> {symbol}")
                              continue
                      print(f"::warning::DROPPED numeric {e['category']} at {fp}:{e['line']}")
                      lines[idx] = ""
                      total_dropped += 1
                  p.write_text("".join(lines), encoding="utf-8")

              for fp, entries in by_sym.items():
                  p = Path(fp)
                  if not p.is_file():
                      continue
                  lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
                  spans = []
                  for e in entries:
                      sp = find_item_span(lines, int(e["line"]) - 1)
                      if sp:
                          spans.append((sp, e))
                  spans.sort(key=lambda s: s[0][0], reverse=True)
                  for (start, end), e in spans:
                      print(f"::warning::DROPPED invalid symbolic value at {fp}:{e['line']} (got '{e['value']}')")
                      for k in range(start, end + 1):
                          lines[k] = ""
                      total_dropped += 1
                  p.write_text("".join(lines), encoding="utf-8")

              print(f"Targeted fix: {total_fixed} symbolized, {total_dropped} dropped.")
              return total_fixed + total_dropped


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--scan-all", action="store_true")
              ap.add_argument("--fix-from-log")
              args = ap.parse_args()
              if args.scan_all:
                  scan_all()
              elif args.fix_from_log:
                  if fix_from_log(args.fix_from_log) == 0:
                      sys.exit(2)
              else:
                  ap.error("Specify --scan-all or --fix-from-log LOGFILE")


          if __name__ == "__main__":
              main()
          PYEOF

          chmod +x tools/aapt_symbol_fix.py
          echo "aapt_symbol_fix.py written."

      # ============================================================
      # 11. WRITE smali_register_fix.py
      # ============================================================
      - name: Write smali register fix script
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          cat > tools/smali_register_fix.py <<'PYEOF'
          #!/usr/bin/env python3
          """Repair 'This method requires at least N registers' by bumping .locals/.registers."""
          import re
          import sys
          from pathlib import Path

          LOG_RE = re.compile(
              r'(?P<file>\S+\.smali)\[(?P<line>\d+),\d+\]\s+'
              r'This method requires at least (?P<needed>\d+) registers'
          )
          LOCALS_RE = re.compile(r'^\s*\.locals\s+(\d+)')
          REGS_RE = re.compile(r'^\s*\.registers\s+(\d+)')


          def fix_from_log(log_path):
              text = Path(log_path).read_text(encoding="utf-8", errors="ignore")
              matches = []
              for line in text.splitlines():
                  m = LOG_RE.search(line)
                  if m:
                      matches.append(m.groupdict())
              if not matches:
                  print("No smali register errors found in log.")
                  return 0

              by_file = {}
              for m in matches:
                  by_file.setdefault(m["file"], []).append(m)

              total_fixed = 0
              for fp, entries in by_file.items():
                  p = Path(fp)
                  if not p.is_file():
                      print(f"::warning::Could not find {fp}")
                      continue
                  lines = p.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)
                  modified = False
                  for e in entries:
                      idx = int(e["line"]) - 1
                      needed = int(e["needed"])
                      found = False
                      for i in range(idx, -1, -1):
                          lm = LOCALS_RE.match(lines[i])
                          rm = REGS_RE.match(lines[i])
                          if lm:
                              cur = int(lm.group(1))
                              if cur < needed:
                                  new_val = needed + 1
                                  lines[i] = f".locals {new_val}\n"
                                  total_fixed += 1
                                  modified = True
                                  print(f"FIXED {fp}: .locals {cur} -> {new_val}")
                              found = True
                              break
                          if rm:
                              cur = int(rm.group(1))
                              if cur < needed:
                                  new_val = needed + 1
                                  lines[i] = f".registers {new_val}\n"
                                  total_fixed += 1
                                  modified = True
                                  print(f"FIXED {fp}: .registers {cur} -> {new_val}")
                              found = True
                              break
                      if not found:
                          print(f"::warning::No .locals/.registers before line {e['line']} in {fp}")
                  if modified:
                      p.write_text("".join(lines), encoding="utf-8")
              return total_fixed


          def main():
              if len(sys.argv) < 2:
                  print("Usage: smali_register_fix.py <log>")
                  sys.exit(2)
              if fix_from_log(sys.argv[1]) == 0:
                  sys.exit(2)
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF

          chmod +x tools/smali_register_fix.py
          echo "smali_register_fix.py written."

