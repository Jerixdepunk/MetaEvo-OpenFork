          #!/usr/bin/env python3
          """Split .smali files containing more than one '.class' directive.
          Exit 0 if any file was split, 2 otherwise."""
          import pathlib
          import re
          import sys

          CLASS_RE = re.compile(r"^\.class\s")


          def split_file(path):
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)
              starts = [i for i, ln in enumerate(lines) if CLASS_RE.match(ln)]
              if len(starts) <= 1:
                  return 0
              header = lines[:starts[0]]
              created = 0
              seen = set()
              for n, s in enumerate(starts):
                  end = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  block = lines[s:end]
                  if n == 0 and header:
                      block = header + block
                  descriptor = lines[s].split()[-1].rstrip(";")
                  if not descriptor.startswith("L"):
                      print(f"!! unparseable .class line in {path}:{s+1}", file=sys.stderr)
                      continue
                  rel = descriptor[1:] + ".smali"
                  if rel in seen:
                      print(f"!! duplicate class {descriptor} in {path}; keeping first", file=sys.stderr)
                      continue
                  seen.add(rel)
                  out = path.parent / rel
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_text("".join(block), encoding="utf-8")
                  created += 1
              path.unlink()
              print(f"split: {path} -> {created} class file(s)")
              return created


          def main():
              roots = [pathlib.Path(p) for p in sys.argv[1:]] or [pathlib.Path("app")]
              total = 0
              for root in roots:
                  for smali in sorted(root.rglob("*.smali")):
                      try:
                          total += split_file(smali)
                      except Exception as exc:
                          print(f"!! {smali}: {exc}", file=sys.stderr)
              print(f"total classes extracted: {total}")
              return 0 if total else 2


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF

          chmod +x tools/smali_split_fix.py

          echo "Scanning smali sources for duplicate '.class' directives..."
          set +e
          python3 tools/smali_split_fix.py app
          ss=$?
          set -e
          if [ "$ss" -eq 0 ]; then
            echo "Merged smali files were split."
          else
            echo "No merged smali files found."
          fi

