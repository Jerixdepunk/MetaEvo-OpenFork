      # ============================================================
      # 16. REPAIR MALFORMED 9-PATCH RESOURCES
      # ============================================================
      - name: Repair malformed 9-patch resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import struct
          import zlib

          root = Path("app/res")


          def read_png_rgba(path):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise ValueError("not a PNG")
              pos, width, height, color_type, bit_depth = 8, None, None, None, None
              idat = bytearray()
              while pos < len(data):
                  length = struct.unpack(">I", data[pos:pos+4])[0]
                  ctype = data[pos+4:pos+8]
                  chunk = data[pos+8:pos+8+length]
                  pos += 12 + length
                  if ctype == b'IHDR':
                      width, height, bit_depth, color_type, _, _, _ = struct.unpack(">IIBBBBB", chunk)
                  elif ctype == b'IDAT':
                      idat.extend(chunk)
                  elif ctype == b'IEND':
                      break
              if width is None or bit_depth != 8:
                  raise ValueError("bad IHDR")
              raw = zlib.decompress(bytes(idat))
              channels = 4 if color_type == 6 else (3 if color_type == 2 else 0)
              if channels == 0:
                  raise ValueError("unsupported color type")
              stride = width * channels
              rows = []
              offset = 0
              previous = bytearray(stride)
              for _ in range(height):
                  ft = raw[offset]
                  offset += 1
                  current = bytearray(raw[offset:offset+stride])
                  offset += stride
                  for i in range(stride):
                      left = current[i-channels] if i >= channels else 0
                      up = previous[i]
                      up_left = previous[i-channels] if i >= channels else 0
                      if ft == 1:
                          current[i] = (current[i] + left) & 255
                      elif ft == 2:
                          current[i] = (current[i] + up) & 255
                      elif ft == 3:
                          current[i] = (current[i] + ((left + up) // 2)) & 255
                      elif ft == 4:
                          p = left + up - up_left
                          pa = abs(p - left); pb = abs(p - up); pc = abs(p - up_left)
                          if pa <= pb and pa <= pc:
                              pr = left
                          elif pb <= pc:
                              pr = up
                          else:
                              pr = up_left
                          current[i] = (current[i] + pr) & 255
                      elif ft != 0:
                          raise ValueError(f"bad filter {ft}")
                  previous = current
                  rows.append(current)
              pixels = []
              for row in rows:
                  rp = []
                  for x in range(width):
                      b = x * channels
                      if channels == 4:
                          r, g, bl, a = row[b:b+4]
                      else:
                          r, g, bl = row[b:b+3]
                          a = 255
                      rp.append((r, g, bl, a))
                  pixels.append(rp)
              return width, height, pixels


          def is_neutral(px):
              r, g, b, a = px
              if a == 0:
                  return True
              return a == 255 and r == 255 and g == 255 and b == 255


          def is_black(px):
              r, g, b, a = px
              return a == 255 and r == 0 and g == 0 and b == 0


          def valid(path):
              try:
                  w, h, pixels = read_png_rgba(path)
              except Exception as e:
                  return False, str(e)
              if w < 3 or h < 3:
                  return False, "too small"
              top = pixels[0]
              bottom = pixels[h-1]
              left_c = [pixels[y][0] for y in range(h)]
              right_c = [pixels[y][w-1] for y in range(h)]
              for corner in (top[0], top[-1], bottom[0], bottom[-1]):
                  if not is_neutral(corner):
                      return False, "bad corner"
              for px in top[1:-1] + bottom[1:-1] + left_c[1:-1] + right_c[1:-1]:
                  if not (is_neutral(px) or is_black(px)):
                      return False, "bad frame"
              return True, None


          fixed = []
          for np in root.rglob("*.9.png"):
              ok, why = valid(np)
              if ok:
                  continue
              np.rename(np.with_name(np.name[:-6] + ".png"))
              fixed.append(f"{np.name} ({why})")

          for entry in fixed:
              print(f"REPAIRED: {entry}")
          print(f"Remaining valid .9.png: {len(list(root.rglob('*.9.png')))}")
          PY

