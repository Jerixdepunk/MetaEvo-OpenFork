          #!/usr/bin/env python3
          """Create placeholder resources for AAPT2 'resource X/Y not found' errors.
          Handles the ' (aka <pkg>:X/Y)' suffix and the trailing period.
          Exit 0 if at least one placeholder created, 2 if none."""
          import re
          import sys
          from pathlib import Path

          LOG_RE = re.compile(
              r'error:\s+resource\s+(?P<rtype>[\w.-]+)/(?P<rname>[\w.-]+)'
              r'(?:\s+\(aka\s+[^)]*\))?'
              r'\s+not found\.?'
          )

          RES_ROOT = Path("app/res")

          FILE_PLACEHOLDERS = {
              "interpolator": '<?xml version="1.0" encoding="utf-8"?>\n<linearInterpolator/>\n',
              "anim":         '<?xml version="1.0" encoding="utf-8"?>\n<set/>\n',
              "animator":     '<?xml version="1.0" encoding="utf-8"?>\n<set/>\n',
              "drawable":     ('<?xml version="1.0" encoding="utf-8"?>\n'
                               '<shape xmlns:android="http://schemas.android.com/apk/res/android">'
                               '<solid android:color="#00000000"/></shape>\n'),
              "mipmap":       ('<?xml version="1.0" encoding="utf-8"?>\n'
                               '<shape xmlns:android="http://schemas.android.com/apk/res/android">'
                               '<solid android:color="#00000000"/></shape>\n'),
              "color":        ('<?xml version="1.0" encoding="utf-8"?>\n'
                               '<selector xmlns:android="http://schemas.android.com/apk/res/android"/>\n'),
              "layout":       ('<?xml version="1.0" encoding="utf-8"?>\n'
                               '<View xmlns:android="http://schemas.android.com/apk/res/android"/>\n'),
              "xml":          ('<?xml version="1.0" encoding="utf-8"?>\n'
                               '<PreferenceScreen xmlns:android="http://schemas.android.com/apk/res/android"/>\n'),
              "menu":         ('<?xml version="1.0" encoding="utf-8"?>\n'
                               '<menu xmlns:android="http://schemas.android.com/apk/res/android"/>\n'),
          }

          VALUES_TYPES = {"string", "color", "dimen", "array", "integer",
                          "bool", "style", "plurals", "fraction", "id", "attr"}


          def entry_xml(rt, rn):
              if rt == "attr":
                  return f'    <attr name="{rn}" format="string"/>\n'
              if rt == "id":
                  return f'    <item type="id" name="{rn}"/>\n'
              if rt == "string":
                  return f'    <string name="{rn}">placeholder</string>\n'
              if rt == "color":
                  return f'    <color name="{rn}">#00000000</color>\n'
              if rt == "dimen":
                  return f'    <dimen name="{rn}">0dp</dimen>\n'
              if rt == "bool":
                  return f'    <bool name="{rn}">false</bool>\n'
              if rt == "integer":
                  return f'    <integer name="{rn}">0</integer>\n'
              return f'    <item type="{rt}" name="{rn}"/>\n'


          def create_placeholder(rt, rn):
              if rt in VALUES_TYPES:
                  p = RES_ROOT / "values" / "zz_placeholders.xml"
                  p.parent.mkdir(parents=True, exist_ok=True)
                  if not p.exists():
                      p.write_text(
                          '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n',
                          encoding="utf-8",
                      )
                  t = p.read_text(encoding="utf-8")
                  if f'name="{rn}"' in t:
                      return False
                  p.write_text(t.replace("</resources>", entry_xml(rt, rn) + "</resources>"),
                               encoding="utf-8")
                  return True

              if rt not in FILE_PLACEHOLDERS:
                  return False

              d = RES_ROOT / rt
              d.mkdir(parents=True, exist_ok=True)
              f = d / f"{rn}.xml"
              if f.exists():
                  return False
              f.write_text(FILE_PLACEHOLDERS[rt], encoding="utf-8")
              return True


          def main():
              if len(sys.argv) < 2:
                  print("Usage: missing_resources_fix.py <log>")
                  sys.exit(2)
              text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="ignore")
              ms = []
              for line in text.splitlines():
                  m = LOG_RE.search(line)
                  if m:
                      ms.append(m.groupdict())
              if not ms:
                  print("No missing-resource errors found.")
                  sys.exit(2)

              created = 0
              seen = set()
              for m in ms:
                  key = (m["rtype"], m["rname"])
                  if key in seen:
                      continue
                  seen.add(key)
                  if create_placeholder(*key):
                      print(f"CREATED placeholder: {m['rtype']}/{m['rname']}")
                      created += 1
                  else:
                      print(f"::warning::Skipped {m['rtype']}/{m['rname']} (exists or unsupported)")
              print(f"Created {created} placeholders.")
              return 0 if created else 2


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF

          chmod +x tools/missing_resources_fix.py
          echo "missing_resources_fix.py written."

      # ============================================================
      # 14. WRITE smali_syntax_fix.py
      # ============================================================
      - name: Write smali syntax fix script
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          cat > tools/smali_syntax_fix.py <<'PYEOF'
          #!/usr/bin/env python3
          """Repair 'required (...)+ loop did not match anything at input ...' errors.
          For .field lines with a malformed value, substitute 0x0.
          Otherwise, comment the offending line out."""
          import re
          import sys
          from pathlib import Path

          SYNTAX_RE = re.compile(
              r'(?P<file>\S+\.smali)\[(?P<line>\d+),(?P<col>\d+)\]\s+'
              r'required \(\.\.\.\)\+ loop did not match anything at input'
          )

          FIELD_RE = re.compile(
              r'^(\s*\.field\s+.*?[\w$]+\s*:\s*[\w/$;\[\]]+\s*=\s*)(.*?)(\s*(?:#.*)?)$'
          )


          def repair_line(line):
              s = line.rstrip("\n")
              m = FIELD_RE.match(s)
              if m:
                  pre, value, suf = m.groups()
                  v = value.strip()
                  if not v or re.fullmatch(r'-?0[xX]?', v) or v.endswith(("x", "X")):
                      return pre + "0x0" + suf + "\n", True
                  if re.search(r'\s', v):
                      return pre + v.split()[0] + suf + "\n", True
              return "# [smali_syntax_fix] " + s + "\n", True


          def fix_from_log(log_path):
              text = Path(log_path).read_text(encoding="utf-8", errors="ignore")
              matches = []
              for line in text.splitlines():
                  m = SYNTAX_RE.search(line)
                  if m:
                      matches.append(m.groupdict())
              if not matches:
                  print("No smali syntax errors found in log.")
                  return 0

              by_file = {}
              for m in matches:
                  by_file.setdefault(m["file"], []).append(m)

              total_fixed = 0
              for fp, entries in by_file.items():
                  p = Path(fp)
                  if not p.is_file():
                      print(f"::warning::Could not find {fp}")
                      continue
                  lines = p.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)
                  entries.sort(key=lambda e: int(e["line"]), reverse=True)
                  for e in entries:
                      idx = int(e["line"]) - 1
                      if idx < 0 or idx >= len(lines):
                          continue
                      new_line, fixed = repair_line(lines[idx])
                      if fixed:
                          lines[idx] = new_line
                          total_fixed += 1
                          print(f"FIXED {fp}:{e['line']}")
                      else:
                          print(f"::warning::Could not repair {fp}:{e['line']}")
                  p.write_text("".join(lines), encoding="utf-8")
              return total_fixed


          def main():
              if len(sys.argv) < 2:
                  print("Usage: smali_syntax_fix.py <log>")
                  sys.exit(2)
              if fix_from_log(sys.argv[1]) == 0:
                  sys.exit(2)
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF

          chmod +x tools/smali_syntax_fix.py
          echo "smali_syntax_fix.py written."

