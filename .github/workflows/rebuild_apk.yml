      - name: Repair merged smali sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"; mkdir -p tools
          cat > tools/smali_split_fix.py <<'PY'
          #!/usr/bin/env python3
          import pathlib, re, sys
          CLASS_RE = re.compile(r"^\.class\s")
          def split_file(path):
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)
              starts = [i for i, ln in enumerate(lines) if CLASS_RE.match(ln)]
              if len(starts) <= 1: return 0
              header = lines[:starts[0]]; created, seen = 0, set()
              for n, s in enumerate(starts):
                  end = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  block = lines[s:end]
                  if n == 0 and header: block = header + block
                  descriptor = lines[s].split()[-1].rstrip(";")
                  if not descriptor.startswith("L"): continue
                  rel = descriptor[1:] + ".smali"
                  if rel in seen: continue
                  seen.add(rel)
                  out = path.parent / rel
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_text("".join(block), encoding="utf-8")
                  created += 1
              path.unlink()
              print(f"split: {path} -> {created}")
              return created
          def main():
              roots = [pathlib.Path(p) for p in sys.argv[1:]] or [pathlib.Path("app")]
              total = 0
              for r in roots:
                  for s in sorted(r.rglob("*.smali")):
                      try: total += split_file(s)
                      except Exception as e: print(f"!! {s}: {e}", file=sys.stderr)
              print(f"total classes extracted: {total}")
              return 0 if total else 2
          if __name__ == "__main__": sys.exit(main())
          PY
          chmod +x tools/smali_split_fix.py
          echo "Scanning smali sources..."
          set +e; python3 tools/smali_split_fix.py app; split_status=$?; set -e
          if [ "$split_status" -eq 0 ]; then echo "Merged files split."; else echo "No merged files."; fi

          echo "Validating every .smali holds exactly one class..."
          python3 <<'PY'
          import pathlib, re, sys
          bad = []
          for p in pathlib.Path("app").rglob("*.smali"):
              try:
                  with open(p, encoding="utf-8", errors="replace") as fh:
                      n = sum(1 for ln in fh if re.match(r"^\.class\s", ln))
              except Exception: continue
              if n > 1: bad.append(str(p))
          if bad:
              print("::error::Still-merged:")
              for b in bad: print(f"  - {b}")
              sys.exit(1)
          print("OK: exactly one class per file.")
          PY
          echo "Smali class count (post-split):"
          find app -path '*/smali*' -type f -name '*.smali' | wc -l

