      # ============================================================
      # BUILD UNSIGNED APK (SELF-HEALING)
      #
      # Runs 6 repair scripts after each failed attempt. All scripts
      # use the same convention: exit 0 = did something, exit 2 = nothing.
      # The loop only aborts when ALL SIX report "nothing to do".
      # ============================================================
      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          rm -rf build/dist; mkdir -p build/dist
          MAX_ATTEMPTS="${MAX_BUILD_ATTEMPTS:-8}"
          attempt=1; build_ok=0

          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "=================================================="
            echo "Build attempt $attempt of $MAX_ATTEMPTS"
            echo "=================================================="
            LOG_FILE="build_attempt_${attempt}.log"
            set +e
            ./gradlew assembleOpenFork --no-daemon --stacktrace 2>&1 | tee "$LOG_FILE"
            status="${PIPESTATUS[0]}"
            set -e
            if [ "$status" -eq 0 ]; then
              echo "Build succeeded on attempt $attempt."
              build_ok=1; break
            fi
            echo "Build attempt $attempt failed (exit $status)."
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Build failed after $MAX_ATTEMPTS attempts."
              cat "$LOG_FILE"; exit 1
            fi
            echo "Attempting automatic repair..."

            set +e; python3 tools/aapt_symbol_fix.py --fix-from-log "$LOG_FILE"; fix_status=$?; set -e
            set +e; python3 tools/smali_split_fix.py app;                         smali_status=$?; set -e
            set +e; python3 tools/smali_register_fix.py "$LOG_FILE";              reg_status=$?; set -e
            set +e; python3 tools/attrs_alpha_fix.py;                             alpha_status=$?; set -e
            set +e; python3 tools/missing_resources_fix.py "$LOG_FILE";           res_status=$?; set -e
            set +e; python3 tools/smali_syntax_fix.py "$LOG_FILE";                syn_status=$?; set -e

            # Abort only if EVERY script reported "nothing to do" (exit 2).
            if [ "$fix_status"   -eq 2 ] && \
               [ "$smali_status" -eq 2 ] && \
               [ "$reg_status"   -eq 2 ] && \
               [ "$alpha_status" -eq 2 ] && \
               [ "$res_status"   -eq 2 ] && \
               [ "$syn_status"   -eq 2 ]; then
              echo "::error::Build failed and no known repair pattern matched."
              echo "  - aapt_symbol_fix:      exit 2 (no raw-value errors)"
              echo "  - smali_split_fix:      exit 2 (no merged files)"
              echo "  - smali_register_fix:   exit 2 (no register errors)"
              echo "  - attrs_alpha_fix:      exit 2 (alpha already present)"
              echo "  - missing_resources_fix:exit 2 (no missing resources)"
              echo "  - smali_syntax_fix:     exit 2 (no syntax errors)"
              echo "Full log of failed attempt:"
              cat "$LOG_FILE"
              exit 1
            fi
            attempt=$((attempt+1))
          done

          if [ "$build_ok" -ne 1 ]; then
            echo "::error::Build did not succeed."; exit 1
          fi
          APK="$PROJECT_DIR/build/dist/MetaEvo-OpenFork-unsigned.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Expected unsigned APK was not produced."
            find "$PROJECT_DIR/build" -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi
          echo "Unsigned APK created:"; ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -v -p 4 \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk" \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"
          test -s "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"
          ls -lh "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"

      - name: Sign APK (ephemeral debug keystore)
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          KEYTOOL="$JAVA_HOME/bin/keytool"
          KEYSTORE="$RUNNER_TEMP/openfork-debug.keystore"
          "$KEYTOOL" -genkeypair -v -keystore "$KEYSTORE" -storepass android \
            -alias openfork-debug -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=MetaEvo OpenFork Debug, OU=CI, O=CI, L=CI, S=CI, C=US"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android \
            --ks-key-alias openfork-debug --key-pass pass:android \
            --out "$GITHUB_WORKSPACE/MetaEvo-OpenFork-signed.apk" \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"
          "$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/MetaEvo-OpenFork-signed.apk"
          ls -lh "$GITHUB_WORKSPACE/MetaEvo-OpenFork-signed.apk"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          sha256sum MetaEvo-OpenFork-unsigned.apk MetaEvo-OpenFork-aligned.apk MetaEvo-OpenFork-signed.apk \
            > MetaEvo-OpenFork-checksums.sha256
          cat MetaEvo-OpenFork-checksums.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-build
          path: |
            MetaEvo-OpenFork-signed.apk
            MetaEvo-OpenFork-aligned.apk
            MetaEvo-OpenFork-unsigned.apk
            MetaEvo-OpenFork-checksums.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: extracted/**/build_attempt_*.log
          if-no-files-found: ignore
          retention-days: 7
