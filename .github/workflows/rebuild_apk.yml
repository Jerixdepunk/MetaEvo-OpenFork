      # ============================================================
      # 20. BUILD UNSIGNED APK (SELF-HEALING)
      #
      # Each retry runs SIX repair scripts. All scripts follow the
      # convention: exit 0 = changed something, exit 2 = nothing to do.
      # The loop aborts only when ALL SIX report 2.
      # ============================================================
      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          rm -rf build/dist
          mkdir -p build/dist

          MAX="${MAX_BUILD_ATTEMPTS:-8}"
          attempt=1
          build_ok=0

          while [ "$attempt" -le "$MAX" ]; do
            echo "=================================================="
            echo "Build attempt $attempt of $MAX"
            echo "=================================================="

            LOG="build_attempt_${attempt}.log"

            set +e
            ./gradlew assembleOpenFork --no-daemon --stacktrace 2>&1 | tee "$LOG"
            status="${PIPESTATUS[0]}"
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Build succeeded on attempt $attempt."
              build_ok=1
              break
            fi

            echo "Build attempt $attempt failed (exit $status)."

            if [ "$attempt" -ge "$MAX" ]; then
              echo "::error::Build failed after $MAX attempts. Full log of final attempt:"
              cat "$LOG"
              exit 1
            fi

            echo "Attempting automatic repair..."

            set +e
            python3 tools/aapt_symbol_fix.py --fix-from-log "$LOG";       S1=$?
            python3 tools/smali_split_fix.py app;                         S2=$?
            python3 tools/smali_register_fix.py "$LOG";                   S3=$?
            python3 tools/attrs_alpha_fix.py;                             S4=$?
            python3 tools/missing_resources_fix.py "$LOG";                S5=$?
            python3 tools/smali_syntax_fix.py "$LOG";                     S6=$?
            set -e

            echo "Repair status: aapt=$S1  smali_split=$S2  register=$S3  alpha=$S4  missing_res=$S5  syntax=$S6"

            if [ "$S1" -eq 2 ] && [ "$S2" -eq 2 ] && [ "$S3" -eq 2 ] && \
               [ "$S4" -eq 2 ] && [ "$S5" -eq 2 ] && [ "$S6" -eq 2 ]; then
              echo "::error::Build failed and no known repair pattern matched."
              echo "Full log of failed attempt:"
              cat "$LOG"
              exit 1
            fi

            attempt=$((attempt + 1))
          done

          if [ "$build_ok" -ne 1 ]; then
            echo "::error::Build did not succeed."
            exit 1
          fi

          APK="$PROJECT_DIR/build/dist/MetaEvo-OpenFork-unsigned.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Expected unsigned APK was not produced."
            find "$PROJECT_DIR/build" -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          echo "Unsigned APK created:"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk"

      # ============================================================
      # 21. ZIPALIGN
      # ============================================================
      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail
          Z="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$Z" -v -p 4 \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-unsigned.apk" \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"
          test -s "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"
          ls -lh "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"

      # ============================================================
      # 22. SIGN APK (ephemeral debug keystore)
      # ============================================================
      - name: Sign APK (ephemeral debug keystore)
        shell: bash
        run: |
          set -euo pipefail
          AS="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          KT="$JAVA_HOME/bin/keytool"
          KS="$RUNNER_TEMP/openfork-debug.keystore"

          "$KT" -genkeypair -v -keystore "$KS" \
            -storepass android -alias openfork-debug -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MetaEvo OpenFork Debug, OU=CI, O=CI, L=CI, S=CI, C=US"

          "$AS" sign --ks "$KS" --ks-pass pass:android \
            --ks-key-alias openfork-debug --key-pass pass:android \
            --out "$GITHUB_WORKSPACE/MetaEvo-OpenFork-signed.apk" \
            "$GITHUB_WORKSPACE/MetaEvo-OpenFork-aligned.apk"

          "$AS" verify --print-certs "$GITHUB_WORKSPACE/MetaEvo-OpenFork-signed.apk"
          ls -lh "$GITHUB_WORKSPACE/MetaEvo-OpenFork-signed.apk"

      # ============================================================
      # 23. CHECKSUMS
      # ============================================================
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          sha256sum \
            MetaEvo-OpenFork-unsigned.apk \
            MetaEvo-OpenFork-aligned.apk \
            MetaEvo-OpenFork-signed.apk \
            > MetaEvo-OpenFork-checksums.sha256
          cat MetaEvo-OpenFork-checksums.sha256

      # ============================================================
      # 24. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaEvo-OpenFork-build
          path: |
            MetaEvo-OpenFork-signed.apk
            MetaEvo-OpenFork-aligned.apk
            MetaEvo-OpenFork-unsigned.apk
            MetaEvo-OpenFork-checksums.sha256
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 25. UPLOAD BUILD LOGS ON FAILURE
      # ============================================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: extracted/**/build_attempt_*.log
          if-no-files-found: ignore
          retention-days: 7
