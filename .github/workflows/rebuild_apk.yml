name: Build MetaEvo OpenFork from Parts

on:
  workflow_dispatch:
    inputs:
      strict_hash_check:
        description: "Fail the run if SHA-256 hashes differ from the values recorded in this workflow"
        required: false
        type: boolean
        default: false
      max_build_attempts:
        description: "Maximum number of Gradle build attempts"
        required: false
        type: number
        default: 8

permissions:
  contents: read

jobs:
  build:
    name: Rebuild and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      STRICT_HASH_CHECK: ${{ inputs.strict_hash_check }}
      MAX_BUILD_ATTEMPTS: ${{ inputs.max_build_attempts }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP parts
        shell: bash
        run: |
          set -euo pipefail
          PARTS="MetaEvo_OpenFork_BuildSystem.zip.part-aa MetaEvo_OpenFork_BuildSystem.zip.part-ab MetaEvo_OpenFork_BuildSystem.zip.part-ac"
          for f in $PARTS; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done
          echo "All ZIP parts found."
          ls -lh $PARTS

          declare -A EXPECTED_SHA=(
            [MetaEvo_OpenFork_BuildSystem.zip.part-aa]="e6429a7abaddebcb08429a1fca30a348a526f54d0dad869eaf6e30bcbda2ba10"
            [MetaEvo_OpenFork_BuildSystem.zip.part-ab]="00f7ffdfae415401a3b6714b42309e5aa605c3d4dff7a1b806c938eb1647abe6"
            [MetaEvo_OpenFork_BuildSystem.zip.part-ac]="d4fc4c210adfed9b5c6870a309d98cce89ece417f8b699313d7a280cac269756"
          )
          mismatch=0
          for f in $PARTS; do
            actual="$(sha256sum "$f" | awk '{print $1}')"
            expected="${EXPECTED_SHA[$f]}"
            echo; echo "File:     $f"; echo "Expected: $expected"; echo "Actual:   $actual"
            if [ "$actual" != "$expected" ]; then
              mismatch=1
              echo "::warning::SHA-256 mismatch for $f"
              echo "  [$f]=\"$actual\""
            else
              echo "SHA-256 OK: $f"
            fi
          done
          if [ "$mismatch" -ne 0 ]; then
            if [ "${STRICT_HASH_CHECK:-false}" = "true" ]; then
              echo "::error::SHA-256 mismatch (strict_hash_check enabled)."; exit 1
            fi
            echo "::warning::Hash mismatch(es) ignored (strict mode off). Continuing."
          fi

      - name: Reassemble project ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat \
            MetaEvo_OpenFork_BuildSystem.zip.part-aa \
            MetaEvo_OpenFork_BuildSystem.zip.part-ab \
            MetaEvo_OpenFork_BuildSystem.zip.part-ac \
            > MetaEvo_OpenFork_BuildSystem.zip
          ls -lh MetaEvo_OpenFork_BuildSystem.zip

      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="6f8325bfeb12db2a51f98ac6246ae5ff1acb2132042a52e06cb35f4bf50e2db9"
          ACTUAL="$(sha256sum MetaEvo_OpenFork_BuildSystem.zip | awk '{print $1}')"
          echo "Expected: $EXPECTED"; echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            if [ "${STRICT_HASH_CHECK:-false}" = "true" ]; then
              echo "::error::ZIP checksum mismatch (strict mode)."; exit 1
            fi
            echo "::warning::ZIP checksum mismatch ignored (strict off)."
            echo "Set EXPECTED to: $ACTUAL"
          else
            echo "ZIP checksum verified."
          fi
          unzip -t MetaEvo_OpenFork_BuildSystem.zip
          echo "ZIP integrity verified."

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted; mkdir -p extracted
          unzip -q MetaEvo_OpenFork_BuildSystem.zip -d extracted
          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/extracted" -type f -name settings.gradle.kts -print -quit | xargs -r dirname
          )"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts not found."; exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f app/AndroidManifest.xml
          test -f app/apktool.yml
          test -f tools/bootstrap-apktool.sh
          test -f tools/verify-source.sh
          chmod +x gradlew tools/bootstrap-apktool.sh tools/verify-source.sh
          echo "Smali class count (pre-split):"
          find app -path '*/smali*' -type f -name '*.smali' | wc -l

      - name: Normalize Apktool metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path("app/apktool.yml")
          text = path.read_text(encoding="utf-8")
          original = text
          pattern = re.compile(r'^(\s*versionCode:\s*)(["\'])([0-9]+)\2(\s*)$', re.MULTILINE)
          text = pattern.sub(lambda m: f"{m.group(1)}{m.group(3)}{m.group(4)}", text)
          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Quoted versionCode normalized.")
          m = re.search(r'^\s*versionCode:\s*([0-9]+)\s*$', text, re.MULTILINE)
          if not m:
              raise SystemExit("ERROR: versionCode missing or non-numeric.")
          print("Validated versionCode:", m.group(1))
          PY

      - name: Bootstrap Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          APKTOOL_URL="https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
          APKTOOL_SHA256="dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"
          mkdir -p tools; rm -f tools/apktool.jar
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors -o tools/apktool.jar "$APKTOOL_URL"
          test -s tools/apktool.jar
          echo "$APKTOOL_SHA256  tools/apktool.jar" | sha256sum -c -
          java -jar tools/apktool.jar --version

      - name: Prune orphaned public.xml declarations
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 <<'PY'
          from pathlib import Path
          import re
          res = Path("app/res")
          public_xml_path = res / "values" / "public.xml"
          if not public_xml_path.exists():
              print("public.xml not found; skipping.")
              raise SystemExit(0)
          text = public_xml_path.read_text(encoding="utf-8")
          declared = set()
          name_tag_re = re.compile(r'<([\w.-]+)\b([^>]*)/?>')
          attr_pair_re = re.compile(r'([\w:.-]+)\s*=\s*"([^"]*)"')
          for xml_file in res.rglob("*.xml"):
              if xml_file == public_xml_path: continue
              try: content = xml_file.read_text(encoding="utf-8", errors="ignore")
              except Exception: continue
              for m in name_tag_re.finditer(content):
                  tag = m.group(1); attrs = dict(attr_pair_re.findall(m.group(2)))
                  name = attrs.get("name")
                  if not name: continue
                  if tag == "item":
                      rtype = attrs.get("type")
                      if rtype: declared.add((rtype, name))
                  else:
                      declared.add((tag, name))
          for entry in res.iterdir():
              if not entry.is_dir(): continue
              if entry.name == "values" or entry.name.startswith("values-"): continue
              rtype = entry.name.split("-")[0]
              for f in entry.iterdir():
                  if f.is_file(): declared.add((rtype, f.stem))
          def resource_exists(rtype, name): return (rtype, name) in declared
          pattern = re.compile(r'<public\s+([^>]*?)/>', re.DOTALL)
          removed = []
          def repl(m):
              attrs = dict(attr_pair_re.findall(m.group(1)))
              rtype = attrs.get("type"); name = attrs.get("name")
              if rtype and name and not resource_exists(rtype, name):
                  removed.append(f"{rtype}/{name}"); return ""
              return m.group(0)
          new_text = pattern.sub(repl, text)
          if removed:
              public_xml_path.write_text(new_text, encoding="utf-8")
              print(f"Removed {len(removed)} orphaned declarations.")
          else:
              print("No orphaned declarations found.")
          PY

      # ============================================================
      # WRITE SHARED AAPT2 SYMBOL RESOLVER (raw enum/flags values)
      # ============================================================
      - name: Write shared AAPT2 symbol resolver
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"; mkdir -p tools
          cat > tools/aapt_symbol_fix.py <<'PYEOF'
          #!/usr/bin/env python3
          import argparse, re, sys
          from pathlib import Path
          RES_ROOT = Path("app/res")

          def decode_gravity(value):
              RELATIVE = 0x800000; relative = bool(value & RELATIVE); v = value & ~RELATIVE
              EXACT = {0x11: "center", 0x77: "fill"}
              VMASK = {0x70: "fill_vertical", 0x50: "bottom", 0x30: "top", 0x10: "center_vertical"}
              HMASK = {0x07: "fill_horizontal", 0x05: "right", 0x03: "left", 0x01: "center_horizontal"}
              if v in EXACT and not relative: return EXACT[v]
              parts, remaining = [], v
              vmask = v & 0x70
              if vmask in VMASK: parts.append(VMASK[vmask]); remaining &= ~0x70
              hmask = v & 0x07
              if hmask in HMASK:
                  name = HMASK[hmask]
                  if relative: name = {"left":"start","right":"end"}.get(name, name)
                  parts.append(name); remaining &= ~0x07
              if v & 0x80: parts.append("clip_vertical"); remaining &= ~0x80
              if v & 0x08: parts.append("clip_horizontal"); remaining &= ~0x08
              if remaining != 0 or not parts: return None
              return "|".join(parts)

          def decode_window_soft_input_mode(value):
              if value < 0 or value & ~0xFF: return None
              STATE = {0:"stateUnspecified",1:"stateUnchanged",2:"stateHidden",3:"stateAlwaysHidden",4:"stateVisible",5:"stateAlwaysVisible"}
              ADJUST = {0x00:"adjustUnspecified",0x10:"adjustResize",0x20:"adjustPan",0x30:"adjustNothing"}
              sb = value & 0x0F; ab = value & 0xF0
              if sb not in STATE or ab not in ADJUST: return None
              if value == 0: return "stateUnspecified"
              parts = []
              if sb != 0: parts.append(STATE[sb])
              if ab != 0: parts.append(ADJUST[ab])
              if not parts: parts.append("stateUnspecified")
              return "|".join(parts)

          def decode_text_style(value):
              if value == 0: return "normal"
              parts = []
              if value & 1: parts.append("bold")
              if value & 2: parts.append("italic")
              remaining = value & ~0x3
              if remaining != 0 or not parts: return None
              return "|".join(parts)

          def decode_screen_orientation(value):
              return {0:"landscape",1:"portrait",2:"user",3:"behind",4:"sensor",5:"nosensor",6:"sensorLandscape",
                      7:"sensorPortrait",8:"reverseLandscape",9:"reversePortrait",10:"fullSensor",11:"userLandscape",
                      12:"userPortrait",13:"fullUser",14:"locked"}.get(value)

          CONFIG_CHANGE_FLAGS = {0x0001:"mcc",0x0002:"mnc",0x0004:"locale",0x0008:"touchscreen",0x0010:"keyboard",
                                 0x0020:"keyboardHidden",0x0040:"navigation",0x0080:"orientation",0x0100:"screenLayout",
                                 0x0200:"uiMode",0x0400:"screenSize",0x0800:"smallestScreenSize",0x1000:"density",
                                 0x2000:"layoutDirection",0x40000000:"fontScale"}
          def decode_config_changes(value):
              parts, remaining = [], value
              for bit in sorted(CONFIG_CHANGE_FLAGS.keys()):
                  if value & bit: parts.append(CONFIG_CHANGE_FLAGS[bit]); remaining &= ~bit
              if remaining != 0 or not parts: return None
              return "|".join(parts)

          def decode_scale_type(value):
              return {0:"matrix",1:"fitXY",2:"fitStart",3:"fitCenter",4:"fitEnd",5:"center",6:"centerCrop",7:"centerInside"}.get(value)
          def decode_window_layout_in_display_cutout_mode(value):
              return {0:"default",1:"shortEdges",2:"never",3:"always"}.get(value)
          def decode_break_strategy(value):
              return {0:"simple",1:"high_quality",2:"balanced"}.get(value)
          def decode_hyphenation_frequency(value):
              return {0:"none",1:"normal",2:"full"}.get(value)

          DISPLAY_OPTIONS_FLAGS = {0x1:"useLogo",0x2:"showHome",0x4:"homeAsUp",0x8:"showTitle",0x10:"showCustom",0x20:"disableHome"}
          def decode_display_options(value):
              if value == 0: return "none"
              parts, remaining = [], value
              for bit in sorted(DISPLAY_OPTIONS_FLAGS.keys()):
                  if value & bit: parts.append(DISPLAY_OPTIONS_FLAGS[bit]); remaining &= ~bit
              if remaining != 0 or not parts: return None
              return "|".join(parts)

          def decode_dimension_enum(value):
              return {-1:"match_parent",-2:"wrap_content"}.get(value)

          FLAG_DECODERS = {"gravity":decode_gravity,"layout_gravity":decode_gravity,
                           "windowSoftInputMode":decode_window_soft_input_mode,"textStyle":decode_text_style,
                           "configChanges":decode_config_changes,"displayOptions":decode_display_options}
          DIMENSION_ENUM_ATTRS = {"layout_width","layout_height"}
          ENUM_TABLES = {
              "orientation":{0:"horizontal",1:"vertical"},
              "visibility":{0:"visible",1:"invisible",2:"gone"},
              "textAlignment":{0:"inherit",1:"gravity",2:"textStart",3:"textEnd",4:"center",5:"viewStart",6:"viewEnd"},
              "layoutDirection":{0:"ltr",1:"rtl",2:"locale",3:"inherit"},
              "typeface":{0:"normal",1:"sans",2:"serif",3:"monospace"},
              "ellipsize":{0:"none",1:"start",2:"middle",3:"end",4:"marquee"},
              "capitalize":{0:"none",1:"sentences",2:"words",3:"characters"},
              "imeOptions":{0:"actionUnspecified",1:"actionNone",2:"actionGo",3:"actionSearch",4:"actionSend",
                            5:"actionNext",6:"actionDone",7:"actionPrevious"},
          }

          def parse_raw_value(v):
              v = v.strip()
              if v.lower().startswith("0x") or v.lower().startswith("-0x"):
                  neg = v.startswith("-"); digits = v[1:] if neg else v
                  n = int(digits, 16); return -n if neg else n
              return int(v, 10)

          def resolve_symbol(attr_name, category, value):
              sn = attr_name.split(":")[-1]
              if category == "dimension_enum":
                  return decode_dimension_enum(value) if sn in DIMENSION_ENUM_ATTRS else None
              if category == "flags":
                  d = FLAG_DECODERS.get(sn); return d(value) if d else None
              if category == "enum":
                  if sn == "screenOrientation": return decode_screen_orientation(value)
                  if sn == "scaleType": return decode_scale_type(value)
                  if sn == "windowLayoutInDisplayCutoutMode": return decode_window_layout_in_display_cutout_mode(value)
                  if sn == "breakStrategy": return decode_break_strategy(value)
                  if sn == "hyphenationFrequency": return decode_hyphenation_frequency(value)
                  t = ENUM_TABLES.get(sn); return t.get(value) if t else None
              return None

          ITEM_RE = re.compile(r'(<item\s+name="((?:android:)?[\w.]+)"[^>]*>)\s*(-?0[xX][0-9a-fA-F]+|-?[0-9]+)\s*(</item>)')

          def scan_all():
              total_fixed = total_seen = 0
              for xml_file in RES_ROOT.rglob("*.xml"):
                  try: text = xml_file.read_text(encoding="utf-8")
                  except Exception: continue
                  fixed_here = []
                  def repl(m):
                      nonlocal total_seen
                      open_tag, attr_name, raw_value, close_tag = m.groups()
                      total_seen += 1
                      try: value = parse_raw_value(raw_value)
                      except ValueError: return m.group(0)
                      sn = attr_name.split(":")[-1]; symbol = None
                      if sn in DIMENSION_ENUM_ATTRS: symbol = decode_dimension_enum(value)
                      elif sn in FLAG_DECODERS: symbol = FLAG_DECODERS[sn](value)
                      elif sn == "screenOrientation": symbol = decode_screen_orientation(value)
                      elif sn == "scaleType": symbol = decode_scale_type(value)
                      elif sn == "windowLayoutInDisplayCutoutMode": symbol = decode_window_layout_in_display_cutout_mode(value)
                      elif sn == "breakStrategy": symbol = decode_break_strategy(value)
                      elif sn == "hyphenationFrequency": symbol = decode_hyphenation_frequency(value)
                      elif sn in ENUM_TABLES: symbol = ENUM_TABLES[sn].get(value)
                      if symbol is None: return m.group(0)
                      fixed_here.append(f"{attr_name}: {raw_value} -> {symbol}")
                      return f"{open_tag}{symbol}{close_tag}"
                  new_text = ITEM_RE.sub(repl, text)
                  if fixed_here:
                      xml_file.write_text(new_text, encoding="utf-8")
                      total_fixed += len(fixed_here)
                      print(f"{xml_file.relative_to(RES_ROOT)}:")
                      for l in fixed_here: print("  -", l)
              print(f"Proactive scan: {total_seen} items inspected, {total_fixed} symbolized.")

          LOG_NUMERIC_RE = re.compile(
              r'^(?:W:\s*)?(?P<file>\S+\.xml):(?P<line>\d+):\s*error:\s*'
              r'expected\s+(?P<category>flags|enum|dimension enum)\s+'
              r'but got \(raw string\)\s+(?P<value>-?0[xX][0-9a-fA-F]+|-?[0-9]+)'
          )
          LOG_SYMBOLIC_RE = re.compile(
              r'^(?:W:\s*)?(?P<file>\S+\.xml):(?P<line>\d+):\s*error:\s*'
              r'expected\s+(?P<category>flags|enum|dimension enum)\s+'
              r'but got \(raw string\)\s+(?P<value>[A-Za-z_][A-Za-z0-9_|]*)\.?\s*$'
          )

          def _item_span(lines, idx):
              start = None
              for i in range(idx, -1, -1):
                  if '<item' in lines[i]: start = i; break
              if start is None: return None
              end = start
              if '</item>' not in lines[start]:
                  for j in range(start + 1, min(start + 20, len(lines))):
                      end = j
                      if '</item>' in lines[j]: break
              return (start, end)

          def fix_from_log(log_path):
              text = Path(log_path).read_text(encoding="utf-8", errors="ignore")
              numeric_matches, symbolic_matches = [], []
              for line in text.splitlines():
                  m1 = LOG_NUMERIC_RE.search(line)
                  if m1: numeric_matches.append(m1.groupdict()); continue
                  m2 = LOG_SYMBOLIC_RE.search(line)
                  if m2: symbolic_matches.append(m2.groupdict())
              if not numeric_matches and not symbolic_matches:
                  print("No AAPT2 raw-value errors found in log.")
                  return 0
              by_file_numeric = {}
              for m in numeric_matches: by_file_numeric.setdefault(m["file"], []).append(m)
              by_file_symbolic = {}
              for m in symbolic_matches: by_file_symbolic.setdefault(m["file"], []).append(m)
              total_fixed = total_dropped = 0
              for fp, entries in by_file_numeric.items():
                  p = Path(fp)
                  if not p.is_file(): continue
                  lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
                  entries.sort(key=lambda e: int(e["line"]), reverse=True)
                  for e in entries:
                      idx = int(e["line"]) - 1
                      if idx < 0 or idx >= len(lines): continue
                      lt = lines[idx]
                      nm = re.search(r'name="((?:android:)?[\w.]+)"', lt)
                      an = nm.group(1) if nm else None
                      ck = e["category"].replace(" ", "_")
                      try: v = parse_raw_value(e["value"])
                      except ValueError: v = None
                      sym = resolve_symbol(an, ck, v) if an and v is not None else None
                      if sym is not None:
                          nl, n = re.subn(re.escape(e["value"]), sym, lt, count=1)
                          if n:
                              lines[idx] = nl; total_fixed += 1
                              print(f"FIXED {fp}:{e['line']} {an}: {e['value']} -> {sym}")
                              continue
                      print(f"::warning::DROPPED numeric {e['category']} at {fp}:{e['line']}")
                      lines[idx] = ""; total_dropped += 1
                  p.write_text("".join(lines), encoding="utf-8")
              for fp, entries in by_file_symbolic.items():
                  p = Path(fp)
                  if not p.is_file(): continue
                  lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
                  spans = []
                  for e in entries:
                      idx = int(e["line"]) - 1
                      span = _item_span(lines, idx)
                      if span: spans.append((span, e))
                  spans.sort(key=lambda s: s[0][0], reverse=True)
                  for (start, end), e in spans:
                      print(f"::warning::DROPPED invalid symbolic item at {fp}:{e['line']} (value '{e['value']}')")
                      for k in range(start, end + 1): lines[k] = ""
                      total_dropped += 1
                  p.write_text("".join(lines), encoding="utf-8")
              print(f"Targeted fix: {total_fixed} symbolized, {total_dropped} dropped.")
              return total_fixed + total_dropped

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--scan-all", action="store_true")
              ap.add_argument("--fix-from-log")
              args = ap.parse_args()
              if args.scan_all: scan_all()
              elif args.fix_from_log:
                  if fix_from_log(args.fix_from_log) == 0: sys.exit(2)
              else: ap.error("Specify --scan-all or --fix-from-log")

          if __name__ == "__main__": main()
          PYEOF
          echo "aapt_symbol_fix.py written."

      # ============================================================
      # WRITE SMALI REGISTER FIX SCRIPT
      # ============================================================
      - name: Write smali register fix script
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"; mkdir -p tools
          cat > tools/smali_register_fix.py <<'PYEOF'
          #!/usr/bin/env python3
          import re, sys
          from pathlib import Path

          LOG_RE = re.compile(r'(?P<file>\S+\.smali)\[(?P<line>\d+),\d+\]\s+This method requires at least (?P<needed>\d+) registers')
          LOCALS_RE = re.compile(r'^\s*\.locals\s+(\d+)')
          REGISTERS_RE = re.compile(r'^\s*\.registers\s+(\d+)')

          def fix_from_log(log_path):
              text = Path(log_path).read_text(encoding='utf-8', errors='ignore')
              matches = []
              for line in text.splitlines():
                  m = LOG_RE.search(line)
                  if m: matches.append(m.groupdict())
              if not matches:
                  print("No smali register errors found in log.")
                  return 0
              by_file = {}
              for m in matches: by_file.setdefault(m['file'], []).append(m)
              total_fixed = 0
              for fp, entries in by_file.items():
                  p = Path(fp)
                  if not p.is_file():
                      print(f"::warning::Not found {fp}"); continue
                  lines = p.read_text(encoding='utf-8', errors='replace').splitlines(keepends=True)
                  modified = False
                  for e in entries:
                      li = int(e['line']) - 1; needed = int(e['needed']); found = False
                      for i in range(li, -1, -1):
                          lm = LOCALS_RE.match(lines[i]); rm = REGISTERS_RE.match(lines[i])
                          if lm:
                              cur = int(lm.group(1))
                              if cur < needed:
                                  nv = needed + 1; lines[i] = f'.locals {nv}\n'; total_fixed += 1; modified = True
                                  print(f"FIXED {fp}: .locals {cur} -> {nv}")
                              found = True; break
                          if rm:
                              cur = int(rm.group(1))
                              if cur < needed:
                                  nv = needed + 1; lines[i] = f'.registers {nv}\n'; total_fixed += 1; modified = True
                                  print(f"FIXED {fp}: .registers {cur} -> {nv}")
                              found = True; break
                      if not found:
                          print(f"::warning::No .locals/.registers before line {e['line']} in {fp}")
                  if modified: p.write_text(''.join(lines), encoding='utf-8')
              return total_fixed

          def main():
              if len(sys.argv) < 2:
                  print("Usage: smali_register_fix.py <log>"); sys.exit(2)
              if fix_from_log(sys.argv[1]) == 0: sys.exit(2)
              return 0

          if __name__ == "__main__": sys.exit(main())
          PYEOF
          echo "smali_register_fix.py written."

